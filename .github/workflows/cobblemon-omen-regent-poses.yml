name: Omen Regent Real Blockbench Evidence

on:
  push:
    branches: ['feat/absol-omen-regent']
    paths:
      - '.github/workflows/cobblemon-omen-regent-poses.yml'
      - 'tools/cobblemon-model-review/blockbench_capture.mjs'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png'
  pull_request:
    paths:
      - '.github/workflows/cobblemon-omen-regent-poses.yml'
      - 'tools/cobblemon-model-review/blockbench_capture.mjs'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: omen-regent-blockbench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  BLOCKBENCH_VERSION: 5.1.6
  BLOCKBENCH_SHA256: c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install viewer dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64
      - name: Download exact official Cobblemon assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pose/official
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .pose/version.json
          python - <<'PY' > .pose/env
          import json,shlex
          d=json.load(open('.pose/version.json')); p=next(f for f in d['files'] if f.get('primary')); assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1']; print('URL='+shlex.quote(p['url'])); print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .pose/env; curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .pose/cobblemon.jar; printf '%s  %s\n' "$SHA512" .pose/cobblemon.jar | sha512sum --check --strict
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0359_absol/absol.geo.json' > .pose/official/absol.geo.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0359_absol/absol.animation.json' > .pose/official/absol.animation.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/textures/pokemon/0359_absol/absol.png' > .pose/official/absol.png
          test "$(sha256sum .pose/official/absol.geo.json|awk '{print $1}')" = ed8b82b60caaeb0ee8b97597b5bd194a52d52d671da7bbc0eb35aa8dd864d462
          test "$(sha256sum .pose/official/absol.animation.json|awk '{print $1}')" = 3e706148f3159fb60b51acd8221d4a1292306a8a780ab4b69a874eb72700ece4
          test "$(sha256sum .pose/official/absol.png|awk '{print $1}')" = 9f0ce5dcf5ccc6bcb24e6821f2ee7c8dbd572c0e9ce8634a548d1ec8b1fc26e7
      - name: Prove official anatomy remains exact
        run: python tools/cobblemon-model-review/validate_original_model.py --official .pose/official/absol.geo.json --candidate fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json
      - name: Build exact review texture
        run: |
          python - <<'PY'
          from PIL import Image
          base=Image.open('.pose/official/absol.png').convert('RGBA'); overlay=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png').convert('RGBA'); assert base.size==overlay.size==(128,128); Image.alpha_composite(base,overlay).save('.pose/omen.png',optimize=True)
          PY
      - name: Download pinned Blockbench
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" -o .pose/blockbench.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" .pose/blockbench.AppImage | sha256sum --check --strict
          chmod +x .pose/blockbench.AppImage; (cd .pose && ./blockbench.AppImage --appimage-extract >/dev/null)
      - name: Render official reference, hero and cry in Blockbench
        shell: bash
        run: |
          set -euo pipefail
          root='test-evidence/visual/cobblemon-skins/0359_absol/omen-regent-real-poses'; rm -rf "$root" .pose/renders; mkdir -p "$root" .pose/renders
          render_model() {
            model="$1"; texture="$2"; animation="$3"; frame="$4"; output="$5"; port="$6"; name="$7"; userdata="$PWD/.pose/user-$name"; log="$PWD/.pose/$name.log"; rm -rf "$userdata" "$output"; mkdir -p "$userdata" "$output"
            xvfb-run -a -s '-screen 0 1600x1200x24' env APPDIR="$PWD/.pose/squashfs-root" .pose/squashfs-root/AppRun --no-sandbox --disable-gpu --disable-gpu-sandbox --disable-vulkan --use-gl=swiftshader --remote-debugging-port="$port" --userData "$userdata" "$model" > "$log" 2>&1 & pid=$!
            ready=0; for _ in $(seq 1 90); do if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi; if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; return 1; fi; sleep 1; done; test "$ready" = 1
            node tools/cobblemon-model-review/blockbench_capture.mjs --endpoint "http://127.0.0.1:${port}" --texture "$texture" --animation "$PWD/.pose/official/absol.animation.json" --animation-name "$animation" --animation-time "$frame" --output-dir "$output"; kill "$pid" 2>/dev/null || true; sleep 2
          }
          official="$PWD/.pose/official/absol.geo.json"; omen="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json"
          render_model "$official" "$PWD/.pose/official/absol.png" 'animation.absol.ground_idle' 0.35 "$PWD/.pose/renders/official" 9261 official
          render_model "$omen" "$PWD/.pose/omen.png" 'animation.absol.ground_idle' 0.35 "$PWD/.pose/renders/hero" 9262 hero
          render_model "$omen" "$PWD/.pose/omen.png" 'animation.absol.cry' 0.25 "$PWD/.pose/renders/cry" 9263 cry
          cp .pose/renders/official/three_quarter.png "$root/official_reference_three_quarter.png"; cp .pose/renders/hero/three_quarter.png "$root/hero_three_quarter.png"; cp .pose/renders/cry/three_quarter.png "$root/cry_three_quarter.png"; cp .pose/renders/hero/front.png "$root/hero_front.png"; cp .pose/renders/hero/left.png "$root/hero_left.png"; cp .pose/renders/hero/right.png "$root/hero_right.png"; cp .pose/renders/hero/back.png "$root/hero_back.png"
      - name: Validate evidence metadata
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path('test-evidence/visual/cobblemon-skins/0359_absol/omen-regent-real-poses'); names=['official_reference_three_quarter.png','hero_three_quarter.png','cry_three_quarter.png','hero_front.png','hero_left.png','hero_right.png','hero_back.png']; hashes={}
          for n in names:
              p=root/n; im=Image.open(p).convert('RGBA'); assert im.size==(1024,1024) and im.getbbox() is not None; hashes[n]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert len(set(hashes.values()))==len(hashes)
          manifest={'format':'ouros.cobblemon-blockbench-pose-evidence.v1','viewer':'Blockbench 5.1.6','modelSource':'official Cobblemon 1.7.3 Fabric JAR, Modrinth kF7CvxTo','officialModelSha256':'ed8b82b60caaeb0ee8b97597b5bd194a52d52d671da7bbc0eb35aa8dd864d462','officialAnimationSha256':'3e706148f3159fb60b51acd8221d4a1292306a8a780ab4b69a874eb72700ece4','originalBoneCount':73,'derivedBoneCount':81,'poses':{'hero':{'animation':'animation.absol.ground_idle','time':0.35},'cry':{'animation':'animation.absol.cry','time':0.25}},'walkingEvidence':'omitted: official poser uses procedural q.quadruped_walk rather than a Bedrock walking clip','battleEvidence':'omitted: official poser has no battle pose or battle_idle Bedrock clip','files':hashes}; (root/'pose-metadata.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: omen-regent-real-poses, path: test-evidence/visual/cobblemon-skins/0359_absol/omen-regent-real-poses, retention-days: 14}
      - name: Commit validated evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          root='test-evidence/visual/cobblemon-skins/0359_absol/omen-regent-real-poses'; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$root"; git commit -m 'Evidence: add Omen Regent Blockbench renders' || exit 0; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin HEAD:"${GITHUB_REF_NAME}"
