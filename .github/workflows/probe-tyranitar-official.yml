name: Probe Tyranitar Official Assets
on:
  push:
    branches: ['feat/tyranitar-abyssal-bastion']
    paths: ['.github/workflows/probe-tyranitar-official.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact official Cobblemon 1.7.3 Fabric JAR
        run: |
          set -euo pipefail
          mkdir -p .probe
          curl --fail --silent --show-error --location -A 'Ouros-skin-probe' https://api.modrinth.com/v2/version/kF7CvxTo -o .probe/version.json
          python - <<'PY' > .probe/download.env
          import json, shlex
          data=json.load(open('.probe/version.json'))
          assert data['version_number']=='1.7.3' and data['game_versions']==['1.21.1']
          f=next(x for x in data['files'] if x.get('primary'))
          assert f['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL='+shlex.quote(f['url']))
          print('SHA512='+shlex.quote(f['hashes']['sha512']))
          PY
          source .probe/download.env
          curl --fail --silent --show-error --location "$URL" -o .probe/cobblemon.jar
          printf '%s  %s\n' "$SHA512" .probe/cobblemon.jar | sha512sum -c --strict
      - name: Write compact rig summary
        run: |
          python - <<'PY'
          import json, zipfile, hashlib
          from pathlib import Path
          with zipfile.ZipFile('.probe/cobblemon.jar') as z:
            geo='assets/cobblemon/bedrock/pokemon/models/0248_tyranitar/tyranitar.geo.json'
            anim='assets/cobblemon/bedrock/pokemon/animations/0248_tyranitar/tyranitar.animation.json'
            resolver='assets/cobblemon/bedrock/pokemon/resolvers/0248_tyranitar/0_tyranitar_base.json'
            tex='assets/cobblemon/textures/pokemon/0248_tyranitar/tyranitar.png'
            shiny='assets/cobblemon/textures/pokemon/0248_tyranitar/tyranitar_shiny.png'
            graw=z.read(geo); araw=z.read(anim); rraw=z.read(resolver)
            g=json.loads(graw)['minecraft:geometry'][0]
            report={
              'source':{'version':'1.7.3','minecraft':'1.21.1','modrinth':'kF7CvxTo'},
              'hashes':{'model':hashlib.sha256(graw).hexdigest(),'animation':hashlib.sha256(araw).hexdigest(),'resolver':hashlib.sha256(rraw).hexdigest(),'texture':hashlib.sha256(z.read(tex)).hexdigest(),'shiny':hashlib.sha256(z.read(shiny)).hexdigest()},
              'description':g['description'],
              'bones':[{'name':b['name'],'parent':b.get('parent'),'pivot':b.get('pivot'),'rotation':b.get('rotation'),'cube_count':len(b.get('cubes',[]))} for b in g['bones']],
              'animations':list(json.loads(araw).get('animations',{}).keys()),
              'resolver':json.loads(rraw),
              'all_paths':[n for n in z.namelist() if 'tyranitar' in n.lower()]
            }
          out=Path('test-evidence/probe'); out.mkdir(parents=True,exist_ok=True)
          (out/'tyranitar-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Commit compact summary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-evidence/probe/tyranitar-summary.json
          git commit -m 'Evidence: compact official Tyranitar rig summary'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
