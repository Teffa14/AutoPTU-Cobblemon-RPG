name: Cleanup plan bookkeeping helper

on:
  push:
    branches:
      - feat/svc-018-persistent-switch

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[bookkeeping-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/svc-018-persistent-switch
          fetch-depth: 0
      - name: Restore normal CI and remove temporary helper
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/plan-bookkeeping-svc018.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "CI: remove temporary plan helper [bookkeeping-cleanup]"
          git push origin HEAD:feat/svc-018-persistent-switch
