name: RPG-005 Canonical Plan Patch

on:
  push:
    branches:
      - chore/rpg-005-plan

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical plan exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          replacements = {
              "| CUR-044 | LIVE | authenticated canonical Trainer skills | PR #323 / merge `8bc5d40ed0ded20066925dddb0153cbb6113af40`. `/autoptu trainer skills` resolves the authenticated Minecraft UUID to the canonical Trainer and projects only persisted skill IDs/ranks plus save revision through `CanonicalTrainerSummaryService`; no PTU rank is inferred locally. |":
              "| CUR-044 | LIVE | authenticated canonical Trainer skills | PR #323 / merge `8bc5d40ed0ded20066925dddb0153cbb6113af40`. `/autoptu trainer skills` resolves the authenticated Minecraft UUID to the canonical Trainer and projects only persisted skill IDs/ranks plus save revision through `CanonicalTrainerSummaryService`; no PTU rank is inferred locally. |\n| CUR-045 | LIVE/PARTIAL | authenticated canonical Trainer progression | PR #384 / merge `c00b3d884b41575e2d4314ffd27e9978859ce40d`. `/autoptu trainer progression` resolves the authenticated Minecraft UUID to the canonical Trainer and projects only durable server-owned Trainer level, XP and progression revision. New records start at persisted level 1 / XP 0; XP grants, thresholds and PTU level-up effects remain follow-up authority work. |",
              "| CMD-008 | BLOCKED/PARTIAL | `/autoptu trainer actions` — PR #224. Server-owned monotonic RPG day and Daily reservation are live; the final action list is blocked on authoritative PTU action-cost/frequency definitions and must not classify every Feature as Daily. |":
              "| CMD-008 | BLOCKED/PARTIAL | `/autoptu trainer actions` — PR #224. Server-owned monotonic RPG day and Daily reservation are live; the final action list is blocked on authoritative PTU action-cost/frequency definitions and must not classify every Feature as Daily. |\n| CMD-009 | LIVE/PARTIAL | `/autoptu trainer progression` — PR #384 / merge `c00b3d884b41575e2d4314ffd27e9978859ce40d`; authenticated read-only projection of durable server-owned Trainer level, XP and revision. The client supplies no progression truth, and no XP grant, threshold or level-up effect policy is implemented locally. |",
              "| RPG-005 | TODO | Trainer XP/level/progression persistence. |":
              "| RPG-005 | LIVE/PARTIAL | Trainer XP/level/progression persistence — PR #384 / merge `c00b3d884b41575e2d4314ffd27e9978859ce40d` adds owner-scoped atomic world-save persistence, revision CAS and the authenticated `/autoptu trainer progression` read surface. XP grant sources, thresholds and PTU level-up effects remain unimplemented rather than inferred locally. |",
              "| SVC-038 | LIVE | `requestTrainerChallenge(player, npcId, challengeId)` — PR #268 / implementation head `2a48165f5011f41dcdffb1766add7ce2a4a39df8`. Resolves only server-authored challenge/NPC identity plus authenticated Trainer and persistent party state, then returns an immutable party identity/revision snapshot. It performs no PTU battle-start legality, RNG, action, damage, result or reward mutation. |":
              "| SVC-038 | LIVE | `requestTrainerChallenge(player, npcId, challengeId)` — PR #268 / implementation head `2a48165f5011f41dcdffb1766add7ce2a4a39df8`. Resolves only server-authored challenge/NPC identity plus authenticated Trainer and persistent party state, then returns an immutable party identity/revision snapshot. It performs no PTU battle-start legality, RNG, action, damage, result or reward mutation. |\n| SVC-039 | LIVE/PARTIAL | `inspectTrainerProgression(player)` — PR #384 / merge `c00b3d884b41575e2d4314ffd27e9978859ce40d`; reads only owner-scoped durable Trainer level, XP and revision through `CanonicalTrainerProgressionQueryService`. Mutation/grant policy remains intentionally absent. |",
              "| TODO | Trainer XP/level/progression. |":
              "| LIVE/PARTIAL | Trainer XP/level/progression — PR #384 / merge `c00b3d884b41575e2d4314ffd27e9978859ce40d`; owner-scoped world-save state persists explicit Trainer level, XP and revision atomically. XP grant sources, thresholds and PTU level-up effects remain follow-up authority work. |",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit plan
        run: |
          rm .github/workflows/rpg-005-plan-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/rpg-005-plan-patch.yml
          git commit -m "docs: record RPG-005 shipped status"
          git push origin HEAD:chore/rpg-005-plan
