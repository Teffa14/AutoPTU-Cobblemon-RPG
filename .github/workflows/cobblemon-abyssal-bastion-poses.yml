name: Abyssal Bastion Blockbench Review
on:
  push:
    branches: ['feat/tyranitar-abyssal-bastion']
    paths:
      - '.github/workflows/cobblemon-abyssal-bastion-poses.yml'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0248_tyranitar/ouros_abyssal_bastion_tyranitar.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0248_tyranitar/ouros_abyssal_bastion_accessories.png'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: abyssal-bastion-blockbench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  BLOCKBENCH_VERSION: 5.1.6
  BLOCKBENCH_SHA256: c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install independent viewer dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64 >/dev/null
      - name: Fetch exact official Tyranitar and pinned Blockbench
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pose/official
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Abyssal-Bastion-Blockbench' "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .pose/version.json
          python - <<'PY' > .pose/env
          import json,shlex
          d=json.load(open('.pose/version.json')); p=next(f for f in d['files'] if f.get('primary'))
          assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1'] and p['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL='+shlex.quote(p['url'])); print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .pose/env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .pose/cobblemon.jar
          printf '%s  %s\n' "$SHA512" .pose/cobblemon.jar | sha512sum --check --strict
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0248_tyranitar/tyranitar.geo.json' > .pose/official/tyranitar.geo.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0248_tyranitar/tyranitar.animation.json' > .pose/official/tyranitar.animation.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/textures/pokemon/0248_tyranitar/tyranitar.png' > .pose/official/tyranitar.png
          test "$(sha256sum .pose/official/tyranitar.geo.json|awk '{print $1}')" = 541ac55dd56e5d8f0caeea3d5947ba3ab32437978e1d676ad335ffaef79c93a9
          test "$(sha256sum .pose/official/tyranitar.animation.json|awk '{print $1}')" = c86725c386fd3d77b5892bd6ee0b4b425d7a5be9025c89a1737e5aeb60d92800
          python tools/cobblemon-model-review/validate_original_model.py --official .pose/official/tyranitar.geo.json --candidate fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0248_tyranitar/ouros_abyssal_bastion_tyranitar.geo.json
          python - <<'PY'
          from PIL import Image
          base=Image.open('.pose/official/tyranitar.png').convert('RGBA')
          overlay=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0248_tyranitar/ouros_abyssal_bastion_accessories.png').convert('RGBA')
          assert base.size==overlay.size==(256,256)
          Image.alpha_composite(base,overlay).save('.pose/bastion.png',optimize=True)
          PY
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" -o .pose/blockbench.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" .pose/blockbench.AppImage | sha256sum --check --strict
          chmod +x .pose/blockbench.AppImage
          (cd .pose && ./blockbench.AppImage --appimage-extract >/dev/null)
          test -x .pose/squashfs-root/AppRun
      - name: Render official reference and implemented states
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/test-evidence/visual/cobblemon-skins/0248_tyranitar/abyssal-bastion-real-poses"
          rm -rf "$root" .pose/renders
          mkdir -p "$root" .pose/renders
          cleanup_blockbench() { pid="${1:-}"; if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi; pkill -f "$PWD/.pose/squashfs-root/blockbench" 2>/dev/null || true; pkill -f "$PWD/.pose/squashfs-root/AppRun" 2>/dev/null || true; sleep 2; }
          render_once() {
            model="$1"; texture="$2"; animation="$3"; frame="$4"; output="$5"; port="$6"; name="$7"; attempt="$8"
            userdata="$PWD/.pose/user-${name}-${attempt}"; log="$PWD/.pose/${name}-${attempt}.log"; rm -rf "$userdata" "$output"; mkdir -p "$userdata" "$output"
            xvfb-run -a -s '-screen 0 1600x1200x24' env APPDIR="$PWD/.pose/squashfs-root" .pose/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$userdata" "$model" > "$log" 2>&1 & pid=$!
            ready=0; for _ in $(seq 1 90); do if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi; if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; cleanup_blockbench "$pid"; return 1; fi; sleep 1; done
            if [ "$ready" -ne 1 ]; then cat "$log"; cleanup_blockbench "$pid"; return 1; fi
            if ! node tools/cobblemon-model-review/blockbench_capture.mjs --endpoint "http://127.0.0.1:${port}" --texture "$texture" --animation "$PWD/.pose/official/tyranitar.animation.json" --animation-name "$animation" --animation-time "$frame" --output-dir "$output"; then cat "$log"; cleanup_blockbench "$pid"; return 1; fi
            cleanup_blockbench "$pid"
          }
          render_model() { for attempt in 1 2 3; do if render_once "$1" "$2" "$3" "$4" "$5" "$6" "$7" "$attempt"; then return 0; fi; done; return 1; }
          official="$PWD/.pose/official/tyranitar.geo.json"
          bastion="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0248_tyranitar/ouros_abyssal_bastion_tyranitar.geo.json"
          render_model "$official" "$PWD/.pose/official/tyranitar.png" 'animation.tyranitar.ground_idle' 0.35 "$PWD/.pose/renders/official" 9281 official
          render_model "$bastion" "$PWD/.pose/bastion.png" 'animation.tyranitar.ground_idle' 0.35 "$PWD/.pose/renders/hero" 9282 hero
          render_model "$bastion" "$PWD/.pose/bastion.png" 'animation.tyranitar.cry' 0.25 "$PWD/.pose/renders/cry" 9283 cry
          cp .pose/renders/official/three_quarter.png "$root/official_reference_three_quarter.png"
          cp .pose/renders/hero/three_quarter.png "$root/hero_three_quarter.png"
          cp .pose/renders/cry/three_quarter.png "$root/cry_three_quarter.png"
          cp .pose/renders/hero/front.png "$root/hero_front.png"
          cp .pose/renders/hero/left.png "$root/hero_left.png"
          cp .pose/renders/hero/right.png "$root/hero_right.png"
          cp .pose/renders/hero/back.png "$root/hero_back.png"
      - name: Validate pose provenance and record absent clip families
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          renders=Path('.pose/renders')
          expected={'official':('animation.tyranitar.ground_idle',61),'hero':('animation.tyranitar.ground_idle',69),'cry':('animation.tyranitar.cry',69)}
          for name,(animation,bones) in expected.items():
              m=json.loads((renders/name/'blockbench-metadata.json').read_text())
              assert m['viewer']=='Blockbench' and m['sourceOfTransforms']=='Blockbench Bedrock animation codec'
              assert m['modelInfo']['boneCount']==bones
              assert m['modelInfo']['appliedAnimation']['name']==animation and m['modelInfo']['appliedAnimation']['codec']=='bedrock'
          root=Path('test-evidence/visual/cobblemon-skins/0248_tyranitar/abyssal-bastion-real-poses')
          names=['official_reference_three_quarter.png','hero_three_quarter.png','cry_three_quarter.png','hero_front.png','hero_left.png','hero_right.png','hero_back.png']; hashes={}
          for n in names:
              p=root/n; im=Image.open(p).convert('RGBA'); assert im.size==(1024,1024) and im.getbbox() is not None; hashes[n]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert hashes['official_reference_three_quarter.png']!=hashes['hero_three_quarter.png']
          manifest={'format':'ouros.cobblemon-blockbench-pose-evidence.v1','viewer':'Blockbench 5.1.6','modelSource':'official Cobblemon 1.7.3 Fabric JAR, Modrinth kF7CvxTo','officialModelSha256':'541ac55dd56e5d8f0caeea3d5947ba3ab32437978e1d676ad335ffaef79c93a9','officialAnimationSha256':'c86725c386fd3d77b5892bd6ee0b4b425d7a5be9025c89a1737e5aeb60d92800','originalBoneCount':61,'derivedBoneCount':69,'poses':{'hero':{'animation':'animation.tyranitar.ground_idle','time':0.35},'cry':{'animation':'animation.tyranitar.cry','time':0.25}},'walkingEvidence':'omitted: official 1.7.3 Tyranitar animation JSON has no walking clip; locomotion is code-backed/procedural','battleEvidence':'omitted: official 1.7.3 Tyranitar animation JSON has no battle/battle_idle clip','files':hashes}
          (root/'pose-metadata.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: abyssal-bastion-real-poses
          path: test-evidence/visual/cobblemon-skins/0248_tyranitar/abyssal-bastion-real-poses
          retention-days: 14
      - name: Commit validated Blockbench evidence
        shell: bash
        run: |
          set -euo pipefail
          root='test-evidence/visual/cobblemon-skins/0248_tyranitar/abyssal-bastion-real-poses'
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root"
          git commit -m 'Evidence: add Abyssal Bastion Blockbench renders' || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
