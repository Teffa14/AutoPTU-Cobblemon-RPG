name: Cobblemon Professional Skin Quality Gate

on:
  pull_request:
    paths:
      - 'fabric-adapter/src/main/resources/assets/autoptu/bedrock/pokemon/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/**'
      - 'src/main/resources/data/autoptu/cobblemon/skins/**'
      - 'docs/cobblemon-skin-*/**'
      - 'docs/cobblemon-skin-*.md'
      - 'docs/cobblemon-skins/**'
      - 'tools/cobblemon-model-review/**'
      - 'test-evidence/visual/cobblemon-skins/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/cobblemon-professional-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  professional-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compile and regression-test professional tooling
        run: |
          set -euo pipefail
          python -m compileall -q tools/cobblemon-model-review
          python -m unittest tools/cobblemon-model-review/test_professional_pipeline.py

      - name: Execute changed deterministic staging builders
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/run_changed_staging_builders.py \
            --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Enforce exhaustive registry and legacy quarantine
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/validate_skin_registry.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/cobblemon-skin-registry.json').read_text(encoding='utf-8'))
          data['entries'][0]['saleEligible']=True
          Path('/tmp/invalid-skin-registry.json').write_text(json.dumps(data),encoding='utf-8')
          PY
          if python tools/cobblemon-model-review/validate_skin_registry.py \
            --registry /tmp/invalid-skin-registry.json --skip-manifest-validation; then
            echo 'ERROR: quarantined art became sale-eligible' >&2
            exit 1
          fi
          mkdir -p test-evidence/visual/cobblemon-skins/synthetic-rejected
          printf 'legacy-preview-must-not-be-committed\n' > test-evidence/visual/cobblemon-skins/synthetic-rejected/hero.txt
          if python tools/cobblemon-model-review/validate_skin_registry.py --skip-manifest-validation; then
            echo 'ERROR: committed-style rejected review evidence bypassed registry hygiene' >&2
            exit 1
          fi
          rm -rf test-evidence/visual/cobblemon-skins
          python tools/cobblemon-model-review/validate_skin_registry.py --skip-manifest-validation

      - name: Prove strict same-species reference behavior
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/validate_species_reference_dossier.py \
            tools/cobblemon-model-review/fixtures/reference_dossier_validator_pass.json \
            --expected-species testmon
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path('tools/cobblemon-model-review/fixtures/reference_dossier_validator_pass.json')
          data=json.loads(source.read_text(encoding='utf-8'))
          data['references'][0]['sourceEcosystem']='STANDALONE_3D_MODEL'
          Path('/tmp/standalone-reference.json').write_text(json.dumps(data),encoding='utf-8')
          PY
          if python tools/cobblemon-model-review/validate_species_reference_dossier.py \
            /tmp/standalone-reference.json --expected-species testmon; then
            echo 'ERROR: standalone 3D model bypassed the Cobblemon-pack reference gate' >&2
            exit 1
          fi
          python tools/cobblemon-model-review/validate_species_reference_dossier.py \
            tools/cobblemon-model-review/fixtures/reference_dossier_validator_blocked_candidates.json \
            --expected-species testmon --allow-blocked

      - name: Verify release approvals came from the repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          registry=json.loads(Path('docs/cobblemon-skin-registry.json').read_text(encoding='utf-8'))
          releases=[entry for entry in registry['entries'] if entry['lifecycle']=='OWNER_APPROVED_RELEASE']
          for entry in releases:
              manifest=json.loads(Path(entry['manifest']).read_text(encoding='utf-8'))
              record=json.loads(Path(manifest['ownerApproval']['approvalRecord']).read_text(encoding='utf-8'))
              owner=os.environ['GH_REPOSITORY_OWNER']
              if record['ownerLogin'].lower()!=owner.lower():
                  raise SystemExit(f"approval owner mismatch for {entry['slug']}")
              url=(f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/pulls/"
                   f"{record['githubPullRequest']}/reviews/{record['githubReviewId']}")
              request=urllib.request.Request(url,headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'Ouros-Cobblemon-owner-approval-gate',
              })
              with urllib.request.urlopen(request,timeout=30) as response:
                  review=json.load(response)
              expected={
                  'id':record['githubReviewId'],
                  'state':'APPROVED',
                  'commit_id':record['approvedHeadSha'],
                  'submitted_at':record['approvedAt'],
              }
              for key,value in expected.items():
                  if review.get(key)!=value:
                      raise SystemExit(f"GitHub owner review mismatch for {entry['slug']}: {key}")
              if review.get('user',{}).get('login','').lower()!=owner.lower():
                  raise SystemExit(f"GitHub review for {entry['slug']} was not authored by {owner}")
              print(f"Verified owner approval for {entry['slug']}")
          if not releases:
              print('No owner-approved releases; owner review verification is not applicable.')
          PY

      - name: Enforce manifest on changed production bytes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/validate_changed_skin_professional_manifests.py \
            --base "$BASE_SHA" --head "$HEAD_SHA"
