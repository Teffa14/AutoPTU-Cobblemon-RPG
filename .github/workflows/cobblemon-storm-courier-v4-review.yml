name: Storm Courier V4 Full Transformation Review

on:
  push:
    branches:
      - 'art/issue-308-full-surface-skins'
    paths:
      - '.github/workflows/cobblemon-storm-courier-v4-review.yml'
      - 'tools/cobblemon-model-review/blockbench_capture.mjs'
      - 'tools/cobblemon-model-review/validate_original_model.py'
      - 'tools/cobblemon-model-review/validate_derived_texture.py'
      - 'docs/cobblemon-skins/0025_pikachu/storm-courier-v4-*.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_*.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/90_ouros_storm_courier.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier*.png'
  pull_request:
    paths:
      - '.github/workflows/cobblemon-storm-courier-v4-review.yml'
      - 'tools/cobblemon-model-review/blockbench_capture.mjs'
      - 'tools/cobblemon-model-review/validate_original_model.py'
      - 'tools/cobblemon-model-review/validate_derived_texture.py'
      - 'docs/cobblemon-skins/0025_pikachu/storm-courier-v4-*.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_*.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/90_ouros_storm_courier.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier*.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storm-courier-v4-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  COBBLEMON_FILENAME: 'Cobblemon-fabric-1.7.3+1.21.1.jar'
  COBBLEMON_JAR_SHA256: 'f7c25955176badc444ad6211fc556514fedbdba776227f105fe899f8819d74e3'
  COBBLEMON_JAR_SHA512: '7b5376f5f48177db53790237b6fb25378806972b5d3b756151b4d8f2d3c27238d6b587b77da422bc1780bfd358b4702e74369fd82cef2a35301b4b68a2f13c2e'
  OFFICIAL_PIKACHU_MALE_SHA256: 'f8ea21f6821d49e8a358f05d43562312a0e018e883f1354aa1445d2a0b432c83'
  OFFICIAL_PIKACHU_FEMALE_SHA256: 'd49ba9bce368fed677832685f57a0ca3e7a00a6014639f1e79dbb0b749ed4318'
  OFFICIAL_PIKACHU_ANIMATION_SHA256: 'd9ca00604978f295ad312d358a06f2655c725b30ac3da73c3637ae160c543384'
  OFFICIAL_PIKACHU_POSER_SHA256: '42391fef5a270007874aacdd6d47a64e9e8533e3d6f8f3f99b08997e624851a7'
  OFFICIAL_PIKACHU_RESOLVER_SHA256: '5786e850520491426addd8da9f6f5301b8e7cffa5adcdbee5711c20fc965a396'
  OFFICIAL_PIKACHU_TEXTURE_SHA256: 'df0b0b2029e0cb51ace2fd7d65ce94fc6a7bf1a4681722bf20aa22edd2cc3c8e'
  OFFICIAL_PIKACHU_SHINY_SHA256: 'f84a96d936d8f2b4566db8a7bdbe6c6c1d72c75065b19201730739d618ee65df'
  OFFICIAL_LICENSE_SHA256: '1f256ecad192880510e84ad60474eab7589218784b9a50bc7ceee34c2b91f1d5'
  DERIVED_NORMAL_SHA256: '1ce5d73aa0e302158c2389f80d1668831d316fdd3fc8e76c0f83efed6602f579'
  DERIVED_SHINY_SHA256: '50b5d8719d88896c1d711ab727fcee10a544268d8f3bf1fde1321162d72bcea8'
  BLOCKBENCH_VERSION: '5.1.6'
  BLOCKBENCH_SHA256: 'c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e'
  GAMEPLAY_RESOLUTION: '160'

jobs:
  blockbench-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64

      - name: Download and verify exact official Cobblemon JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .review/official .review/renders .review/output
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/storm-courier-v4-review' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" \
            -o .review/version.json
          python - <<'PY' > .review/download.env
          import json, shlex
          data=json.load(open('.review/version.json', encoding='utf-8'))
          assert data['id']=='kF7CvxTo'
          assert data['version_number']=='1.7.3'
          assert '1.21.1' in data['game_versions'] and 'fabric' in data['loaders']
          primary=next(f for f in data['files'] if f.get('primary'))
          assert primary['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          assert primary['hashes']['sha512']=='7b5376f5f48177db53790237b6fb25378806972b5d3b756151b4d8f2d3c27238d6b587b77da422bc1780bfd358b4702e74369fd82cef2a35301b4b68a2f13c2e'
          print('URL='+shlex.quote(primary['url']))
          PY
          source .review/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .review/cobblemon.jar
          printf '%s  %s\n' "$COBBLEMON_JAR_SHA512" '.review/cobblemon.jar' | sha512sum --check --strict
          printf '%s  %s\n' "$COBBLEMON_JAR_SHA256" '.review/cobblemon.jar' | sha256sum --check --strict

      - name: Extract and verify official Pikachu source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          sources={
            'male':('assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_male.geo.json','pikachu_male.geo.json','OFFICIAL_PIKACHU_MALE_SHA256'),
            'female':('assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_female.geo.json','pikachu_female.geo.json','OFFICIAL_PIKACHU_FEMALE_SHA256'),
            'animation':('assets/cobblemon/bedrock/pokemon/animations/0025_pikachu/pikachu.animation.json','pikachu.animation.json','OFFICIAL_PIKACHU_ANIMATION_SHA256'),
            'poser':('assets/cobblemon/bedrock/pokemon/posers/0025_pikachu/pikachu.json','pikachu.poser.json','OFFICIAL_PIKACHU_POSER_SHA256'),
            'resolver':('assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/0_pikachu_base.json','pikachu.resolver.json','OFFICIAL_PIKACHU_RESOLVER_SHA256'),
            'normal':('assets/cobblemon/textures/pokemon/0025_pikachu/pikachu.png','pikachu.png','OFFICIAL_PIKACHU_TEXTURE_SHA256'),
            'shiny':('assets/cobblemon/textures/pokemon/0025_pikachu/pikachu_shiny.png','pikachu_shiny.png','OFFICIAL_PIKACHU_SHINY_SHA256'),
            'license':('LICENSE','LICENSE','OFFICIAL_LICENSE_SHA256'),
          }
          with zipfile.ZipFile('.review/cobblemon.jar') as jar:
            for label,(member,target,env_name) in sources.items():
              payload=jar.read(member)
              actual=hashlib.sha256(payload).hexdigest()
              expected=os.environ[env_name]
              assert actual==expected,(label,actual,expected)
              Path('.review/official',target).write_bytes(payload)
          resolver=json.loads(Path('.review/official/pikachu.resolver.json').read_text(encoding='utf-8'))
          poser=json.loads(Path('.review/official/pikachu.poser.json').read_text(encoding='utf-8'))
          assert isinstance(resolver,dict) and resolver
          assert isinstance(poser,dict) and poser
          print('OFFICIAL_BASE_RESOLVER_JSON_BEGIN')
          print(json.dumps(resolver,indent=2))
          print('OFFICIAL_BASE_RESOLVER_JSON_END')
          PY

      - name: Validate production anatomy textures and resolver
        shell: bash
        run: |
          set -euo pipefail
          male='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json'
          female='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json'
          normal='fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier.png'
          shiny='fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_shiny.png'
          python tools/cobblemon-model-review/validate_original_model.py --official .review/official/pikachu_male.geo.json --candidate "$male"
          python tools/cobblemon-model-review/validate_original_model.py --official .review/official/pikachu_female.geo.json --candidate "$female"
          printf '%s  %s\n' "$DERIVED_NORMAL_SHA256" "$normal" | sha256sum --check --strict
          printf '%s  %s\n' "$DERIVED_SHINY_SHA256" "$shiny" | sha256sum --check --strict
          python tools/cobblemon-model-review/validate_derived_texture.py \
            --official .review/official/pikachu.png --derived "$normal" \
            --metadata docs/cobblemon-skins/0025_pikachu/storm-courier-v4-normal.texture.json \
            --expected-official-sha256 "$OFFICIAL_PIKACHU_TEXTURE_SHA256" \
            --expected-derived-sha256 "$DERIVED_NORMAL_SHA256"
          python tools/cobblemon-model-review/validate_derived_texture.py \
            --official .review/official/pikachu_shiny.png --derived "$shiny" \
            --metadata docs/cobblemon-skins/0025_pikachu/storm-courier-v4-shiny.texture.json \
            --expected-official-sha256 "$OFFICIAL_PIKACHU_SHINY_SHA256" \
            --expected-derived-sha256 "$DERIVED_SHINY_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          expected_names=[
            'ouros_storm_head_system','ouros_storm_mantle_shell','ouros_storm_torso_suit','ouros_storm_core',
            'ouros_storm_power_frame','ouros_storm_left_pylon','ouros_storm_right_pylon','ouros_storm_tail_conductor',
          ]
          report={}
          for sex in ('male','female'):
            p=Path(f'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_{sex}.geo.json')
            bones=json.loads(p.read_text(encoding='utf-8'))['minecraft:geometry'][0]['bones']
            assert len(bones)==98
            assert [b['name'] for b in bones[90:]]==expected_names
            cosmetic_cubes=sum(len(b.get('cubes',[])) for b in bones[90:])
            report[sex]={'originalBones':90,'derivedBones':len(bones),'cosmeticBones':8,'cosmeticCubes':cosmetic_cubes}
          assert report['male']['cosmeticCubes']==report['female']['cosmeticCubes']
          Path('.review/output/geometry-summary.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          resolver=json.loads(Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/90_ouros_storm_courier.json').read_text(encoding='utf-8'))
          assert resolver['species']=='cobblemon:pikachu' and resolver['order']==90
          assert len(resolver['variations'])==4
          for v in resolver['variations']:
            assert v['poser']=='cobblemon:pikachu'
          PY

      - name: Build exact Blockbench review textures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu')
          overlay=Image.open(root/'ouros_storm_courier_accessories.png').convert('RGBA')
          assert overlay.size==(128,64)
          for source,target in (
            ('ouros_storm_courier.png','.review/storm-normal.png'),
            ('ouros_storm_courier_shiny.png','.review/storm-shiny.png'),
          ):
            base=Image.open(root/source).convert('RGBA')
            assert base.size==(128,64)
            Image.alpha_composite(base,overlay).save(target,optimize=True)
          PY

      - name: Download pinned Blockbench
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" \
            -o .review/blockbench.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" '.review/blockbench.AppImage' | sha256sum --check --strict
          chmod +x .review/blockbench.AppImage
          (cd .review && ./blockbench.AppImage --appimage-extract >/dev/null)
          test -x .review/squashfs-root/AppRun

      - name: Render matched-camera official and v4 evidence in Blockbench
        shell: bash
        run: |
          set -euo pipefail
          cleanup_blockbench() {
            pid="${1:-}"
            if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            pkill -f "$PWD/.review/squashfs-root/blockbench" 2>/dev/null || true
            pkill -f "$PWD/.review/squashfs-root/AppRun" 2>/dev/null || true
            sleep 2
          }
          render_once() {
            model="$1"; texture="$2"; anim="$3"; time="$4"; out="$5"; port="$6"; tag="$7"; profile_in="$8"; profile_out="$9"; attempt="${10}"
            userdata="$PWD/.review/user-${tag}-${attempt}"; log="$PWD/.review/${tag}-${attempt}.log"
            rm -rf "$userdata" "$out"; mkdir -p "$userdata" "$out"
            xvfb-run -a -s '-screen 0 1600x1200x24' env APPDIR="$PWD/.review/squashfs-root" \
              .review/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan \
              --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$userdata" "$model" >"$log" 2>&1 &
            pid=$!
            ready=0
            for _ in $(seq 1 90); do
              if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; cleanup_blockbench "$pid"; return 1; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then cat "$log"; cleanup_blockbench "$pid"; return 1; fi
            args=(--endpoint "http://127.0.0.1:${port}" --texture "$texture" --animation "$PWD/.review/official/pikachu.animation.json" --animation-name "$anim" --animation-time "$time" --gameplay-resolution "$GAMEPLAY_RESOLUTION" --output-dir "$out")
            if [ -n "$profile_in" ]; then args+=(--camera-profile-in "$profile_in"); fi
            if [ -n "$profile_out" ]; then args+=(--camera-profile-out "$profile_out"); fi
            if ! node tools/cobblemon-model-review/blockbench_capture.mjs "${args[@]}"; then cat "$log"; cleanup_blockbench "$pid"; return 1; fi
            cleanup_blockbench "$pid"
          }
          render() {
            model="$1"; texture="$2"; anim="$3"; time="$4"; out="$5"; port="$6"; tag="$7"; profile_in="$8"; profile_out="$9"
            for attempt in 1 2 3; do
              echo "Blockbench ${tag}: attempt ${attempt}/3"
              if render_once "$model" "$texture" "$anim" "$time" "$out" "$port" "$tag" "$profile_in" "$profile_out" "$attempt"; then return 0; fi
            done
            return 1
          }
          official_male="$PWD/.review/official/pikachu_male.geo.json"
          official_female="$PWD/.review/official/pikachu_female.geo.json"
          storm_male="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json"
          storm_female="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json"
          camera="$PWD/.review/official-camera.json"
          render "$official_male" "$PWD/.review/official/pikachu.png" 'animation.pikachu.ground_idle' 0.35 "$PWD/.review/renders/official" 9321 official '' "$camera"
          render "$storm_male" "$PWD/.review/storm-normal.png" 'animation.pikachu.ground_idle' 0.35 "$PWD/.review/renders/hero" 9322 hero "$camera" ''
          render "$storm_male" "$PWD/.review/storm-normal.png" 'animation.pikachu.battle_idle' 0.35 "$PWD/.review/renders/battle" 9323 battle "$camera" ''
          render "$storm_male" "$PWD/.review/storm-normal.png" 'animation.pikachu.ground_walk' 0.25 "$PWD/.review/renders/walk" 9324 walk "$camera" ''
          render "$official_female" "$PWD/.review/official/pikachu.png" 'animation.pikachu.ground_idle' 0.35 "$PWD/.review/renders/official-female" 9325 official-female "$camera" ''
          render "$storm_female" "$PWD/.review/storm-normal.png" 'animation.pikachu.ground_idle' 0.35 "$PWD/.review/renders/female" 9326 female "$camera" ''

      - name: Assemble evidence and provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from PIL import Image
          out=Path('.review/output')
          mapping={
            'official_reference_three_quarter.png':Path('.review/renders/official/three_quarter.png'),
            'hero_three_quarter.png':Path('.review/renders/hero/three_quarter.png'),
            'battle_ready_three_quarter.png':Path('.review/renders/battle/three_quarter.png'),
            'walking_three_quarter.png':Path('.review/renders/walk/three_quarter.png'),
            'hero_front.png':Path('.review/renders/hero/front.png'),
            'hero_left.png':Path('.review/renders/hero/left.png'),
            'hero_right.png':Path('.review/renders/hero/right.png'),
            'hero_back.png':Path('.review/renders/hero/back.png'),
            'official_reference_gameplay_160.png':Path('.review/renders/official/three_quarter_gameplay_160.png'),
            'hero_gameplay_160.png':Path('.review/renders/hero/three_quarter_gameplay_160.png'),
            'battle_ready_gameplay_160.png':Path('.review/renders/battle/three_quarter_gameplay_160.png'),
            'walking_gameplay_160.png':Path('.review/renders/walk/three_quarter_gameplay_160.png'),
            'official_female_three_quarter.png':Path('.review/renders/official-female/three_quarter.png'),
            'female_three_quarter.png':Path('.review/renders/female/three_quarter.png'),
            'official_female_back.png':Path('.review/renders/official-female/back.png'),
            'female_back.png':Path('.review/renders/female/back.png'),
          }
          hashes={}
          for name,src in mapping.items():
            assert src.is_file(),src
            shutil.copy2(src,out/name)
            image=Image.open(out/name).convert('RGBA')
            expected=(160,160) if 'gameplay_160' in name else (1024,1024)
            assert image.size==expected,(name,image.size)
            assert image.getbbox() is not None,name
            hashes[name]=hashlib.sha256((out/name).read_bytes()).hexdigest()
          metas={tag:json.loads(Path(f'.review/renders/{tag}/blockbench-metadata.json').read_text(encoding='utf-8')) for tag in ('official','hero','battle','walk','official-female','female')}
          for tag,meta in metas.items():
            assert meta['viewer']=='Blockbench'
            assert meta['cameraContract']==('source camera profile generated from this capture' if tag=='official' else 'matched to official reference camera profile')
          assert metas['official']['modelInfo']['boneCount']==90
          assert metas['official-female']['modelInfo']['boneCount']==90
          assert metas['hero']['modelInfo']['boneCount']==98
          assert metas['battle']['modelInfo']['boneCount']==98
          assert metas['walk']['modelInfo']['boneCount']==98
          assert metas['female']['modelInfo']['boneCount']==98
          for tag,anim,time in (
            ('official','animation.pikachu.ground_idle',0.35),('hero','animation.pikachu.ground_idle',0.35),
            ('battle','animation.pikachu.battle_idle',0.35),('walk','animation.pikachu.ground_walk',0.25),
            ('official-female','animation.pikachu.ground_idle',0.35),('female','animation.pikachu.ground_idle',0.35),
          ):
            applied=metas[tag]['modelInfo']['appliedAnimation']
            assert applied['name']==anim and applied['codec']=='bedrock'
            assert abs(applied['requestedTime']-time)<1e-9
          camera_hash=hashlib.sha256(Path('.review/official-camera.json').read_bytes()).hexdigest()
          manifest=json.loads(Path('docs/cobblemon-skins/0025_pikachu/storm-courier-v4-source-manifest.json').read_text(encoding='utf-8'))
          geometry=json.loads(Path('.review/output/geometry-summary.json').read_text(encoding='utf-8'))
          report={
            'format':'ouros.cobblemon-full-transformation-review.v1',
            'viewer':'Blockbench 5.1.6',
            'blockbenchSha256':'c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e',
            'sourceManifest':manifest,
            'geometry':geometry,
            'derivedNormalSha256':'1ce5d73aa0e302158c2389f80d1668831d316fdd3fc8e76c0f83efed6602f579',
            'derivedShinySha256':'50b5d8719d88896c1d711ab727fcee10a544268d8f3bf1fde1321162d72bcea8',
            'officialReferenceCameraSha256':camera_hash,
            'cameraRule':'all skin/animation/female captures reuse the official male reference Blockbench camera target, position and orthographic zoom',
            'gameplayResolution':160,
            'animations':{
              'hero':{'name':'animation.pikachu.ground_idle','time':0.35},
              'battleReady':{'name':'animation.pikachu.battle_idle','time':0.35},
              'walking':{'name':'animation.pikachu.ground_walk','time':0.25},
            },
            'pngSha256':hashes,
            'artisticAcceptance':'PENDING_HUMAN_VISUAL_REVIEW',
          }
          (out/'blockbench-review-metadata.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          shutil.copy2('.review/official-camera.json',out/'official-camera.json')
          shutil.copy2('.review/official/pikachu.resolver.json',out/'official-base-resolver.json')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload Blockbench review evidence
        uses: actions/upload-artifact@v4
        with:
          name: storm-courier-v4-blockbench-review
          path: .review/output
          if-no-files-found: error
          retention-days: 14
