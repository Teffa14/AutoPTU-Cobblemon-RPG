name: Temporary WORLD-021 Plan Sync

on:
  push:
    branches:
      - world-021-canonical-badge-gate

permissions:
  contents: write

jobs:
  sync-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-021-canonical-badge-gate
          fetch-depth: 0
      - name: Patch canonical plan exactly once
        shell: python
        run: |
          from pathlib import Path
          path = Path("MINECRAFT_RPG_TOOLING_PLAN.md")
          text = path.read_text()
          old_world = "| WORLD-021 | BLOCKED | Gates/doors controlled by canonical badge/key/progression state — blocked until a durable server-owned badge/key/progression aggregate exists; Minecraft advancements, inventory items and client state must not be substituted as canonical progression truth. |"
          new_world = "| WORLD-021 | LIVE/PARTIAL | Gates/doors controlled by canonical badge/key/progression state — PR #413 / implementation head `da76ff4b8ed5a78cf445f5f28c791add2c8eaa1d`; the explicit namespaced Cedar League Badge Gate revalidates authenticated Trainer identity, physical gate/range and durable server-owned Trainer badge records before allowing that player to cross. The initial authored requirement is `cedar_trial_badge`; badge award/producers remain future trusted sources and Minecraft advancements, inventory items, Cobblemon state and client progression are never accepted as truth. |"
          if old_world in text:
              text = text.replace(old_world, new_world, 1)
          elif new_world not in text:
              raise SystemExit("WORLD-021 row did not match expected canonical plan state")

          svc48 = "| SVC-048 | LIVE/PARTIAL | `inspectMoveTutorPokemon(player, partySlot)` — PR #410 / implementation head `e0e23176449ca1549c405f4278eabf172a1a8baf`; resolves authenticated party membership, canonical Pokemon ownership, persisted current move loadout and Pokemon revision for the physical tutor surface. It performs no learnability calculation, tutor eligibility, cost, move mutation or PTU effect. |"
          svc49 = "| SVC-049 | LIVE/PARTIAL | `canPassProgressionGate(player, gateId)` — PR #413 / implementation head `da76ff4b8ed5a78cf445f5f28c791add2c8eaa1d`; resolves only a server-authored gate requirement and durable canonical Trainer badge records. It grants no badge, progression, battle result or PTU effect and accepts no Minecraft/client progression truth. |"
          if svc49 not in text:
              if svc48 not in text:
                  raise SystemExit("SVC-048 anchor missing from canonical plan")
              text = text.replace(svc48, svc48 + "\n" + svc49, 1)

          path.write_text(text)
      - name: Commit synchronized plan when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- MINECRAFT_RPG_TOOLING_PLAN.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m "WORLD-021 sync canonical Minecraft RPG plan"
          git push origin HEAD:world-021-canonical-badge-gate
