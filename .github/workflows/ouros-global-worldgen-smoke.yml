name: Ouros Global Worldgen Smoke

on:
  push:
    branches: [main]
    paths:
      - 'fabric-adapter/**'
      - 'worldgen/ouros-global-v1/**'
      - 'scripts/render_world_overview.py'
      - '.github/workflows/ouros-global-worldgen-smoke.yml'
  workflow_dispatch:

jobs:
  generate-world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build runtime mod set
        run: gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon

      - name: Materialize Ouros Global V1
        shell: bash
        run: |
          set -uo pipefail
          server_dir="$PWD/ouros-global-runtime"
          mkdir -p "$server_dir/mods" "$server_dir/config" "$server_dir/evidence"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          cp worldgen/ouros-global-v1/server.properties "$server_dir/server.properties"
          cp worldgen/ouros-global-v1/tectonic.json "$server_dir/config/tectonic.json"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.18.2/1.1.0/server/jar'
          if [ "$?" -ne 0 ]; then
            echo 'FAIL fabric server download' | tee "$server_dir/evidence/validation.txt"
            exit 1
          fi

          (
            cd "$server_dir"
            exec java -Xms1G -Xmx3G -jar fabric-server-launch.jar nogui > ../ouros-global-worldgen.log 2>&1
          ) &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 240); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'Done (' "$latest" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          validation="$server_dir/evidence/validation.txt"
          : > "$validation"
          status=0

          record_check() {
            local label="$1"
            shift
            if "$@"; then
              echo "PASS $label" | tee -a "$validation"
            else
              echo "FAIL $label" | tee -a "$validation"
              status=1
            fi
          }

          if [ "$ready" -eq 1 ]; then
            echo 'PASS server reached Done state' | tee -a "$validation"
          else
            echo 'FAIL server did not reach Done state' | tee -a "$validation"
            status=1
          fi

          record_check 'world/level.dat exists' test -f "$server_dir/world/level.dat"
          record_check 'world/region exists' test -d "$server_dir/world/region"
          if find "$server_dir/world/region" -name 'r.*.*.mca' -print -quit 2>/dev/null | grep -q .; then
            echo 'PASS at least one Anvil region exists' | tee -a "$validation"
          else
            echo 'FAIL no Anvil region exists' | tee -a "$validation"
            status=1
          fi

          for mod in cobblemon terralith tectonic lithostitched; do
            if find "$server_dir/mods" -maxdepth 1 -type f -printf '%f\n' | grep -qi "$mod"; then
              echo "PASS runtime mod $mod" | tee -a "$validation"
            else
              echo "FAIL runtime mod $mod" | tee -a "$validation"
              status=1
            fi
          done

          find "$server_dir/mods" -maxdepth 1 -type f -printf '%f\n' | sort > "$server_dir/evidence/runtime-mods.txt"
          find "$server_dir/world" -maxdepth 3 -type f -printf '%P\n' 2>/dev/null | sort > "$server_dir/evidence/world-files.txt"

          {
            echo 'world_id=ouros-global-v1'
            echo 'minecraft=1.21.1'
            echo 'fabric_loader=0.18.2'
            echo 'cobblemon=1.7.3'
            echo 'seed=OUROS_GLOBAL_V1_2026_09_03'
            echo 'terralith=2.6.2'
            echo 'tectonic=3.0.1-fabric-1.21.1'
            echo 'lithostitched=1.7.7-fabric-1.21.1'
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_sha=$GITHUB_SHA"
          } > "$server_dir/evidence/OUROS_WORLD_MANIFEST.txt"
          if [ -d "$server_dir/world" ]; then
            cp "$server_dir/evidence/OUROS_WORLD_MANIFEST.txt" "$server_dir/world/OUROS_WORLD_MANIFEST.txt"
          fi

          cleanup
          trap - EXIT
          exit "$status"

      - name: Install overview renderer dependency
        if: always()
        run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4

      - name: Render generated world overview
        if: always()
        continue-on-error: true
        run: python3 scripts/render_world_overview.py ouros-global-runtime/world ouros-global-runtime/evidence --scale 3

      - name: Upload generated world and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ouros-global-v1-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ouros-global-runtime/world/**
            ouros-global-runtime/evidence/**
            ouros-global-runtime/config/tectonic.json
            ouros-global-runtime/server.properties
            ouros-global-runtime/logs/latest.log
            ouros-global-worldgen.log
