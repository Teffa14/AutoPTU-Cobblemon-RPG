name: WORLD-013 Plan Self Patch

on:
  push:
    branches:
      - world-013-initial-route-wild-occupancy
    paths:
      - '.github/workflows/world-013-plan-self-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-initial-route-wild-occupancy
          fetch-depth: 0
      - name: Record PR 517 in canonical Minecraft RPG queue
        shell: python
        run: |
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          old = "PR #516 / implementation head `32f8c9b7319dc6cb83f3a007685413527770896d` also treats another currently interaction-active visible wild Pokemon occupying an unconsumed actor-sized node as dynamic Minecraft presentation blockage, revoking and recalculating the stale CALM route around that actor while preserving the same authored destination, leash, canonical encounter identity and PTU authority boundary. |"
          new = old[:-2] + " PR #517 / implementation head `bd5440e1f8198c7802d8dfae7007517b6a6cc311` rejects a newly computed Minecraft-native CALM route before movement starts when any actor-sized path node is blocked or already occupied by another interaction-active visible wild Pokemon, so the existing leash-safe replanning/deterministic fallback runs without changing the authored destination, encounter identity or PTU authority boundary. |"
          if old not in text:
              raise SystemExit('WORLD-013 PR #516 anchor not found exactly once')
          if text.count(old) != 1:
              raise SystemExit(f'WORLD-013 PR #516 anchor count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new, 1))
      - name: Remove self-patch workflow and commit plan
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/world-013-plan-self-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/world-013-plan-self-patch.yml
          git diff --cached --check
          git commit -m 'WORLD-013: record PR 517 in tooling plan'
          git push origin HEAD:world-013-initial-route-wild-occupancy
