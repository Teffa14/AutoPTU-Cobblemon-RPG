name: WORLD-013 Plan Self Patch

on:
  push:
    branches:
      - world-013-calm-navigation-continuity

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-calm-navigation-continuity
          fetch-depth: 0
      - name: Record shipped slice in canonical plan and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = p.read_text()
          marker = "PR #507 / merge `1ff554ab1c6a00711225a7fa57a216fec91d27e9` adds server-side stalled-route recovery for canonical Marea CALM navigation: after three consecutive low-progress samples, the stale Minecraft path is revoked and horizontal impulse cleared so the existing leash-safe navigator/detour authority can recalculate without changing encounter identity or PTU rules."
          addition = " PR #509 / implementation head `dc06e621498a88ed0fac002e415030915ff14e69` preserves an already-observed Minecraft-native CALM route across the 10-tick ambient cadence by rehydrating the same deterministic segment destination after the ambient controller re-evaluates precedence; rest cadence, segment change, nearby players, leash escape, target arrival or path failure revoke continuity immediately."
          if addition.strip() not in text:
              if marker not in text:
                  raise SystemExit('WORLD-013 #507 marker not found')
              text = text.replace(marker, marker + addition, 1)
              p.write_text(text)
          PY
          git rm .github/workflows/world-013-plan-self-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m 'WORLD-013: record CALM navigation continuity (#509)'
          git push origin HEAD:world-013-calm-navigation-continuity
