name: Canonical admin tooling plan sync

on:
  push:
    branches:
      - automation/plan-sync-adm-009-017
    paths:
      - .github/workflows/adm-tooling-plan-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Prepare canonical admin tooling plan sync'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/plan-sync-adm-009-017
          fetch-depth: 0
      - name: Reconcile shipped admin tooling rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text(encoding='utf-8')
          updates = {
              'ADM-009': ('LIVE', 'PR #638 / merge `c88bd2df8bc4422c86bbe46b05cf4d5a72305066`.'),
              'ADM-010': ('LIVE', 'PR #639 / merge `6d6313c154078d4b47309c76fdd85cd8cc09f391`.'),
              'ADM-011': ('LIVE', 'PR #640 / merge `114b82188ee64ca8f22223fbaa7f2c5c12d54940`.'),
              'ADM-012': ('LIVE', 'PR #641 / merge `465a4c7baf8e14786f3ef98863a7806cb39403a1`.'),
              'ADM-013': ('LIVE', 'PR #631 / merge `70b49e5bf2f45862fb2e4598384e5acf6b066da2`.'),
              'ADM-014': ('LIVE', 'PR #642 / merge `d10c5235d345d9b1cdf2e3b7ce31920097e8d486`.'),
              'ADM-015': ('LIVE', 'PR #643 / merge `5f13d150b5f8c1d7c3ff97a7ea91ea4c09fee88b`.'),
              'ADM-016': ('LIVE', 'PR #645 / merge `e563b974e8ddb867a4a262d77161ef8e16f9ed44`.'),
              'ADM-017': ('LIVE', 'PR #646 / merge `68fa0b535089bc6bf23c480b8dbb62077cf4114d`.'),
          }
          for item_id, (status, reference) in updates.items():
              pattern = re.compile(rf'^\| {re.escape(item_id)} \| [^|]+ \| (.*) \|$', re.MULTILINE)
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f'missing canonical plan row: {item_id}')
              tool = match.group(1).strip()
              if reference not in tool:
                  tool = f'{tool} — {reference}'
              replacement = f'| {item_id} | {status} | {tool} |'
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one canonical plan row: {item_id}; got {count}')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/adm-tooling-plan-sync.yml
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git diff --cached --check
          git commit -m 'Sync shipped admin tooling plan'
          git push origin HEAD:automation/plan-sync-adm-009-017
