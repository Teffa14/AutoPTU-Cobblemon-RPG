name: Integration Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare test evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-evidence/runtime test-evidence/visual
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
          } > test-evidence/run-metadata.txt
      - name: Run authority tests
        shell: bash
        run: |
          set -euo pipefail
          gradle test --no-daemon 2>&1 | tee test-evidence/gradle-test.log
      - name: Prepare production Fabric + Cobblemon smoke mods
        shell: bash
        run: |
          set -euo pipefail
          gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon 2>&1 | tee test-evidence/prepare-production-smoke.log
      - name: Boot production Fabric + Cobblemon dedicated server
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/fabric-production-smoke"
          mkdir -p "$server_dir/mods"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.17.2/1.0.3/server/jar'

          (
            cd "$server_dir"
            java \
              -Dautoptu.liveRelocationSmoke=true \
              -Dautoptu.liveHealthSmoke=true \
              -Dautoptu.liveBattleInterceptionSmoke=true \
              -Dautoptu.liveAuthenticatedPlayerContextSmoke=true \
              -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../fabric-server-smoke.log 2>&1
          ) &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 180); do
            if grep -q 'AutoPTU Fabric server adapter initialized' "$server_dir/logs/latest.log" 2>/dev/null \
              && grep -q 'AutoPTU Cobblemon runtime detected:' "$server_dir/logs/latest.log" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon relocation smoke passed' "$server_dir/logs/latest.log" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon HP projection smoke passed' "$server_dir/logs/latest.log" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon battle interception smoke passed' "$server_dir/logs/latest.log" 2>/dev/null \
              && grep -q 'AutoPTU live authenticated player context smoke passed' "$server_dir/logs/latest.log" 2>/dev/null \
              && grep -q 'Done (' "$server_dir/logs/latest.log" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat fabric-server-smoke.log || true
            if [ -f "$server_dir/logs/latest.log" ]; then
              cat "$server_dir/logs/latest.log"
            fi
            exit 1
          fi

          grep 'AutoPTU live Cobblemon relocation smoke passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU live Cobblemon HP projection smoke passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU live Cobblemon battle interception smoke passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU live authenticated player context smoke passed' "$server_dir/logs/latest.log"
      - name: Collect runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p test-evidence/runtime
          cp fabric-server-smoke.log test-evidence/runtime/fabric-server-smoke.log 2>/dev/null || true
          cp fabric-production-smoke/logs/latest.log test-evidence/runtime/minecraft-latest.log 2>/dev/null || true
          cp fabric-production-smoke/logs/debug.log test-evidence/runtime/minecraft-debug.log 2>/dev/null || true

          latest="fabric-production-smoke/logs/latest.log"
          manifest="test-evidence/runtime/smoke-markers.txt"
          : > "$manifest"
          for marker in \
            'AutoPTU Fabric server adapter initialized' \
            'AutoPTU Cobblemon runtime detected:' \
            'AutoPTU live Cobblemon relocation smoke passed' \
            'AutoPTU live Cobblemon HP projection smoke passed' \
            'AutoPTU live Cobblemon battle interception smoke passed' \
            'AutoPTU live authenticated player context smoke passed' \
            'Done ('; do
            if [ -f "$latest" ] && grep -F "$marker" "$latest" >> "$manifest"; then
              true
            else
              echo "MISSING: $marker" >> "$manifest"
            fi
          done

          cat > test-evidence/visual/README.txt <<'EOF'
          Visual evidence belongs here when a test runs with a graphical Minecraft client.
          Store MP4 recordings and PNG screenshots in this directory. The CI artifact upload
          step collects them automatically. Dedicated-server smokes are headless, so they
          produce runtime logs and marker evidence rather than video.
          EOF
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-evidence/**
            build/test-results/test/**
            build/reports/tests/test/**
            fabric-adapter/build/test-results/test/**
            fabric-adapter/build/reports/tests/test/**
