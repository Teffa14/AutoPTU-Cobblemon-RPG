name: RPG Visual Evidence

on:
  pull_request:
    paths:
      - 'fabric-adapter/**'
      - '.github/workflows/rpg-visual-evidence.yml'
  workflow_dispatch:

jobs:
  graphical-client-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install virtual display tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick
      - name: Prepare production Fabric + Cobblemon mods
        run: gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon
      - name: Prepare graphical evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-evidence/visual graphical-client/mods
          cp fabric-adapter/build/production-smoke/mods/*.jar graphical-client/mods/
      - name: Launch Minecraft client under virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 > xvfb.log 2>&1 &
          export DISPLAY=:99
          timeout 180s gradle :fabric-adapter:runClient --no-daemon > graphical-client.log 2>&1 &
          client_pid=$!
          window=""
          for _ in $(seq 1 150); do
            if grep -qE 'Game crashed!|runClient FAILED|Could not execute entrypoint' graphical-client.log 2>/dev/null; then
              cat graphical-client.log
              exit 1
            fi
            window="$(xdotool search --onlyvisible --name 'Minecraft' 2>/dev/null | head -1 || true)"
            if [ -n "$window" ]; then
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              cat graphical-client.log || true
              exit 1
            fi
            sleep 1
          done
          if [ -z "$window" ]; then
            cat graphical-client.log || true
            exit 1
          fi
          sleep 8
          import -window "$window" test-evidence/visual/minecraft-client-boot.png
          # A black X root capture is not graphical evidence. Require actual pixel variation.
          colors="$(identify -format '%k' test-evidence/visual/minecraft-client-boot.png)"
          if [ "$colors" -lt 8 ]; then
            echo "Rejected blank/near-blank screenshot: only $colors colors"
            exit 1
          fi
          if grep -qE 'Game crashed!|runClient FAILED|Could not execute entrypoint' graphical-client.log; then
            cat graphical-client.log
            exit 1
          fi
          kill "$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true
          test -s test-evidence/visual/minecraft-client-boot.png
      - name: Collect graphical diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p test-evidence/diagnostics
          cp fabric-adapter/run/crash-reports/*.txt test-evidence/diagnostics/ 2>/dev/null || true
          cp fabric-adapter/run/logs/latest.log test-evidence/diagnostics/minecraft-client-latest.log 2>/dev/null || true
      - name: Upload graphical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-visual-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            test-evidence/visual/**
            test-evidence/diagnostics/**
            graphical-client.log
            xvfb.log
