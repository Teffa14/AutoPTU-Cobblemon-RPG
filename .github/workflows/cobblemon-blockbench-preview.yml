name: Cobblemon Blockbench Preview

on:
  push:
    branches:
      - feat/cobblemon-skin-studio-clean-v2
    paths:
      - '.github/workflows/cobblemon-blockbench-preview.yml'
      - 'tools/cobblemon-model-review/capture_with_blockbench.mjs'
      - 'test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cobblemon-blockbench-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  BLOCKBENCH_TAG: v5.1.6

jobs:
  preview-official-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and verify official Cobblemon release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" \
            -o .upstream/version.json
          python3 - <<'PY' > .upstream/download.env
          import json, shlex
          data = json.load(open('.upstream/version.json', encoding='utf-8'))
          assert data['id'] == 'kF7CvxTo'
          assert data['version_number'] == '1.7.3'
          assert '1.21.1' in data['game_versions']
          assert 'fabric' in data['loaders']
          primary = next((f for f in data['files'] if f.get('primary')), data['files'][0])
          print('DOWNLOAD_URL=' + shlex.quote(primary['url']))
          print('EXPECTED_SHA512=' + shlex.quote(primary['hashes']['sha512']))
          print('EXPECTED_SHA1=' + shlex.quote(primary['hashes']['sha1']))
          PY
          source .upstream/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$DOWNLOAD_URL" -o .upstream/cobblemon.jar
          test "$(sha512sum .upstream/cobblemon.jar | awk '{print $1}')" = "$EXPECTED_SHA512"
          test "$(sha1sum .upstream/cobblemon.jar | awk '{print $1}')" = "$EXPECTED_SHA1"

      - name: Extract exact official Pikachu inputs
        shell: bash
        run: |
          set -euo pipefail
          unzip -p .upstream/cobblemon.jar \
            assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_male.geo.json \
            > .upstream/pikachu_male.geo.json
          unzip -p .upstream/cobblemon.jar \
            assets/cobblemon/textures/pokemon/0025_pikachu/pikachu.png \
            > .upstream/pikachu.png
          unzip -p .upstream/cobblemon.jar \
            assets/cobblemon/bedrock/pokemon/animations/0025_pikachu/pikachu.animation.json \
            > .upstream/pikachu.animation.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-manifest.json').read_text())
          files = {
              'model': Path('.upstream/pikachu_male.geo.json'),
              'texture': Path('.upstream/pikachu.png'),
              'animation': Path('.upstream/pikachu.animation.json'),
          }
          for key, path in files.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = manifest['assets'][key]['sha256']
              assert actual == expected, (key, actual, expected)
          print('Official Pikachu inputs match pinned manifest')
          PY

      - name: Build pinned Blockbench web viewer
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BLOCKBENCH_TAG" \
            https://github.com/JannisX11/blockbench.git .blockbench
          cd .blockbench
          npm ci --no-audit --no-fund
          npm run build-web

      - name: Install Playwright driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tools/cobblemon-model-review \
            --no-save --package-lock=false playwright@1.55.0
          tools/cobblemon-model-review/node_modules/.bin/playwright install --with-deps chromium

      - name: Start pinned Blockbench viewer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .blockbench \
            > /tmp/blockbench-http.log 2>&1 &
          echo $! > /tmp/blockbench-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/blockbench-http.log
          exit 1

      - name: Capture untouched official Pikachu through Blockbench
        shell: bash
        run: |
          set -euo pipefail
          node tools/cobblemon-model-review/capture_with_blockbench.mjs \
            --base-url http://127.0.0.1:4173 \
            --model .upstream/pikachu_male.geo.json \
            --texture .upstream/pikachu.png \
            --animation .upstream/pikachu.animation.json \
            --animation-name animation.pikachu.ground_idle \
            --output test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-blockbench-standing.png \
            --metadata test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-blockbench-standing.json

      - name: Validate external-viewer evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          manifest = json.loads(Path('test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-manifest.json').read_text())
          metadata = json.loads(Path('test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-blockbench-standing.json').read_text())
          png = Path('test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-blockbench-standing.png').read_bytes()
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', png[16:24])
          assert width >= 500 and height >= 500, (width, height)
          assert metadata['viewer']['name'] == 'Blockbench'
          assert metadata['viewer']['version'] == '5.1.6'
          assert metadata['viewer']['renderer'] == 'Blockbench WebGL canvas'
          assert metadata['inputs']['model']['sha256'] == manifest['assets']['model']['sha256']
          assert metadata['inputs']['texture']['sha256'] == manifest['assets']['texture']['sha256']
          assert metadata['inputs']['animation']['sha256'] == manifest['assets']['animation']['sha256']
          assert metadata['inputs']['animationName'] == 'animation.pikachu.ground_idle'
          assert metadata['assertions']['customGeometryRendererUsed'] is False
          assert metadata['assertions']['projectAuthoredBoneTransformsUsed'] is False
          assert metadata['assertions']['modelEditedBeforeCapture'] is False
          assert hashlib.sha256(png).hexdigest() == metadata['output']['sha256']
          print(f'Blockbench evidence valid: {width}x{height}, {len(png)} bytes')
          PY

      - name: Upload external-viewer evidence
        uses: actions/upload-artifact@v4
        with:
          name: pikachu-1.7.3-blockbench-standing
          path: |
            test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-blockbench-standing.png
            test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-blockbench-standing.json

      - name: Commit external-viewer evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-blockbench-standing.png \
            test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-blockbench-standing.json
          if git diff --cached --quiet; then
            echo 'Blockbench evidence already current.'
            exit 0
          fi
          git commit -m 'Evidence: render untouched Pikachu in Blockbench 5.1.6'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
