name: WORLD-013 Plan Bookkeeping

on:
  push:
    branches:
      - feat/world-013-player-proximity-habitat-activation

permissions:
  contents: write

jobs:
  update-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/world-013-player-proximity-habitat-activation
          fetch-depth: 0
      - name: Record shipped ecology slices in canonical plan
        shell: python
        run: |
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          marker = 'Integration Core CI #2060 verified authority tests, production mod build, Marea presence reconciliation and canonical-store restart through two real Fabric + Cobblemon boots; the graphical gates also remained green. Further same-profile habitat authoring remains safe; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists. Movement-only invisible encounters remain prohibited.'
          replacement = 'Integration Core CI #2060 verified authority tests, production mod build, Marea presence reconciliation and canonical-store restart through two real Fabric + Cobblemon boots; the graphical gates also remained green. PR #466 / merge `154ed10a1700138cf690fad56f9925638b5eac8b` adds the third authored population at `ouros.marea.mirador_transect`, bringing normal Marea to six independently-bound visible Fletchling actors across three canonical populations while reusing only the complete approved PTU profile; its runtime smoke verifies six distinct exact bindings and one-member replacement while the other five remain stable. PR #467 / production head `34ee8d9932c97a9720ff984b568a94a0079ebf18` makes normal population projection player-proximity driven: non-spectator players activate authored habitats within 96 blocks on a 100-tick server cadence, so inactive Marea habitats no longer force their chunks loaded at startup; explicit all-population projection remains an admin/smoke bootstrap only, and ordinary chunk unload preserves canonical encounter identity. Integration Core CI #2066 verifies dormant no-player proximity state before the existing six-member replacement/restart smoke. Further same-profile habitat policy remains safe; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists. Movement-only invisible encounters remain prohibited.'
          if marker not in text:
              raise SystemExit('WORLD-013 bookkeeping marker missing')
          path.write_text(text.replace(marker, replacement, 1))
      - name: Remove one-shot bookkeeping workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/world-013-plan-bookkeeping.yml
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'WORLD-013: record Mirador and proximity activation in plan'
          git push origin HEAD:feat/world-013-player-proximity-habitat-activation
