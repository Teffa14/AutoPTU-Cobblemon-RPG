name: Temporary WORLD-013 plan patch

on:
  push:
    branches:
      - feat/world-013-authored-roaming-footprints

permissions:
  contents: write

jobs:
  patch-plan:
    if: ${{ !contains(github.event.head_commit.message, '[world013-plan-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/world-013-authored-roaming-footprints
          fetch-depth: 0
      - name: Patch canonical tooling plan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          marker = "All four populations reuse only the same already-approved complete PTU profile; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists. Movement-only invisible encounters remain prohibited. |"
          replacement = "PR #470 / production head `8c6ae11c45726347a19db761ad9e3928defc2dee` / merge `deef12efa36e49cc77447246ced6e4c4df55668a` replaces the former single 96-block activation radius with four server-authored per-population presence footprints while preserving the same eight canonical actor bindings. PR #471 / production head `202fa181be920d6afc1da059fe45c3fd2b6c8b9e` adds four server-authored Minecraft presentation roaming footprints and enforces them without changing canonical encounter identity; the dedicated Crossing smoke moves one bound actor 25 blocks on X, outside its authored 20-block roaming extent but inside the prior global 32-block leash, then proves it returns to its anchor with the same UUID and encounter binding. All four populations reuse only the same already-approved complete PTU profile; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists. Movement-only invisible encounters remain prohibited. |"
          if marker not in text:
              raise SystemExit('WORLD-013 plan marker not found; refusing broad rewrite')
          if text.count(marker) != 1:
              raise SystemExit('WORLD-013 plan marker is not unique; refusing broad rewrite')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          git diff --check
          git diff -- MINECRAFT_RPG_TOOLING_PLAN.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m 'WORLD-013 record habitat policy slices [world013-plan-patched]'
          git push origin HEAD:feat/world-013-authored-roaming-footprints
