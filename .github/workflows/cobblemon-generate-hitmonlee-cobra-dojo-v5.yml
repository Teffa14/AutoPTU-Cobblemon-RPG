name: Generate Hitmonlee Cobra Dojo V5 Production Assets
on:
  push:
    branches: ['art/hitmonlee-cobra-dojo-v5-hood']
    paths:
      - '.github/workflows/cobblemon-generate-hitmonlee-cobra-dojo-v5.yml'
      - 'tools/cobblemon-model-review/build_cobra_dojo_hitmonlee_v5.py'
  workflow_dispatch:
permissions:
  contents: write
env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  COBBLEMON_VERSION: '1.7.3'
  MINECRAFT_VERSION: '1.21.1'
  COBBLEMON_FILENAME: 'Cobblemon-fabric-1.7.3+1.21.1.jar'
  COBBLEMON_JAR_SHA256: 'f7c25955176badc444ad6211fc556514fedbdba776227f105fe899f8819d74e3'
  COBBLEMON_JAR_SHA512: '7b5376f5f48177db53790237b6fb25378806972b5d3b756151b4d8f2d3c27238d6b587b77da422bc1780bfd358b4702e74369fd82cef2a35301b4b68a2f13c2e'
  OFFICIAL_MODEL_SHA256: 'f92b067c781f9210dec305860bdb09141efad5c238396ac7988c4bbbed82840d'
  OFFICIAL_NORMAL_SHA256: 'cbf05271a594e788e7173fd3e34ee32b35488781dd97b7e100455fe57d919574'
  OFFICIAL_SHINY_SHA256: 'a677824d9be92b46ff6359ce58118e67fce1078632908cfc0ac80816e7c1c065'
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify official source and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .generate/official .generate/output
          curl -fsSL -A 'Ouros-Hitmonlee-Cobra-v5' "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .generate/version.json
          python - <<'PY' > .generate/env
          import json,os,shlex
          d=json.load(open('.generate/version.json')); p=next(f for f in d['files'] if f.get('primary'))
          assert d['id']==os.environ['COBBLEMON_VERSION_ID'] and d['version_number']==os.environ['COBBLEMON_VERSION']
          assert os.environ['MINECRAFT_VERSION'] in d['game_versions'] and 'fabric' in d['loaders']
          assert p['filename']==os.environ['COBBLEMON_FILENAME'] and p['hashes']['sha512']==os.environ['COBBLEMON_JAR_SHA512']
          print('PROJECT='+shlex.quote(d['project_id'])); print('URL='+shlex.quote(p['url']))
          PY
          source .generate/env
          curl -fsSL -A 'Ouros-Hitmonlee-Cobra-v5' "https://api.modrinth.com/v2/project/${PROJECT}/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D" -o .generate/compatible.json
          python - <<'PY'
          import json,os
          stable=[v for v in json.load(open('.generate/compatible.json')) if v.get('version_type')=='release']; latest=max(stable,key=lambda v:v['date_published']); assert latest['id']==os.environ['COBBLEMON_VERSION_ID'],(latest['id'],latest['version_number'])
          PY
          curl -fsSL "$URL" -o .generate/cobblemon.jar
          printf '%s  %s\n' "$COBBLEMON_JAR_SHA256" .generate/cobblemon.jar | sha256sum -c -
          printf '%s  %s\n' "$COBBLEMON_JAR_SHA512" .generate/cobblemon.jar | sha512sum -c -
          python - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          entries=[('assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/hitmonlee.geo.json','hitmonlee.geo.json','OFFICIAL_MODEL_SHA256'),('assets/cobblemon/textures/pokemon/0106_hitmonlee/hitmonlee.png','hitmonlee.png','OFFICIAL_NORMAL_SHA256'),('assets/cobblemon/textures/pokemon/0106_hitmonlee/hitmonlee_shiny.png','hitmonlee_shiny.png','OFFICIAL_SHINY_SHA256')]
          with zipfile.ZipFile('.generate/cobblemon.jar') as z:
            for member,target,key in entries:
              b=z.read(member); assert hashlib.sha256(b).hexdigest()==os.environ[key]; Path('.generate/official',target).write_bytes(b)
          PY
          python tools/cobblemon-model-review/build_cobra_dojo_hitmonlee_v5.py --model .generate/official/hitmonlee.geo.json --normal .generate/official/hitmonlee.png --shiny .generate/official/hitmonlee_shiny.png --output-root .generate/output | tee .generate/build.log
          python tools/cobblemon-model-review/validate_original_model.py --official .generate/official/hitmonlee.geo.json --candidate .generate/output/ouros_cobra_dojo_hitmonlee.geo.json
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          r=json.loads(Path('.generate/output/build-report.json').read_text()); assert r['originalBones']==30 and r['derivedBones']==43 and r['cosmeticBones']==13
          b=json.loads(Path('.generate/output/ouros_cobra_dojo_hitmonlee.geo.json').read_text())['minecraft:geometry'][0]['bones']; assert b[30]['name']=='ouros_cobra_mantle' and len(b)==43
          for s,t in [('hitmonlee.png','ouros_cobra_dojo_hitmonlee.png'),('hitmonlee_shiny.png','ouros_cobra_dojo_hitmonlee_shiny.png')]:
            a=Image.open('.generate/official/'+s).convert('RGBA'); d=Image.open('.generate/output/'+t).convert('RGBA'); changed=[(x,y) for y in range(64) for x in range(64) if a.getpixel((x,y))!=d.getpixel((x,y))]; assert changed==[(x,63) for x in range(9)],changed
          print(json.dumps(r,indent=2))
          PY
      - name: Install and commit v5 production assets
        shell: bash
        run: |
          set -euo pipefail
          md='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee'; td='fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0106_hitmonlee'
          cp .generate/output/ouros_cobra_dojo_hitmonlee.geo.json "$md/ouros_cobra_dojo_hitmonlee.geo.json"
          cp .generate/output/ouros_cobra_dojo_hitmonlee.png "$td/ouros_cobra_dojo_hitmonlee.png"
          cp .generate/output/ouros_cobra_dojo_hitmonlee_shiny.png "$td/ouros_cobra_dojo_hitmonlee_shiny.png"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$md/ouros_cobra_dojo_hitmonlee.geo.json" "$td/ouros_cobra_dojo_hitmonlee.png" "$td/ouros_cobra_dojo_hitmonlee_shiny.png"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'skins: generate Hitmonlee Cobra Dojo v5 assets'; git push origin HEAD:${GITHUB_REF_NAME}
