name: FAC010 Plan Finalize

on:
  push:
    branches:
      - automation/fac-010-league-registration

permissions:
  contents: write

jobs:
  finalize-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize canonical Minecraft RPG plan
        shell: python
        run: |
          from pathlib import Path
          path = Path("MINECRAFT_RPG_TOOLING_PLAN.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("fb452f60fb14dddbb146f2df78e5dad79d074c08", "eda1f3694f311a01ae1bb5856deaf199036d8e7e")

          old_world = "| WORLD-020 | LIVE/PARTIAL | Gym/league registration desk — PR #364 / merge `6bcdda6fc255ebf632d8e487c62b48c452422c05`; the explicit namespaced desk opens a server-side registration menu, revalidates authenticated Trainer, canonical party, physical desk identity and range, and produces only the immutable server-authored Cedar Gym challenge request. Opponent provisioning, battle-start legality and every PTU outcome remain with AutoPTU-Java. |"
          new_world = "| WORLD-020 | LIVE/PARTIAL | Gym/league registration desk — PR #364 / merge `6bcdda6fc255ebf632d8e487c62b48c452422c05` established the explicit namespaced desk and canonical challenge readiness. PR #408 / implementation head `eda1f3694f311a01ae1bb5856deaf199036d8e7e` now commits that authored Cedar Gym Trial registration durably from the physical menu after revalidating Trainer, party, desk identity and range. Opponent provisioning, battle-start legality, records mutation and every PTU outcome remain with AutoPTU-Java. |"
          if old_world not in text:
              raise SystemExit("WORLD-020 anchor missing")
          text = text.replace(old_world, new_world, 1)

          old_fast = "| TODO | Fast-travel unlocks/checkpoints. |"
          new_fast = "| LIVE/PARTIAL | Fast-travel unlocks/checkpoints — PR #404 / merge `a228f771495063a1108a118e7eeeba162c9471c2`; owner-scoped authored location discovery now gates fast-travel destinations durably. Additional destinations/checkpoint authoring remain follow-up work. |"
          if old_fast not in text:
              raise SystemExit("fast-travel persistence anchor missing")
          text = text.replace(old_fast, new_fast, 1)

          mail_row = "| LIVE/PARTIAL | Durable RPG mail read/claim state — PR #401 / merge `6dc7cdeec086de809e27be9d454acf07af8710e2`; owner-scoped read and reward-claim sets persist atomically, while deterministic canonical wallet receipts recover a crash after currency credit without duplicate grants. |"
          additions = mail_row + "\n| LIVE/PARTIAL | Nursery custody — PR #407 / merge `333f23c012d88aa499cfab7d2e5bb60c38a8a693`; owner-scoped Cedar Nursery custody persists canonical Pokemon identity separately from party/box availability and reconciles interrupted enroll/release operations after restart. Breeding, XP, evolution and move-learning are absent. |\n| LIVE/PARTIAL | Gym/League registration — PR #408 / implementation head `eda1f3694f311a01ae1bb5856deaf199036d8e7e`; owner-scoped authored challenge registrations persist atomically with revision CAS and idempotent repeats. Existing Trainer records are read alongside registration but are not mutated by this domain. |"
          if "| LIVE/PARTIAL | Gym/League registration — PR #408" not in text:
              if mail_row not in text:
                  raise SystemExit("mail persistence anchor missing")
              text = text.replace(mail_row, additions, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit plan and remove helper
        shell: bash
        run: |
          rm .github/workflows/fac010-plan-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/fac010-plan-finalize.yml
          git commit -m "FAC-010 finalize canonical Minecraft RPG plan"
          git push origin HEAD:automation/fac-010-league-registration
