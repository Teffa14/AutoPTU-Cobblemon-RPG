name: Playable Test Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-playable-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build remapped playable Fabric mod
        run: gradle :fabric-adapter:remapJar --no-daemon
      - name: Prepare download bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playable-download
          find fabric-adapter/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -exec cp {} playable-download/AutoPTU-Cobblemon-RPG-playable-test.jar \;
          test -f playable-download/AutoPTU-Cobblemon-RPG-playable-test.jar
          cat > playable-download/INSTALL.txt <<'EOF'
          AutoPTU Cobblemon playable test

          Minecraft: 1.21.1
          Java: 21
          Fabric Loader: 0.17.2
          Fabric API: 0.116.11+1.21.1
          Fabric Language Kotlin: 1.13.6+kotlin.2.2.20
          Cobblemon: 1.7.3+1.21.1

          Put AutoPTU-Cobblemon-RPG-playable-test.jar in the same mods folder.
          Join a world/server and run one of:
            /autoptu testbattle bulbasaur
            /autoptu testbattle charmander
            /autoptu testbattle squirtle
          EOF
      - name: Upload playable mod
        uses: actions/upload-artifact@v4
        with:
          name: autoptu-playable-test-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: playable-download/**
      - name: Record ADM-002 in canonical plan and restore workflow
        if: github.event_name == 'pull_request' && github.head_ref == 'rpg/adm-002-player-validate'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
          python - <<'PY'
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text(encoding='utf-8')
          old = '| ADM-002 | TODO | `/autoptu admin player validate <player>` |'
          new = '| ADM-002 | LIVE/PARTIAL | `/autoptu admin player validate <player>` — PR #617 / implementation head `50779e71e4f7a78e4394676e02d162d3ff286492`; permission-level-2 operators resolve an online Minecraft player through the server-owned UUID-derived canonical identity and perform read-only structural consistency checks across Trainer, party, bag/reservation and persisted progression projections. Owner mismatches, duplicate structural identities and aggregate bag/lock inconsistencies fail visibly; missing progression is surfaced as a warning rather than becoming invented PTU/progression policy. Offline identity resolution and broader whole-save validation remain follow-up work. |'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one ADM-002 TODO row, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git checkout origin/main -- .github/workflows/playable-test-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/playable-test-build.yml
          git diff --cached --check
          git commit -m 'ADM-002: record canonical plan'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
