name: Apply SVC-003 plan update once

on:
  push:
    branches:
      - svc-003-bag-readiness-projection

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: svc-003-bag-readiness-projection
          fetch-depth: 0
      - name: Patch canonical plan and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          plan = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          old = '| SVC-003 | TODO | `canUse(player, item, target, context)` |'
          new = '| SVC-003 | LIVE/PARTIAL | `canUse(player, item, target, context)` — PR #607 established the reusable server-owned preflight over canonical Trainer identity, exact item ownership, available quantity, transaction locks and server-observed target/context. PRs #608-#612 moved that boundary into the normal canonical bag surface with clickable selection, physical Bundle quick access, a read-only paged Minecraft inventory UI and server-authored item presentation. PR #613 / production head `afc2170d245e84dba84c12dbadcb9d6c87440bde` adds fresh server-authored ready/blocked item-use preflight state to every displayed bag stack while every click still re-resolves the canonical stack and runs `canUse` again. PTU item effects, battle targeting/action economy, healing, capture, RNG and outcomes remain upstream-owned. |'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one SVC-003 TODO row, found {text.count(old)}')
          plan.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/plan-patch-svc003-once.yml').unlink()
      - name: Commit canonical plan update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/plan-patch-svc003-once.yml
          git commit -m "Plan: record SVC-003 bag readiness slice"
          git push origin HEAD:svc-003-bag-readiness-projection
