name: Hitmonlee Official Rig Name Probe
on:
  push:
    branches: ['art/hitmonlee-cobra-dojo-v5-hood']
    paths: ['.github/workflows/cobblemon-hitmonlee-rig-name-probe.yml']
permissions:
  contents: read
env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  JAR_SHA256: 'f7c25955176badc444ad6211fc556514fedbdba776227f105fe899f8819d74e3'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact official Hitmonlee bone names and torso2 cubes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .probe
          curl -fsSL "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .probe/version.json
          python - <<'PY' > .probe/download.env
          import json,shlex
          d=json.load(open('.probe/version.json')); p=next(f for f in d['files'] if f.get('primary')); print('JAR_URL='+shlex.quote(p['url']))
          PY
          source .probe/download.env
          curl -fsSL "$JAR_URL" -o .probe/cobblemon.jar
          printf '%s  %s\n' "$JAR_SHA256" .probe/cobblemon.jar | sha256sum -c -
          python - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('.probe/cobblemon.jar') as z:
            d=json.loads(z.read('assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/hitmonlee.geo.json'))
          bones=d['minecraft:geometry'][0]['bones']
          for i,b in enumerate(bones): print(i,b.get('name'),'parent=',b.get('parent'),'pivot=',b.get('pivot'))
          torso2=next(b for b in bones if b.get('name')=='torso2')
          print('TORSO2_CUBES=',json.dumps(torso2.get('cubes',[]),separators=(',',':')))
          PY
