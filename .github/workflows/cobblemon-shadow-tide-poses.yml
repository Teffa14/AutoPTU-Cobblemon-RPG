name: Shadow Tide Real Blockbench Evidence

on:
  push:
    branches: ['feat/greninja-shadow-tide']
    paths:
      - '.github/workflows/cobblemon-shadow-tide-poses.yml'
      - 'tools/cobblemon-model-review/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0658_greninja/ouros_shadow_tide_*.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0658_greninja/ouros_shadow_tide_accessories.png'
  workflow_dispatch:

permissions: {contents: write}
concurrency:
  group: shadow-tide-real-evidence-${{ github.ref }}
  cancel-in-progress: true
env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  BLOCKBENCH_VERSION: 5.1.6
  BLOCKBENCH_SHA256: c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Blockbench review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64
      - name: Extract exact official Greninja sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pose/official
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Greninja-Blockbench' "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .pose/version.json
          python - <<'PY' > .pose/download.env
          import json,shlex
          d=json.load(open('.pose/version.json')); assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1'] and 'fabric' in d['loaders']
          p=next(f for f in d['files'] if f.get('primary')); assert p['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'; print('URL='+shlex.quote(p['url'])); print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .pose/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .pose/cobblemon.jar
          printf '%s  %s\n' "$SHA512" .pose/cobblemon.jar | sha512sum --check --strict
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0658_greninja/greninja.geo.json' > .pose/official/greninja.geo.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0658_greninja/ashgreninja.geo.json' > .pose/official/ashgreninja.geo.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0658_greninja/greninja.animation.json' > .pose/official/greninja.animation.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/textures/pokemon/0658_greninja/greninja.png' > .pose/official/greninja.png
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/textures/pokemon/0658_greninja/ash_greninja.png' > .pose/official/ash_greninja.png
          test "$(sha256sum .pose/official/greninja.geo.json|awk '{print $1}')" = b9608c2eef6dc1a407da31192fde20ae2cea135e7399c14926598acce091e30d
          test "$(sha256sum .pose/official/ashgreninja.geo.json|awk '{print $1}')" = be45c61cc17a7ab6408c06e70905e53c7dbd3c99cba4e8bff0192a03849ca7f5
          test "$(sha256sum .pose/official/greninja.animation.json|awk '{print $1}')" = 9e0176549e372324127fc2c8edbaa5d72ca6009dac06088c65df89790d3548f3
          test "$(sha256sum .pose/official/greninja.png|awk '{print $1}')" = 6a7b6ed1b1e93111413e47c11e9423a35e2877140e69b1bac1cb285c46ab6464
      - name: Prove both anatomies and build exact composite textures
        shell: bash
        run: |
          set -euo pipefail
          normal=fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0658_greninja/ouros_shadow_tide_greninja.geo.json
          ash=fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0658_greninja/ouros_shadow_tide_ash_greninja.geo.json
          python tools/cobblemon-model-review/validate_original_model.py --official .pose/official/greninja.geo.json --candidate "$normal"
          python tools/cobblemon-model-review/validate_original_model.py --official .pose/official/ashgreninja.geo.json --candidate "$ash"
          python - <<'PY'
          from PIL import Image
          overlay=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0658_greninja/ouros_shadow_tide_accessories.png').convert('RGBA')
          for src,out in [('greninja.png','shadow-normal.png'),('ash_greninja.png','shadow-ash.png')]:
              base=Image.open('.pose/official/'+src).convert('RGBA'); assert base.size==overlay.size==(128,64); Image.alpha_composite(base,overlay).save('.pose/'+out,optimize=True)
          PY
      - name: Download pinned Blockbench
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" -o .pose/blockbench.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" .pose/blockbench.AppImage | sha256sum --check --strict
          chmod +x .pose/blockbench.AppImage
          (cd .pose && ./blockbench.AppImage --appimage-extract >/dev/null)
      - name: Render matched normal, battle, walk and Ash form evidence
        shell: bash
        run: |
          set -euo pipefail
          root=test-evidence/visual/cobblemon-skins/0658_greninja/shadow-tide-real-poses
          rm -rf "$root" .pose/renders; mkdir -p "$root" .pose/renders
          cleanup(){ pid="${1:-}"; [ -z "$pid" ] || kill "$pid" 2>/dev/null || true; [ -z "$pid" ] || wait "$pid" 2>/dev/null || true; pkill -f "$PWD/.pose/squashfs-root/blockbench" 2>/dev/null || true; sleep 2; }
          one(){ model="$1"; texture="$2"; anim="$3"; frame="$4"; out="$5"; port="$6"; name="$7"; attempt="$8"; user="$PWD/.pose/user-${name}-${attempt}"; log="$PWD/.pose/${name}-${attempt}.log"; rm -rf "$user" "$out"; mkdir -p "$user" "$out"; xvfb-run -a -s '-screen 0 1800x1400x24' env APPDIR="$PWD/.pose/squashfs-root" .pose/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$user" "$model" >"$log" 2>&1 & pid=$!; ready=0; for _ in $(seq 1 90); do if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi; kill -0 "$pid" 2>/dev/null || { cat "$log"; cleanup "$pid"; return 1; }; sleep 1; done; [ "$ready" = 1 ] || { cat "$log"; cleanup "$pid"; return 1; }; node tools/cobblemon-model-review/blockbench_capture.mjs --endpoint "http://127.0.0.1:${port}" --texture "$texture" --animation "$PWD/.pose/official/greninja.animation.json" --animation-name "$anim" --animation-time "$frame" --output-dir "$out" || { cat "$log"; cleanup "$pid"; return 1; }; cleanup "$pid"; }
          render(){ for a in 1 2 3; do one "$1" "$2" "$3" "$4" "$5" "$6" "$7" "$a" && return 0; done; return 1; }
          official="$PWD/.pose/official/greninja.geo.json"; hero="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0658_greninja/ouros_shadow_tide_greninja.geo.json"; ash="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0658_greninja/ouros_shadow_tide_ash_greninja.geo.json"
          render "$official" "$PWD/.pose/official/greninja.png" animation.greninja.ground_idle 0.35 "$PWD/.pose/renders/official" 9281 official
          render "$hero" "$PWD/.pose/shadow-normal.png" animation.greninja.ground_idle 0.35 "$PWD/.pose/renders/hero" 9282 hero
          render "$hero" "$PWD/.pose/shadow-normal.png" animation.greninja.battle_idle 0.35 "$PWD/.pose/renders/battle" 9283 battle
          render "$hero" "$PWD/.pose/shadow-normal.png" animation.greninja.ground_walk 0.25 "$PWD/.pose/renders/walk" 9284 walk
          render "$ash" "$PWD/.pose/shadow-ash.png" animation.greninja.ground_idle 0.35 "$PWD/.pose/renders/ash" 9285 ash
          cp .pose/renders/official/three_quarter.png "$root/official_reference_three_quarter.png"
          cp .pose/renders/hero/three_quarter.png "$root/hero_three_quarter.png"
          cp .pose/renders/battle/three_quarter.png "$root/battle_ready_three_quarter.png"
          cp .pose/renders/walk/three_quarter.png "$root/walking_three_quarter.png"
          cp .pose/renders/ash/three_quarter.png "$root/ash_hero_three_quarter.png"
          cp .pose/renders/hero/front.png "$root/hero_front.png"; cp .pose/renders/hero/left.png "$root/hero_left.png"; cp .pose/renders/hero/right.png "$root/hero_right.png"; cp .pose/renders/hero/back.png "$root/hero_back.png"
      - name: Validate evidence provenance and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          expected={'official':('animation.greninja.ground_idle',78),'hero':('animation.greninja.ground_idle',86),'battle':('animation.greninja.battle_idle',86),'walk':('animation.greninja.ground_walk',86),'ash':('animation.greninja.ground_idle',89)}
          for n,(a,b) in expected.items():
              m=json.loads((Path('.pose/renders')/n/'blockbench-metadata.json').read_text()); assert m['viewer']=='Blockbench' and m['sourceOfTransforms']=='Blockbench Bedrock animation codec' and m['modelInfo']['boneCount']==b and m['modelInfo']['appliedAnimation']['name']==a
          root=Path('test-evidence/visual/cobblemon-skins/0658_greninja/shadow-tide-real-poses'); names=['official_reference_three_quarter.png','hero_three_quarter.png','battle_ready_three_quarter.png','walking_three_quarter.png','ash_hero_three_quarter.png','hero_front.png','hero_left.png','hero_right.png','hero_back.png']; hashes={}
          for n in names:
              p=root/n; im=Image.open(p).convert('RGBA'); assert im.size==(1024,1024) and im.getbbox() is not None; hashes[n]=hashlib.sha256(p.read_bytes()).hexdigest()
          meta={'format':'ouros.cobblemon-blockbench-pose-evidence.v1','viewer':'Blockbench 5.1.6','modelSource':'official Cobblemon 1.7.3 Fabric JAR, Modrinth kF7CvxTo','normalModelSha256':'b9608c2eef6dc1a407da31192fde20ae2cea135e7399c14926598acce091e30d','ashModelSha256':'be45c61cc17a7ab6408c06e70905e53c7dbd3c99cba4e8bff0192a03849ca7f5','animationSha256':'9e0176549e372324127fc2c8edbaa5d72ca6009dac06088c65df89790d3548f3','normalOriginalBoneCount':78,'normalDerivedBoneCount':86,'ashOriginalBoneCount':81,'ashDerivedBoneCount':89,'poses':{'hero':{'animation':'animation.greninja.ground_idle','time':0.35},'battle_ready':{'animation':'animation.greninja.battle_idle','time':0.35},'walking':{'animation':'animation.greninja.ground_walk','time':0.25},'ash_hero':{'animation':'animation.greninja.ground_idle','time':0.35}},'files':hashes}
          (root/'pose-metadata.json').write_text(json.dumps(meta,indent=2)+'\n'); print(json.dumps(meta,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-tide-real-poses
          path: test-evidence/visual/cobblemon-skins/0658_greninja/shadow-tide-real-poses
          if-no-files-found: error
          retention-days: 14
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          root=test-evidence/visual/cobblemon-skins/0658_greninja/shadow-tide-real-poses
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root"; if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Evidence: add Shadow Tide Blockbench review'
          git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin HEAD:"${GITHUB_REF_NAME}"
