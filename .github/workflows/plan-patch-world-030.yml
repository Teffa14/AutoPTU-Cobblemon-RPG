name: Patch WORLD-030 plan entry

on:
  push:
    branches:
      - feat/world-030-cedar-service-yard

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/world-030-cedar-service-yard
          fetch-depth: 0
      - name: Patch canonical plan and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          if '| WORLD-030 |' not in text:
              anchor = '| WORLD-029 | LIVE/PARTIAL | Physical Ouros mailbox/final mail UI'
              start = text.index(anchor)
              end = text.index('\n', start) + 1
              line = ('| WORLD-030 | LIVE/PARTIAL | Normal Cedar spawn service yard — PR #453; normal server startup idempotently provisions a compact set of already-authoritative physical facilities near Overworld spawn: Cobblemon Healing Machine and PC plus namespaced recovery bed, Cedar Mart, item storage, crafting workstation, field camp, League desk, Ouros mailbox and Minecraft Lodestone. Existing non-air world blocks are preserved rather than overwritten. The graphical RPG evidence path now inspects this production-provisioned yard instead of constructing a synthetic showcase; all RPG/PTU authority remains in the existing server services and AutoPTU-Java. |\n')
              text = text[:end] + line + text[end:]
              path.write_text(text)
          PY
          git rm .github/workflows/plan-patch-world-030.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m 'docs: record WORLD-030 Cedar service yard'
          git push origin HEAD:feat/world-030-cedar-service-yard
