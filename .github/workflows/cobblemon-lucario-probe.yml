name: Probe Official Lucario Assets

on:
  push:
    branches:
      - 'feat/lucario-aura-sentinel-epic'
    paths:
      - '.github/workflows/cobblemon-lucario-probe.yml'

permissions:
  contents: write

env:
  COBBLEMON_VERSION_ID: kF7CvxTo

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact official Cobblemon 1.7.3 Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .probe docs/cobblemon-skins/0448_lucario
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/lucario-probe' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .probe/version.json
          python - <<'PY' > .probe/download.env
          import json, shlex
          data=json.load(open('.probe/version.json',encoding='utf-8'))
          assert data['id']=='kF7CvxTo'
          assert data['version_number']=='1.7.3'
          assert data['game_versions']==['1.21.1']
          primary=next(f for f in data['files'] if f.get('primary'))
          assert primary['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL='+shlex.quote(primary['url']))
          print('SHA512='+shlex.quote(primary['hashes']['sha512']))
          PY
          source .probe/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .probe/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.probe/cobblemon.jar' | sha512sum --check --strict
      - name: Inspect Lucario model texture poser resolver animations and forms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          jar=Path('.probe/cobblemon.jar')
          out=Path('docs/cobblemon-skins/0448_lucario/source-probe.txt')
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              wanted=[n for n in names if '0448_lucario' in n.lower() or '/lucario' in n.lower()]
              lines=['Cobblemon 1.7.3 / Minecraft 1.21.1 official Lucario source probe','version id: kF7CvxTo','']
              for n in sorted(wanted):
                  data=z.read(n)
                  lines.append(f'{hashlib.sha256(data).hexdigest()}  {n}')
                  if n.endswith('.json'):
                      try:
                          obj=json.loads(data)
                          lines.append(json.dumps(obj, separators=(',',':'))[:12000])
                      except Exception:
                          pass
                  lines.append('')
              out.write_text('\n'.join(lines),encoding='utf-8')
              assert wanted, 'No Lucario assets found in official JAR'
          PY
      - name: Commit source probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cobblemon-skins/0448_lucario/source-probe.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Probe: record exact Cobblemon Lucario assets'
          git push origin HEAD:"${GITHUB_REF_NAME}"
