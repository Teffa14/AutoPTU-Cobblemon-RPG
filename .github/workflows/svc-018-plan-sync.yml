name: SVC-018 Plan Sync

on:
  push:
    branches:
      - rpg/svc-018-shrine-world-projection
    paths:
      - .github/workflows/svc-018-plan-sync.yml

permissions:
  contents: write

jobs:
  sync-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpg/svc-018-shrine-world-projection
      - name: Update canonical Minecraft RPG plan
        shell: python
        run: |
          from pathlib import Path

          path = Path("MINECRAFT_RPG_TOOLING_PLAN.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "| BUI-011 | TODO | Faint/KO presentation. |": "| BUI-011 | BLOCKED | Faint/KO presentation waits for an explicit authoritative semantic faint/KO contract from AutoPTU-Java. Minecraft must not infer faint from HP, entity removal, legal-choice count or playback state. |",
              "| BUI-012 | TODO | Winner/loser/result screen. |": "| BUI-012 | BLOCKED | Winner/loser/result screen waits for an explicit authoritative terminal battle result contract. Minecraft must not infer winner/loser from HP, missing actors, zero legal choices or local playback state. |",
              "| BUI-013 | TODO | Post-battle result/reward screen. |": "| BUI-013 | BLOCKED | Post-battle result/reward screen waits for authoritative terminal outcome plus server-owned reward payload/commit handoff. Minecraft must not manufacture rewards or derive battle completion locally. |",
              "| WORLD-024 | LIVE/PARTIAL | Persistent world-event objects — PR #368 / merge `5d1910dfe25458da26fadfb2230e2b4ac5a5f165`; authenticated Trainers can activate an already-registered Ouros shrine through physical right-click or `/autoptu interact`, persisting world-scoped DORMANT -> ACTIVATED state exactly once through atomic revisioned storage. No PTU reward, progression, outcome or client truth is inferred; additional authored world-event object types remain follow-up work. |": "| WORLD-024 | LIVE/PARTIAL | Persistent world-event objects — PR #368 / merge `5d1910dfe25458da26fadfb2230e2b4ac5a5f165` persists world-scoped DORMANT -> ACTIVATED state exactly once. PR #417 / implementation head `44b3b3c62a5a699e572f6309ce9ad803f6250a78` now projects the durable activated shrine state back into the physical Respawn Anchor as a fully charged visible state on authorized interaction, idempotently and without PTU inference. Additional authored world-event object types remain follow-up work. |",
              "| SVC-018 | TODO | Persistent world-object mutation/idempotency. |": "| SVC-018 | LIVE/PARTIAL | Persistent world-object mutation/idempotency — PR #417 / implementation head `44b3b3c62a5a699e572f6309ce9ad803f6250a78`; the existing atomic revisioned world-event object aggregate is now consumed by Fabric to project ACTIVATED shrine state into the physical world idempotently. The projection reuses canonical persisted state, ignores non-shrine blocks and creates no PTU legality, progression, reward or battle outcome. Additional authored mutation types remain follow-up work. |",
          }

          for old, new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"plan anchor missing; refusing unsafe rewrite: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit canonical plan and remove staging workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/svc-018-plan-sync.yml
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git diff --cached --check
          git commit -m "SVC-018 sync canonical Minecraft RPG plan"
          git push origin HEAD:rpg/svc-018-shrine-world-projection
