name: Ouros Grand Palace Gate

on:
  pull_request:
    paths:
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/OurosGrandPalace*.java'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/OurosSignatureBuildRuntime.java'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/AutoPtuCobblemonFabricAdapter.java'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/build/**'
      - 'tools/build-review/compile-surface-mesh.mjs'
      - '.github/workflows/ouros-grand-palace-gate.yml'
      - '.github/workflows/build-review-pages.yml'

jobs:
  exact-grand-palace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build production Fabric + Cobblemon mod set
        shell: bash
        run: |
          set -euo pipefail
          gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon

      - name: Export and audit exact Ouros Grand Palace
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/ouros-grand-palace-gate-server"
          output="$PWD/ouros-grand-palace-gate/ouros-grand-palace.blocks.json"
          mkdir -p "$server_dir/mods" "$(dirname "$output")"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.17.2/1.0.3/server/jar'

          server_pid=""
          stop_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
          }
          trap stop_server EXIT

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.ourosGrandPalaceManifestOutput="$output" \
              -Xms768M -Xmx3G -jar fabric-server-launch.jar nogui > ../ouros-grand-palace-gate.log 2>&1
          ) &
          server_pid=$!

          ready=0
          for _ in $(seq 1 360); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU Ouros Grand Palace capture envelope audit passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Ouros Grand Palace floating component audit passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU exact Ouros Grand Palace manifest export passed' "$latest" 2>/dev/null \
              && [ -s "$output" ]; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat ouros-grand-palace-gate.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          grep 'AutoPTU Ouros Grand Palace capture envelope audit passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU Ouros Grand Palace floating component audit passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU exact Ouros Grand Palace manifest export passed' "$server_dir/logs/latest.log"

          python3 - <<'PY' "$output"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['buildId'] == 'ouros_grand_palace'
          assert data['geometryAuthority'] == 'live_server_final_blockstate_scan'
          assert data['captureEnvelopeAudit'] == 'passed'
          assert data['floatingComponentAudit'] == 'passed'
          assert data['blockCount'] == len(data['blocks'])
          assert len(data['geometrySha256']) == 64
          assert data['size'] == [109, 77, 139], data['size']
          assert len(data['authoredSpaces']) == 19, len(data['authoredSpaces'])
          assert data['blockCount'] > 50000, data['blockCount']
          assert len(data['palette']) > 60, len(data['palette'])

          # Reference-room density gate. A named room may not pass merely because walls/floor exist.
          # Measure occupied interior volume, material variety, low furniture-zone content and
          # upper-wall/ceiling ornament separately for every authored review space.
          palette_ids = [entry['id'] for entry in data['palette']]
          blocks = [(b[0], b[1], b[2], palette_ids[b[3]]) for b in data['blocks']]
          room_reports = []
          for space in data['reviewSpaces']:
              minx, miny, minz = space['min']
              maxx, maxy, maxz = space['max']
              interior = [b for b in blocks
                          if minx + 1 <= b[0] <= maxx - 1
                          and miny + 1 <= b[1] <= maxy - 1
                          and minz + 1 <= b[2] <= maxz - 1]
              volume = max(1, (maxx - minx - 1) * (maxy - miny - 1) * (maxz - minz - 1))
              ratio = len(interior) / volume
              ids = {b[3] for b in interior}
              furniture = [b for b in interior
                           if minx + 3 <= b[0] <= maxx - 3
                           and minz + 3 <= b[2] <= maxz - 3
                           and miny + 1 <= b[1] <= min(miny + 5, maxy - 1)]
              upper = [b for b in interior if miny + 6 <= b[1] <= maxy - 1]
              room_height = maxy - miny
              min_ratio = 0.055 if room_height > 20 else 0.075
              assert ratio >= min_ratio, f"{space['name']} too sparse: {ratio:.3f} < {min_ratio:.3f}"
              assert len(ids) >= 10, f"{space['name']} lacks material/detail variety: {len(ids)} block ids"
              assert len(furniture) >= 30, f"{space['name']} furniture zone too empty: {len(furniture)} blocks"
              assert len(upper) >= 80, f"{space['name']} upper architecture too empty: {len(upper)} blocks"
              room_reports.append((space['name'], ratio, len(ids), len(furniture), len(upper)))

          for name, ratio, ids, furniture, upper in room_reports:
              print(f"ROOM DENSITY {name}: {ratio:.1%}, {ids} ids, {furniture} furniture-zone, {upper} upper-detail")

          print(
              'Ouros Grand Palace gate passed:',
              data['blockCount'], 'blocks,',
              len(data['palette']), 'states,',
              data['structuralComponentCount'], 'components,',
              data['geometrySha256']
          )
          PY
          stop_server

      - name: Compile and budget low-memory Palace review mesh
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/ouros-grand-palace-gate"
          input="$root/mesh-input"
          assets="$root/mesh-assets"
          mesh="$root/build-mesh"
          mkdir -p "$input/build-data" "$assets" "$mesh"
          cp "$root/ouros-grand-palace.blocks.json" "$input/build-data/ouros-grand-palace.blocks.json"

          cat > "$input/build-data/builds.json" <<'JSON'
          {"format":"ouros.build-review.registry.v1","builds":[{"id":"ouros_grand_palace","name":"Ouros Grand Palace","manifest":"build-data/ouros-grand-palace.blocks.json","layers":[{"id":"all","label":"All"}]}]}
          JSON

          atlas_sha='104ada7d63893dcfe08355d6d7c2f157ebbddc42'
          raw='https://raw.githubusercontent.com/misode/mcmeta'
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$raw/$atlas_sha/blocks/data.min.json" -o "$assets/atlas-map.json"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$raw/$atlas_sha/blocks/atlas.png" -o "$assets/atlas.png"

          node tools/build-review/compile-surface-mesh.mjs \
            "$input/build-data/builds.json" "$mesh" "$assets/atlas-map.json" "$assets/atlas.png"

          python3 - <<'PY' "$root/ouros-grand-palace.blocks.json" "$mesh/ouros_grand_palace.mesh.json" "$mesh"
          import json, pathlib, sys
          source = json.load(open(sys.argv[1], encoding='utf-8'))
          descriptor = json.load(open(sys.argv[2], encoding='utf-8'))
          mesh_root = pathlib.Path(sys.argv[3])
          assert descriptor['format'] == 'ouros.minecraft.surface-mesh.v1'
          assert descriptor['geometryAuthority'] == 'live_server_final_blockstate_scan'
          assert descriptor['sourceGeometrySha256'] == source['geometrySha256']
          assert descriptor['blockCount'] == source['blockCount']
          assert descriptor['size'] == source['size']
          assert descriptor['vertexFormat']['coordinates'] == 'capture_local'
          assert descriptor['renderMode'] == 'server_precomputed_surface_mesh'
          total = descriptor['opaque']['bytes'] + descriptor['translucent']['bytes']
          assert total < 48 * 1024 * 1024, f'Grand Palace browser mesh exceeds 48 MiB hard budget: {total}'
          for part in ('opaque', 'translucent'):
              p = mesh_root / pathlib.Path(descriptor[part]['url']).name
              assert p.is_file(), p
              assert p.stat().st_size == descriptor[part]['bytes']
          stats = descriptor['meshStats']
          print(
              'Grand Palace low-memory review mesh passed:',
              f"{total / 1024 / 1024:.2f} MiB,",
              f"{stats['visibleFaces']} visible faces,",
              f"{stats['culledInteriorBlocks']} fully interior blocks removed,",
              f"{stats['exposedBlocks']} source blocks represented on visible surfaces"
          )
          PY

      - name: Upload Grand Palace exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ouros-grand-palace-gate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ouros-grand-palace-gate/**
            ouros-grand-palace-gate.log
            ouros-grand-palace-gate-server/logs/latest.log
