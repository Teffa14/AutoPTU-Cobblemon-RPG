name: Generate Storm Courier From Official Cobblemon

on:
  push:
    branches:
      - feat/storm-courier-premium-accessories
    paths:
      - '.github/workflows/cobblemon-generate-storm-courier.yml'
      - 'tools/cobblemon-model-review/build_storm_courier.py'
      - 'tools/cobblemon-model-review/validate_original_model.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-storm-courier-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download verified official Cobblemon 1.7.3 Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .official-source
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/storm-courier-generator' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" \
            -o .official-source/version.json
          python - <<'PY' > .official-source/download.env
          import json, shlex
          data = json.load(open('.official-source/version.json', encoding='utf-8'))
          assert data['id'] == 'kF7CvxTo'
          assert data['version_number'] == '1.7.3'
          assert '1.21.1' in data['game_versions']
          assert 'fabric' in data['loaders']
          primary = next(f for f in data['files'] if f.get('primary'))
          assert primary['filename'] == 'Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL=' + shlex.quote(primary['url']))
          print('SHA512=' + shlex.quote(primary['hashes']['sha512']))
          PY
          source .official-source/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .official-source/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.official-source/cobblemon.jar' | sha512sum --check --strict

      - name: Extract exact male and female Pikachu geometry
        shell: bash
        run: |
          set -euo pipefail
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_male.geo.json' > .official-source/pikachu_male.geo.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_female.geo.json' > .official-source/pikachu_female.geo.json
          test "$(sha256sum .official-source/pikachu_male.geo.json | awk '{print $1}')" = 'f8ea21f6821d49e8a358f05d43562312a0e018e883f1354aa1445d2a0b432c83'
          test "$(sha256sum .official-source/pikachu_female.geo.json | awk '{print $1}')" = 'd49ba9bce368fed677832685f57a0ca3e7a00a6014639f1e79dbb0b749ed4318'

      - name: Generate production cosmetic assets
        shell: bash
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/build_storm_courier.py \
            --male .official-source/pikachu_male.geo.json \
            --female .official-source/pikachu_female.geo.json \
            --male-out fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json \
            --female-out fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json \
            --overlay-out fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png

      - name: Prove original models are untouched and extras are exact
        shell: bash
        run: |
          set -euo pipefail
          male='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json'
          female='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json'
          python tools/cobblemon-model-review/validate_original_model.py --official .official-source/pikachu_male.geo.json --candidate "$male"
          python tools/cobblemon-model-review/validate_original_model.py --official .official-source/pikachu_female.geo.json --candidate "$female"
          python - <<'PY'
          import json
          from pathlib import Path
          expected = [
              'ouros_storm_goggles',
              'ouros_storm_harness',
              'ouros_storm_pack',
              'ouros_storm_tail_clamp',
          ]
          for path in (
              Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json'),
              Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json'),
          ):
              bones = json.loads(path.read_text(encoding='utf-8'))['minecraft:geometry'][0]['bones']
              assert len(bones) == 94, (path, len(bones))
              assert [bone['name'] for bone in bones[90:]] == expected, path
          PY

      - name: Validate accessory-only UV layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          data = json.loads(Path('.official-source/pikachu_male.geo.json').read_text(encoding='utf-8'))['minecraft:geometry'][0]
          width = data['description']['texture_width']
          height = data['description']['texture_height']
          assert (width, height) == (128, 64)

          used = set()
          def mark(x, y, w, h):
              x0, x1 = sorted((int(x), int(x + w)))
              y0, y1 = sorted((int(y), int(y + h)))
              for yy in range(max(0, y0), min(height, y1)):
                  for xx in range(max(0, x0), min(width, x1)):
                      used.add((xx, yy))

          for bone in data['bones']:
              for item in bone.get('cubes', []):
                  dx, dy, dz = item.get('size', [0, 0, 0])
                  uv = item.get('uv', [0, 0])
                  if isinstance(uv, list):
                      u, v = uv
                      for rect in (
                          (u + dz, v, dx, dz),
                          (u + dz + dx, v, dx, dz),
                          (u, v + dz, dz, dy),
                          (u + dz, v + dz, dx, dy),
                          (u + dz + dx, v + dz, dz, dy),
                          (u + 2 * dz + dx, v + dz, dx, dy),
                      ):
                          mark(*rect)
                  else:
                      for face in uv.values():
                          if isinstance(face, dict):
                              point = face.get('uv', [0, 0])
                              extent = face.get('uv_size', [1, 1])
                              mark(point[0], point[1], extent[0], extent[1])

          assert all((x, 63) not in used for x in range(8)), 'reserved accessory texels overlap original UVs'
          overlay_path = Path('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png')
          overlay = Image.open(overlay_path).convert('RGBA')
          assert overlay.size == (128, 64)
          opaque = {(x, y) for y in range(64) for x in range(128) if overlay.getpixel((x, y))[3] > 0}
          assert opaque == {(x, 63) for x in range(8)}, opaque
          print('Accessory UV reservation verified:', sorted(opaque))
          PY

      - name: Commit generated production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json \
            fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png
          if git diff --cached --quiet; then
            echo 'Generated assets already current.'
            exit 0
          fi
          git commit -m 'RPG: generate premium Storm Courier from official Cobblemon 1.7.3 models'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
