name: WORLD-013 Plan Self Patch

on:
  push:
    paths:
      - '.github/workflows/plan-world-013-pr504-selfpatch.yml'

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record shipped WORLD-013 slices and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          s = p.read_text(encoding='utf-8')
          old = "PR #497 / merge `766e90024d561e82c11d3be77eb02f4659f7f0e8` adds deterministic CALM roaming inside the authored leash plus bounded separation from the nearest active canonical sibling in the same population, including deterministic exact-overlap recovery without external RNG. All four populations reuse only the same already-approved complete PTU profile; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists. Movement-only invisible encounters remain prohibited."
          new = "PR #497 / merge `766e90024d561e82c11d3be77eb02f4659f7f0e8` adds deterministic CALM roaming inside the authored leash plus bounded separation from the nearest active canonical sibling in the same population, including deterministic exact-overlap recovery without external RNG. PR #499 / merge `5f36e40be56fd3d30b310b0c20823768e11635a7` adds bounded same-population CALM cohesion plus deterministic 60-tick movement / 20-tick rest cadence while preserving WATCHING, ALARMED and RECOVERING priority. PR #500 / merge `92b147b9f601b4320e47e563e06550a71c1dfc5e` adds `ouros.marea.loma_windbreak` to durable server-authoritative location discovery and requires every current Marea WILD population site to have matching persistent discovery identity, dimension and radius. PR #504 / merge `cd47bc79458393b76932c76b5887af48da2cec2c` makes low-speed CALM roaming probe Minecraft collision geometry and choose deterministic leash-safe detours, stopping rather than pushing through geometry when no safe detour exists. All four populations reuse only the same already-approved complete PTU profile; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists. Movement-only invisible encounters remain prohibited."
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one WORLD-013 anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/plan-world-013-pr504-selfpatch.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/plan-world-013-pr504-selfpatch.yml
          git commit -m 'plan: record WORLD-013 PRs 499 500 and 504'
          git push origin HEAD:main
