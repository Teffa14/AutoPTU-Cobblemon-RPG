name: Inspect Official Greninja Runtime Routing
on:
  push:
    branches: ['feat/greninja-shadow-tide']
    paths: ['.github/workflows/cobblemon-inspect-greninja-runtime.yml']
  workflow_dispatch:
permissions: {contents: write}
env: {COBBLEMON_VERSION_ID: kF7CvxTo}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact official JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime docs/cobblemon-skins/0658_greninja
          curl --fail --silent --show-error --location -A 'Ouros-Greninja-Runtime' "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .runtime/version.json
          python - <<'PY' > .runtime/env
          import json,shlex
          d=json.load(open('.runtime/version.json')); p=next(f for f in d['files'] if f.get('primary')); assert d['id']=='kF7CvxTo' and p['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'; print('URL='+shlex.quote(p['url']));print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .runtime/env; curl --fail --silent --show-error --location "$URL" -o .runtime/cobblemon.jar; printf '%s  %s\n' "$SHA512" .runtime/cobblemon.jar | sha512sum --check --strict
      - name: Extract Battle Bond data and decompile public class structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -p .runtime/cobblemon.jar 'data/cobblemon/species_feature_assignments/greninja_battle_bond.json' > .runtime/battle-bond.json
          unzip -p .runtime/cobblemon.jar 'data/cobblemon/species/generation6/greninja.json' > .runtime/species.json
          mkdir -p .runtime/classes
          (cd .runtime/classes && jar xf ../cobblemon.jar 'com/cobblemon/mod/common/client/render/models/blockbench/pokemon/gen6/GreninjaModel.class')
          javap -classpath .runtime/cobblemon.jar -c -p com.cobblemon.mod.common.client.render.models.blockbench.pokemon.gen6.GreninjaModel > .runtime/GreninjaModel.javap.txt
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          assignment=json.loads(Path('.runtime/battle-bond.json').read_text()); species=json.loads(Path('.runtime/species.json').read_text()); javap=Path('.runtime/GreninjaModel.javap.txt').read_text(errors='replace')
          strings=sorted(set(re.findall(r'// String ([^\r\n]+)',javap)))
          interesting=[s for s in strings if any(k in s.lower() for k in ['ash','bond','tongue','greninja','shuriken'])]
          out={'battleBondAssignment':assignment,'species':species,'classSha256':hashlib.sha256(Path('.runtime/classes/com/cobblemon/mod/common/client/render/models/blockbench/pokemon/gen6/GreninjaModel.class').read_bytes()).hexdigest(),'javapInterestingStrings':interesting,'javapText':javap}
          Path('docs/cobblemon-skins/0658_greninja/official-runtime-routing.json').write_text(json.dumps(out,indent=2)+'\n')
          print('assignment',json.dumps(assignment)); print('interesting strings',interesting)
          PY
      - name: Commit runtime routing evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/cobblemon-skins/0658_greninja/official-runtime-routing.json
          git commit -m 'Evidence: record Greninja Battle Bond routing' || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin HEAD:"${GITHUB_REF_NAME}"
