name: One-shot WORLD-013 record 536

on:
  push:
    paths:
      - '.github/workflows/one-shot-world013-record-536.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record shipped global route recovery and continuity
        shell: python
        run: |
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = p.read_text()
          old = 'New ecology work must continue removing behavior responsibility from `MareaWild*` runtimes: next globalize route recovery/continuity and reciprocal-yield intent handling.'
          new = 'PR #536 / merge `7e7f9bf73eacd23499ba3f267ffae6838e059603` globalizes stalled-route recovery and native-route continuity through `WildCalmNavigationRecoveryRuntime` and `WildCalmNavigationContinuityRuntime`; every population published through the global ecology registry now uses its own `WildBehaviorProfile` cadence, player guard and stop distance while Minecraft geometry remains presentation-only authority. New ecology work must continue removing behavior responsibility from `MareaWild*` runtimes: next globalize reciprocal-yield intent handling.'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one WORLD-013 tail marker, found {count}')
          p.write_text(text.replace(old, new, 1))
      - name: Commit canonical plan update and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-world013-record-536.yml
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m 'Record WORLD-013 global route continuity'
          git push origin HEAD:main
