name: One-shot WORLD-013 plan bookkeeping

on:
  push:
    branches:
      - world-013-plan-547

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-plan-547
      - name: Record shipped WORLD-013 slice
        shell: python
        run: |
          from pathlib import Path

          path = Path("MINECRAFT_RPG_TOOLING_PLAN.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          marker = "| WORLD-013 | NEXT/PARTIAL |"
          old_next = (
              "Next consolidate the remaining duplicated Marea population selector, world eligibility, projection schedule, "
              "blueprint/content eligibility and ambient behavior registration into one global ecology content descriptor, "
              "so another approved region contributes one server-authored source rather than parallel registry entries. "
          )
          replacement = (
              "PR #547 / merge `530ce8ef20d1c4ad47d388209a81b32a6b27c731` consolidates population selection, Minecraft-world eligibility, "
              "temporal projection schedules, canonical blueprint/content eligibility and ambient `WildBehaviorProfile` into "
              "one `WildEcologyDescriptorRegistry` source; normal production Marea content now registers that descriptor once, "
              "while the existing population/projection registries are compatibility views over the same authority. "
              "Next migrate `WildPopulationRuntime` and `WildEcologyProjectionSource` to consume `WildEcologyDescriptorRegistry` "
              "directly, then remove the parallel compatibility registries from the production dependency path once their remaining "
              "fixture/test callers are isolated. "
          )
          matches = [i for i, line in enumerate(lines) if line.startswith(marker)]
          if len(matches) != 1:
              raise SystemExit(f"expected one WORLD-013 row, found {len(matches)}")
          index = matches[0]
          if old_next not in lines[index]:
              raise SystemExit("WORLD-013 expected NEXT text not found; refusing broad edit")
          lines[index] = lines[index].replace(old_next, replacement, 1)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Remove one-shot workflow and commit exact plan edit
        run: |
          rm .github/workflows/one-shot-world-013-plan-547.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/one-shot-world-013-plan-547.yml
          git diff --cached --check
          git commit -m "Record WORLD-013 PR #547"
          git push origin HEAD:world-013-plan-547
