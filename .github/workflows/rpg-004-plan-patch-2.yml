name: RPG-004 Plan Patch 2

on:
  push:
    branches:
      - chore/rpg-004-plan

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rpg-004-plan
          fetch-depth: 0
      - name: Patch remaining canonical plan references exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = p.read_text()
          replacements = {
              '| SVC-017 | TODO | Quest reward commit/idempotency. |': '| SVC-017 | LIVE/PARTIAL | Quest reward commit/idempotency — PR #381 / merge `0fee2332ab31bd87ace2627d0594bcc9e3dc45ca` uses a deterministic per-player/per-quest wallet transaction identity so retries and restart replay return the existing committed credit instead of granting twice. Item/XP and multi-store reward transactions remain follow-up work. |',
              '| LIVE/PARTIAL | Quest journal/objectives/reward claims. PR #258 / implementation head `a60a4084660a87e5315e754d08684c834b7921a8` persists owner-scoped accepted quest identity/state/revision and proves the entry across a real dedicated-server restart. PR #259 / implementation head `40b4a2de256b5822d044a91f4c44cb8a92924bd8` exposes that same durable journal through owner-scoped fallback reads without creating objective or reward state. PR #260 / implementation head `d2d554d67c418881280df02f7ed848bc53b23220` adds one durable tracked-quest pointer, schema-v1 migration compatibility and revisioned idempotent switching. Objective progress and reward claims remain TODO under RPG-003/RPG-004. |': '| LIVE/PARTIAL | Quest journal/objectives/reward claims. PR #258 / implementation head `a60a4084660a87e5315e754d08684c834b7921a8` persists owner-scoped accepted quest identity/state/revision and proves the entry across a real dedicated-server restart. PR #259 / implementation head `40b4a2de256b5822d044a91f4c44cb8a92924bd8` exposes that same durable journal through owner-scoped fallback reads. PR #260 / implementation head `d2d554d67c418881280df02f7ed848bc53b23220` adds one durable tracked-quest pointer. PR #380 / merge `69d752d06941cf49250e34f6385df90110515789` adds durable owner-scoped objective progress from server-observed events. PR #381 / merge `0fee2332ab31bd87ace2627d0594bcc9e3dc45ca` adds restart-safe exactly-once Cedar quest currency reward claims through canonical wallet receipts. Additional objective types and non-currency/multi-store rewards remain follow-up work. |',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one plan row for {old!r}, found {count}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          rm .github/workflows/rpg-004-plan-patch-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/rpg-004-plan-patch-2.yml
          git commit -m "docs: complete RPG-004 plan cross-references"
          git push origin HEAD:chore/rpg-004-plan
