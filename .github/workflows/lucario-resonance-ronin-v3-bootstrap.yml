name: Lucario Resonance Ronin V3 Bootstrap

on:
  pull_request:
    paths:
      - "tools/cobblemon-model-review/build_aura_sentinel_resonance_ronin_v3.py"
      - ".github/workflows/lucario-resonance-ronin-v3-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prove same-species reference gate before production generation
        run: |
          python tools/cobblemon-model-review/validate_species_reference_dossier.py \
            docs/cobblemon-skin-reference-dossiers/0448_lucario.json \
            --expected-species lucario
      - name: Generate exact V3 production bytes and patch manifest hashes
        run: |
          python tools/cobblemon-model-review/build_aura_sentinel_resonance_ronin_v3.py --bootstrap
      - name: Commit generated V3 production outputs to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0448_lucario/90_ouros_aura_sentinel.json \
            fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0448_lucario/ouros_aura_sentinel_accessories.png \
            docs/cobblemon-skin-review-manifests/0448_lucario.json
          if git diff --cached --quiet; then
            echo "V3 outputs already committed"
            exit 0
          fi
          git commit -m "Lucario: materialize Resonance Ronin V3 production"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
