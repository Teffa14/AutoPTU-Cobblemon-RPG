name: One-shot WORLD-013 plan 541
on:
  push:
    paths:
      - .github/workflows/one-shot-world-013-plan-541.yml
permissions:
  contents: write
jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record shipped slice and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          old = "New ecology work must continue removing region-owned policy algorithms: next extract the Marea migration/projected-site schedule into reusable data-driven population projection profiles consumed by the global registry, leaving region modules as authored data rather than lifecycle logic."
          new = "PR #541 / merge `a3656452095bceda6752a476f8fa3466c7ca6b04` replaces the Marea-owned migration algorithm with reusable `WildPopulationProjectionProfile` schedules and composes those authored profiles through `WildPopulationContentRegistry`; ecology projection and the retained migration compatibility fixture now consume the same registered server-owned projection resolver. New ecology work must continue removing region-owned policy algorithms: next move the authored Marea projection profile data into a dedicated content source and remove the remaining `MareaWildMigrationProjection` compatibility class so adding another route requires only registered profile data."
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one WORLD-013 next marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one-shot-world-013-plan-541.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/one-shot-world-013-plan-541.yml
          git commit -m "Record WORLD-013 projection profiles"
          git push origin HEAD:main
