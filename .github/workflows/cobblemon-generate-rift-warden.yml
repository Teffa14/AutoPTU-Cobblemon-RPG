name: Generate Rift Warden From Official Cobblemon

on:
  push:
    branches:
      - 'feat/gengar-rift-warden-epic'
    paths:
      - '.github/workflows/cobblemon-generate-rift-warden.yml'
      - 'tools/cobblemon-model-review/build_rift_warden_gengar.py'
      - 'tools/cobblemon-model-review/validate_original_model.py'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0094_gengar/90_ouros_rift_warden.json'
      - 'fabric-adapter/src/main/resources/data/cobblemon/species_features/ouros_rift_warden.json'
      - 'fabric-adapter/src/main/resources/data/cobblemon/species_feature_assignments/ouros_gengar_cosmetics.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-rift-warden-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download verified official Cobblemon 1.7.3 Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .official-source
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/rift-warden-generator' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .official-source/version.json
          python - <<'PY' > .official-source/download.env
          import json,shlex
          data=json.load(open('.official-source/version.json',encoding='utf-8'))
          assert data['id']=='kF7CvxTo' and data['version_number']=='1.7.3'
          assert data['game_versions']==['1.21.1'] and 'fabric' in data['loaders']
          primary=next(f for f in data['files'] if f.get('primary'))
          assert primary['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL='+shlex.quote(primary['url']))
          print('SHA512='+shlex.quote(primary['hashes']['sha512']))
          PY
          source .official-source/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .official-source/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.official-source/cobblemon.jar' | sha512sum --check --strict
      - name: Extract and pin exact official Gengar assets
        shell: bash
        run: |
          set -euo pipefail
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0094_gengar/gengar.geo.json' > .official-source/gengar.geo.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0094_gengar/gengar.animation.json' > .official-source/gengar.animation.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/resolvers/0094_gengar/0_gengar_base.json' > .official-source/gengar.resolver.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0094_gengar/gengar.png' > .official-source/gengar.png
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0094_gengar/gengar_emissives.png' > .official-source/gengar_emissives.png
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0094_gengar/gengar_shiny.png' > .official-source/gengar_shiny.png
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0094_gengar/gengar_shiny_emissives.png' > .official-source/gengar_shiny_emissives.png
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0094_gengar/gengar_pokemopolis.png' > .official-source/gengar_pokemopolis.png
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0094_gengar/license' > .official-source/model-license.txt
          test "$(sha256sum .official-source/gengar.geo.json | awk '{print $1}')" = '57449f9653a403a783efdffa3195eb6948aceb855411f4e77caaa9c29175ad38'
          test "$(sha256sum .official-source/gengar.animation.json | awk '{print $1}')" = '68a8bf920086c6dc368a8ffb5c449aedb314aab03a2df7bdde10bd61ea0cdb9f'
          test "$(sha256sum .official-source/gengar.resolver.json | awk '{print $1}')" = 'aeecefe6571d99bc9ab38a3b22af5e34769b346ed9858335292c82209ee95afc'
          test "$(sha256sum .official-source/gengar.png | awk '{print $1}')" = '7aba3220a0007d5ac3f36bc51611e485a3bedf330319fa474b907fc5b3f77b65'
          test "$(sha256sum .official-source/gengar_emissives.png | awk '{print $1}')" = 'c1b53aac2c0c48c417bade392198a65cb79fa76b78ad17907b3a10a6ce944d87'
          test "$(sha256sum .official-source/gengar_shiny.png | awk '{print $1}')" = '1a0821422f8bfbe43a02132c658e48213e6adedbc1b5854f125683951deaeb21'
          test "$(sha256sum .official-source/gengar_shiny_emissives.png | awk '{print $1}')" = '835b1ee1221ce476655cccb366d9143952555604c37824bf0be03a28b55695c8'
          test "$(sha256sum .official-source/gengar_pokemopolis.png | awk '{print $1}')" = '715f050dcb0daf3ef3fecb6ecc9d8bd878861c903bcb4d6e7b1d93ceb6732463'
          test "$(sha256sum .official-source/model-license.txt | awk '{print $1}')" = 'fb8e971d1895863ec9fc5f3cfc526c64af980bd6c93d0a1615c7969df46a6660'
      - name: Generate production cosmetic assets
        shell: bash
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/build_rift_warden_gengar.py \
            --official .official-source/gengar.geo.json \
            --model-out fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0094_gengar/ouros_rift_warden_gengar.geo.json \
            --overlay-out fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0094_gengar/ouros_rift_warden_accessories.png \
            --metadata-out docs/cobblemon-skins/0094_gengar/rift-warden-build-metadata.json
      - name: Prove original model is untouched and extras are exact
        shell: bash
        run: |
          set -euo pipefail
          model='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0094_gengar/ouros_rift_warden_gengar.geo.json'
          python tools/cobblemon-model-review/validate_original_model.py --official .official-source/gengar.geo.json --candidate "$model"
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path('docs/cobblemon-skins/0094_gengar/rift-warden-build-metadata.json').read_text())
          model=json.loads(Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0094_gengar/ouros_rift_warden_gengar.geo.json').read_text())['minecraft:geometry'][0]
          official=json.loads(Path('.official-source/gengar.geo.json').read_text())['minecraft:geometry'][0]
          expected=['ouros_rift_halo','ouros_rift_collar','ouros_rift_shroud_left','ouros_rift_shroud_right','ouros_rift_back_pylons','ouros_rift_wrist_left','ouros_rift_wrist_right','ouros_rift_shadow_mantle']
          n=len(official['bones'])
          assert n==78
          assert meta['originalBoneCount']==78 and meta['derivedBoneCount']==86
          assert len(model['bones'])==86
          assert [b['name'] for b in model['bones'][n:]]==expected
          assert meta['cosmeticBones']==expected
          assert meta['cosmeticCubeCount']>=40
          print('official bones',n,'derived bones',len(model['bones']),'cosmetic cubes',meta['cosmeticCubeCount'])
          PY
      - name: Validate accessory-only UV layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          from PIL import Image
          spec=importlib.util.spec_from_file_location('rift_builder','tools/cobblemon-model-review/build_rift_warden_gengar.py')
          module=importlib.util.module_from_spec(spec); assert spec.loader; spec.loader.exec_module(module)
          official=json.loads(Path('.official-source/gengar.geo.json').read_text())['minecraft:geometry'][0]
          meta=json.loads(Path('docs/cobblemon-skins/0094_gengar/rift-warden-build-metadata.json').read_text())
          reserved={tuple(v) for v in meta['palettePixels'].values()}
          used=module.mark_uv_usage(official)
          assert reserved.isdisjoint(used), reserved & used
          overlay=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0094_gengar/ouros_rift_warden_accessories.png').convert('RGBA')
          assert overlay.size==(128,128)
          opaque={(x,y) for y in range(overlay.height) for x in range(overlay.width) if overlay.getpixel((x,y))[3]>0}
          assert opaque==reserved
          print('reserved UV-free palette texels',sorted(reserved))
          PY
      - name: Validate resolver and official variant contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('.official-source/gengar.resolver.json').read_text())
          assert base['species']=='cobblemon:gengar'
          assert base['variations'][0]['poser']=='cobblemon:gengar'
          assert base['variations'][0]['model']=='cobblemon:gengar.geo'
          assert any(v.get('aspects')==['shiny'] for v in base['variations'])
          assert any(v.get('aspects')==['color-green'] for v in base['variations'])
          r=json.loads(Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0094_gengar/90_ouros_rift_warden.json').read_text())
          assert r['species']=='cobblemon:gengar' and r['order']==90
          assert len(r['variations'])==3
          for v in r['variations']:
              assert v['poser']=='cobblemon:gengar'
              assert v['model']=='cobblemon:ouros_rift_warden_gengar.geo'
              assert any(layer.get('name')=='ouros_rift_warden' for layer in v['layers'])
          normal,shiny,green=r['variations']
          assert normal['aspects']==['ouros_rift_warden']
          assert normal['texture']=='cobblemon:textures/pokemon/0094_gengar/gengar.png'
          assert normal['layers'][0]['texture']=='cobblemon:textures/pokemon/0094_gengar/gengar_emissives.png'
          assert shiny['aspects']==['ouros_rift_warden','shiny']
          assert shiny['texture']=='cobblemon:textures/pokemon/0094_gengar/gengar_shiny.png'
          assert shiny['layers'][0]['texture']=='cobblemon:textures/pokemon/0094_gengar/gengar_shiny_emissives.png'
          assert green['aspects']==['ouros_rift_warden','color-green']
          assert any(layer.get('name')=='pokemopolis' and layer['texture'].endswith('gengar_pokemopolis.png') for layer in green['layers'])
          animations=json.loads(Path('.official-source/gengar.animation.json').read_text())['animations']
          assert set(animations)=={'animation.gengar.air_fly','animation.gengar.air_idle','animation.gengar.blink','animation.gengar.cry','animation.gengar.ground_idle'}
          PY
      - name: Persist exact model license provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/cobblemon-skins/0094_gengar
          cp .official-source/model-license.txt docs/cobblemon-skins/0094_gengar/official-model-license.txt
      - name: Commit generated production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0094_gengar/ouros_rift_warden_gengar.geo.json \
            fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0094_gengar/ouros_rift_warden_accessories.png \
            docs/cobblemon-skins/0094_gengar/rift-warden-build-metadata.json \
            docs/cobblemon-skins/0094_gengar/official-model-license.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RPG: generate Rift Warden from official Cobblemon Gengar'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
