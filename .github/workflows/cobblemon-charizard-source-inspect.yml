name: Charizard Official Source Inspect

on:
  push:
    branches:
      - 'skin/charizard-solar-legion'
    paths:
      - '.github/workflows/cobblemon-charizard-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect latest compatible release and exact Charizard assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .inspect
          mkdir -p .inspect docs/cobblemon-skins/0006_charizard
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/source-inspect' \
            'https://api.modrinth.com/v2/project/cobblemon/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D' \
            -o .inspect/versions.json
          python - <<'PY' > .inspect/source.env
          import json, shlex
          versions=json.load(open('.inspect/versions.json',encoding='utf-8'))
          releases=[v for v in versions if v.get('version_type')=='release']
          releases.sort(key=lambda v:v['date_published'], reverse=True)
          assert releases, 'No stable Fabric release for Minecraft 1.21.1'
          latest=releases[0]
          primary=next(f for f in latest['files'] if f.get('primary'))
          print('VERSION_ID='+shlex.quote(latest['id']))
          print('VERSION_NUMBER='+shlex.quote(latest['version_number']))
          print('FILE_NAME='+shlex.quote(primary['filename']))
          print('URL='+shlex.quote(primary['url']))
          print('SHA512='+shlex.quote(primary['hashes']['sha512']))
          PY
          source .inspect/source.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .inspect/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.inspect/cobblemon.jar' | sha512sum --check --strict
          python - <<'PY'
          import hashlib,json,zipfile,os
          from pathlib import Path
          jar=Path('.inspect/cobblemon.jar')
          source={}
          for line in Path('.inspect/source.env').read_text().splitlines():
              k,v=line.split('=',1); source[k]=v.strip("'")
          prefix='assets/cobblemon/'
          species='0006_charizard'
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              candidates=[n for n in names if species in n]
              model_paths=[n for n in candidates if '/models/' in n and n.endswith('.geo.json')]
              animation_paths=[n for n in candidates if '/animations/' in n and n.endswith('.animation.json')]
              poser_paths=[n for n in candidates if '/posers/' in n and n.endswith('.json')]
              resolver_paths=[n for n in candidates if '/resolvers/' in n and n.endswith('.json')]
              texture_paths=[n for n in candidates if '/textures/' in n and n.endswith('.png')]
              assert model_paths, candidates
              def read_json(p): return json.loads(z.read(p))
              def sha(p): return hashlib.sha256(z.read(p)).hexdigest()
              models=[]
              for p in model_paths:
                  data=read_json(p)
                  geom=data['minecraft:geometry'][0]
                  bones=geom.get('bones',[])
                  models.append({'path':p,'sha256':sha(p),'identifier':geom['description']['identifier'],'texture_width':geom['description'].get('texture_width'),'texture_height':geom['description'].get('texture_height'),'bone_count':len(bones),'bones':[{'name':b['name'],'parent':b.get('parent'),'pivot':b.get('pivot')} for b in bones]})
              animations=[]
              for p in animation_paths:
                  d=read_json(p)
                  animations.append({'path':p,'sha256':sha(p),'names':sorted(d.get('animations',{}).keys())})
              posers=[{'path':p,'sha256':sha(p),'json':read_json(p)} for p in poser_paths]
              resolvers=[{'path':p,'sha256':sha(p),'json':read_json(p)} for p in resolver_paths]
              textures=[{'path':p,'sha256':sha(p)} for p in texture_paths]
              license_paths=[n for n in names if n.endswith('/LICENSE') or n.endswith('/LICENSE.txt') or 'license' in n.lower() and species in n]
              report={'latest_compatible_release':source,'models':models,'animations':animations,'posers':posers,'resolvers':resolvers,'textures':textures,'species_related_files':candidates,'license_candidates':license_paths}
              Path('docs/cobblemon-skins/0006_charizard/official-source-inspection.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Commit source inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cobblemon-skins/0006_charizard/official-source-inspection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Evidence: inspect official Charizard source assets'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
