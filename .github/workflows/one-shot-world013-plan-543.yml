name: One-shot WORLD-013 plan record

on:
  push:
    branches:
      - world-013-plan-record-543
    paths:
      - .github/workflows/one-shot-world013-plan-543.yml

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-plan-record-543
          fetch-depth: 0
      - name: Update canonical WORLD-013 row exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          marker = '| WORLD-013 | NEXT/PARTIAL |'
          old = "PR #541 / merge `a3656452095bceda6752a476f8fa3466c7ca6b04` replaces the Marea-owned migration algorithm with reusable `WildPopulationProjectionProfile` schedules and composes those authored profiles through `WildPopulationContentRegistry`; ecology projection and the retained migration compatibility fixture now consume the same registered server-owned projection resolver. New ecology work must continue removing region-owned policy algorithms: next move the authored Marea projection profile data into a dedicated content source and remove the remaining `MareaWildMigrationProjection` compatibility class so adding another route requires only registered profile data."
          new = "PR #541 / merge `a3656452095bceda6752a476f8fa3466c7ca6b04` replaces the Marea-owned migration algorithm with reusable `WildPopulationProjectionProfile` schedules and composes those authored profiles through `WildPopulationContentRegistry`; ecology projection and the retained migration compatibility fixture now consume the same registered server-owned projection resolver. PR #542 / merge `75c717b8853ab1f753a39934721545248b94c136` moves the authored lower-shelf Marea migration schedule into `MareaWildEcologyContent` as `WildPopulationProjectionProfile` data registered by `WildEcologyContentRuntime`, leaving no regional migration algorithm. PR #543 / merge `f7924e747dd5c126b6c822ad5add927c9c8d9fa8` centralizes current-site resolution in `WildPopulationContentRegistry.projectedSiteId(...)`, migrates the active ecology projection source and all remaining Marea presentation consumers onto that registered boundary, and removes `MareaWildMigrationProjection`. Next remove the remaining region-owned `ProjectedActor` assembly, presentation-anchor policy and `WildBehaviorProfile` authoring from `MareaWildEcologyProjectionSource` by registering those projection inputs through the global ecology content boundary, so another region requires content registration rather than another source class."
          if text.count(marker) != 1:
              raise SystemExit(f'expected one WORLD-013 row, found {text.count(marker)}')
          if text.count(old) != 1:
              raise SystemExit(f'expected one WORLD-013 tail, found {text.count(old)}')
          updated = text.replace(old, new, 1)
          if updated == text:
              raise SystemExit('WORLD-013 update produced no change')
          path.write_text(updated)
          PY
      - name: Remove one-shot helper
        run: rm .github/workflows/one-shot-world013-plan-543.yml
      - name: Commit canonical plan update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/one-shot-world013-plan-543.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/one-shot-world013-plan-543.yml MINECRAFT_RPG_TOOLING_PLAN.md "
          git commit -m 'Record WORLD-013 PRs 542 and 543'
          git push origin HEAD:world-013-plan-record-543
