name: Hitmonlee Cobra Dojo Full Transformation Review

on:
  push:
    branches:
      - 'art/hitmonlee-cobra-dojo-v1'
    paths:
      - '.github/workflows/cobblemon-hitmonlee-cobra-dojo-review.yml'
      - 'tools/cobblemon-model-review/build_cobra_dojo_hitmonlee.py'
      - 'tools/cobblemon-model-review/blockbench_capture.mjs'
      - 'tools/cobblemon-model-review/validate_original_model.py'
      - 'tools/cobblemon-model-review/validate_derived_texture.py'
      - 'docs/cobblemon-skins/0106_hitmonlee/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/ouros_cobra_dojo_hitmonlee.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0106_hitmonlee/90_ouros_cobra_dojo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0106_hitmonlee/ouros_cobra_dojo_hitmonlee*.png'
  pull_request:
    paths:
      - '.github/workflows/cobblemon-hitmonlee-cobra-dojo-review.yml'
      - 'tools/cobblemon-model-review/build_cobra_dojo_hitmonlee.py'
      - 'docs/cobblemon-skins/0106_hitmonlee/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/ouros_cobra_dojo_hitmonlee.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0106_hitmonlee/90_ouros_cobra_dojo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0106_hitmonlee/ouros_cobra_dojo_hitmonlee*.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hitmonlee-cobra-dojo-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  COBBLEMON_VERSION: '1.7.3'
  MINECRAFT_VERSION: '1.21.1'
  COBBLEMON_FILENAME: 'Cobblemon-fabric-1.7.3+1.21.1.jar'
  COBBLEMON_JAR_SHA256: 'f7c25955176badc444ad6211fc556514fedbdba776227f105fe899f8819d74e3'
  COBBLEMON_JAR_SHA512: '7b5376f5f48177db53790237b6fb25378806972b5d3b756151b4d8f2d3c27238d6b587b77da422bc1780bfd358b4702e74369fd82cef2a35301b4b68a2f13c2e'
  OFFICIAL_MODEL_SHA256: 'f92b067c781f9210dec305860bdb09141efad5c238396ac7988c4bbbed82840d'
  OFFICIAL_ANIMATION_SHA256: 'd9f2b9e3c01ace9773368584fd034b015276a085d6ccb8d5624967bb7d9e8b7c'
  OFFICIAL_RESOLVER_SHA256: '67b3432a004786b43f523b367a8f20dceba7353f4949dd3472ffcb8aa9036319'
  OFFICIAL_NORMAL_SHA256: 'cbf05271a594e788e7173fd3e34ee32b35488781dd97b7e100455fe57d919574'
  OFFICIAL_SHINY_SHA256: 'a677824d9be92b46ff6359ce58118e67fce1078632908cfc0ac80816e7c1c065'
  OFFICIAL_MODEL_LICENSE_SHA256: 'fb8e971d1895863ec9fc5f3cfc526c64af980bd6c93d0a1615c7969df46a6660'
  DERIVED_MODEL_SHA256: 'e938f5664fbc822646142c5c4e8201772920c89550020f64048a939f8fcaee9b'
  DERIVED_NORMAL_SHA256: '64d2ec2a641e57862b12259bc18d75dff9053cefdaaae1981f9d27b7ac2f6c99'
  DERIVED_SHINY_SHA256: 'b86cc4ec9abeda1edd4deed190fd8e187059c25d14c2a7608ca32fa51ff70ee9'
  BLOCKBENCH_VERSION: '5.1.6'
  BLOCKBENCH_SHA256: 'c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e'
  GAMEPLAY_RESOLUTION: '160'

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64

      - name: Download and verify exact official source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .review/official .review/generated .review/renders .review/output
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Hitmonlee-Review' "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .review/version.json
          python - <<'PY' > .review/download.env
          import json, os, shlex
          d=json.load(open('.review/version.json',encoding='utf-8'))
          assert d['id']==os.environ['COBBLEMON_VERSION_ID'] and d['version_number']==os.environ['COBBLEMON_VERSION']
          assert os.environ['MINECRAFT_VERSION'] in d['game_versions'] and 'fabric' in d['loaders']
          p=next(f for f in d['files'] if f.get('primary'))
          assert p['filename']==os.environ['COBBLEMON_FILENAME'] and p['hashes']['sha512']==os.environ['COBBLEMON_JAR_SHA512']
          print('PROJECT_ID='+shlex.quote(d['project_id'])); print('JAR_URL='+shlex.quote(p['url']))
          PY
          source .review/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Hitmonlee-Review' "https://api.modrinth.com/v2/project/${PROJECT_ID}/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D" -o .review/compatible.json
          python - <<'PY'
          import json, os
          stable=[v for v in json.load(open('.review/compatible.json',encoding='utf-8')) if v.get('version_type')=='release']
          latest=max(stable,key=lambda v:v['date_published'])
          assert latest['id']==os.environ['COBBLEMON_VERSION_ID'],(latest['id'],latest['version_number'])
          PY
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$JAR_URL" -o .review/cobblemon.jar
          printf '%s  %s\n' "$COBBLEMON_JAR_SHA256" '.review/cobblemon.jar' | sha256sum --check --strict
          printf '%s  %s\n' "$COBBLEMON_JAR_SHA512" '.review/cobblemon.jar' | sha512sum --check --strict
          python - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          src={
          'model':('assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/hitmonlee.geo.json','hitmonlee.geo.json','OFFICIAL_MODEL_SHA256'),
          'animation':('assets/cobblemon/bedrock/pokemon/animations/0106_hitmonlee/hitmonlee.animation.json','hitmonlee.animation.json','OFFICIAL_ANIMATION_SHA256'),
          'resolver':('assets/cobblemon/bedrock/pokemon/resolvers/0106_hitmonlee/0_hitmonlee_base.json','hitmonlee.resolver.json','OFFICIAL_RESOLVER_SHA256'),
          'normal':('assets/cobblemon/textures/pokemon/0106_hitmonlee/hitmonlee.png','hitmonlee.png','OFFICIAL_NORMAL_SHA256'),
          'shiny':('assets/cobblemon/textures/pokemon/0106_hitmonlee/hitmonlee_shiny.png','hitmonlee_shiny.png','OFFICIAL_SHINY_SHA256'),
          'license':('assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/license','hitmonlee-model-license.txt','OFFICIAL_MODEL_LICENSE_SHA256')}
          with zipfile.ZipFile('.review/cobblemon.jar') as z:
            for _,(member,target,key) in src.items():
              payload=z.read(member); actual=hashlib.sha256(payload).hexdigest(); assert actual==os.environ[key],(member,actual,os.environ[key]); Path('.review/official',target).write_bytes(payload)
          PY

      - name: Prove production assets are exact builder output
        shell: bash
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/build_cobra_dojo_hitmonlee.py --model .review/official/hitmonlee.geo.json --normal .review/official/hitmonlee.png --shiny .review/official/hitmonlee_shiny.png --output-root .review/generated
          model='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/ouros_cobra_dojo_hitmonlee.geo.json'
          normal='fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0106_hitmonlee/ouros_cobra_dojo_hitmonlee.png'
          shiny='fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0106_hitmonlee/ouros_cobra_dojo_hitmonlee_shiny.png'
          cmp .review/generated/ouros_cobra_dojo_hitmonlee.geo.json "$model"
          cmp .review/generated/ouros_cobra_dojo_hitmonlee.png "$normal"
          cmp .review/generated/ouros_cobra_dojo_hitmonlee_shiny.png "$shiny"
          printf '%s  %s\n' "$DERIVED_MODEL_SHA256" "$model" | sha256sum --check --strict
          printf '%s  %s\n' "$DERIVED_NORMAL_SHA256" "$normal" | sha256sum --check --strict
          printf '%s  %s\n' "$DERIVED_SHINY_SHA256" "$shiny" | sha256sum --check --strict
          python tools/cobblemon-model-review/validate_original_model.py --official .review/official/hitmonlee.geo.json --candidate "$model"
          python tools/cobblemon-model-review/validate_derived_texture.py --official .review/official/hitmonlee.png --derived "$normal" --metadata docs/cobblemon-skins/0106_hitmonlee/cobra-dojo-normal.texture.json --expected-official-sha256 "$OFFICIAL_NORMAL_SHA256" --expected-derived-sha256 "$DERIVED_NORMAL_SHA256"
          python tools/cobblemon-model-review/validate_derived_texture.py --official .review/official/hitmonlee_shiny.png --derived "$shiny" --metadata docs/cobblemon-skins/0106_hitmonlee/cobra-dojo-shiny.texture.json --expected-official-sha256 "$OFFICIAL_SHINY_SHA256" --expected-derived-sha256 "$DERIVED_SHINY_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/ouros_cobra_dojo_hitmonlee.geo.json')
          bones=json.loads(p.read_text())['minecraft:geometry'][0]['bones']
          expected=['ouros_cobra_cowl','ouros_cobra_gi_shell','ouros_cobra_belt_sash','ouros_cobra_left_forearm','ouros_cobra_right_forearm','ouros_cobra_left_leg2','ouros_cobra_left_leg3','ouros_cobra_left_leg4','ouros_cobra_right_leg2','ouros_cobra_right_leg3','ouros_cobra_right_leg4','ouros_cobra_left_foot','ouros_cobra_right_foot']
          assert len(bones)==43 and [b['name'] for b in bones[30:]]==expected
          names={b['name'] for b in bones}; assert len(names)==43
          assert all(b.get('parent') in names for b in bones[30:])
          assert sum(len(b.get('cubes',[])) for b in bones[30:])==94
          r=json.loads(Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0106_hitmonlee/90_ouros_cobra_dojo.json').read_text())
          assert r['species']=='cobblemon:hitmonlee' and r['order']==90 and len(r['variations'])==2
          assert all(v['poser']=='cobblemon:hitmonlee' for v in r['variations'])
          Path('.review/output/geometry-summary.json').write_text(json.dumps({'originalBones':30,'derivedBones':43,'cosmeticBones':13,'cosmeticCubes':94,'cosmeticNames':expected},indent=2)+'\n')
          PY

      - name: Download pinned Blockbench
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" -o .review/blockbench.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" '.review/blockbench.AppImage' | sha256sum --check --strict
          chmod +x .review/blockbench.AppImage
          (cd .review && ./blockbench.AppImage --appimage-extract >/dev/null)

      - name: Render matched-camera evidence in Blockbench
        shell: bash
        run: |
          set -euo pipefail
          cleanup(){ pid="${1:-}"; if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi; pkill -f "$PWD/.review/squashfs-root/blockbench" 2>/dev/null || true; sleep 2; }
          render_once(){
            model="$1"; tex="$2"; anim="$3"; time="$4"; out="$5"; port="$6"; tag="$7"; pin="$8"; pout="$9"; attempt="${10}"
            user="$PWD/.review/user-${tag}-${attempt}"; log="$PWD/.review/${tag}-${attempt}.log"; rm -rf "$user" "$out"; mkdir -p "$user" "$out"
            xvfb-run -a -s '-screen 0 1600x1200x24' env APPDIR="$PWD/.review/squashfs-root" .review/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$user" "$model" >"$log" 2>&1 & pid=$!
            ready=0; for _ in $(seq 1 90); do if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi; if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; cleanup "$pid"; return 1; fi; sleep 1; done
            if [ "$ready" -ne 1 ]; then cat "$log"; cleanup "$pid"; return 1; fi
            args=(--endpoint "http://127.0.0.1:${port}" --texture "$tex" --animation "$PWD/.review/official/hitmonlee.animation.json" --animation-name "$anim" --animation-time "$time" --gameplay-resolution "$GAMEPLAY_RESOLUTION" --output-dir "$out")
            if [ -n "$pin" ]; then args+=(--camera-profile-in "$pin"); fi; if [ -n "$pout" ]; then args+=(--camera-profile-out "$pout"); fi
            node tools/cobblemon-model-review/blockbench_capture.mjs "${args[@]}" || { cat "$log"; cleanup "$pid"; return 1; }; cleanup "$pid"
          }
          render(){ for n in 1 2 3; do if render_once "$1" "$2" "$3" "$4" "$5" "$6" "$7" "$8" "$9" "$n"; then return 0; fi; done; return 1; }
          official="$PWD/.review/official/hitmonlee.geo.json"; model="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0106_hitmonlee/ouros_cobra_dojo_hitmonlee.geo.json"; normal="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0106_hitmonlee/ouros_cobra_dojo_hitmonlee.png"; shiny="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0106_hitmonlee/ouros_cobra_dojo_hitmonlee_shiny.png"; camera="$PWD/.review/official-camera.json"
          render "$official" "$PWD/.review/official/hitmonlee.png" 'animation.hitmonlee.ground_idle' 0.35 "$PWD/.review/renders/official" 9341 official '' "$camera"
          render "$model" "$normal" 'animation.hitmonlee.ground_idle' 0.35 "$PWD/.review/renders/hero" 9342 hero "$camera" ''
          render "$model" "$normal" 'animation.hitmonlee.battle_idle' 0.35 "$PWD/.review/renders/battle" 9343 battle "$camera" ''
          render "$model" "$normal" 'animation.hitmonlee.ground_walk' 0.25 "$PWD/.review/renders/walk" 9344 walk "$camera" ''
          render "$model" "$shiny" 'animation.hitmonlee.ground_idle' 0.35 "$PWD/.review/renders/shiny" 9345 shiny "$camera" ''

      - name: Assemble evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from PIL import Image
          out=Path('.review/output')
          files={'official_reference_three_quarter.png':'.review/renders/official/three_quarter.png','hero_three_quarter.png':'.review/renders/hero/three_quarter.png','battle_ready_three_quarter.png':'.review/renders/battle/three_quarter.png','walking_three_quarter.png':'.review/renders/walk/three_quarter.png','hero_front.png':'.review/renders/hero/front.png','hero_left.png':'.review/renders/hero/left.png','hero_right.png':'.review/renders/hero/right.png','hero_back.png':'.review/renders/hero/back.png','official_reference_gameplay_160.png':'.review/renders/official/three_quarter_gameplay_160.png','hero_gameplay_160.png':'.review/renders/hero/three_quarter_gameplay_160.png','battle_ready_gameplay_160.png':'.review/renders/battle/three_quarter_gameplay_160.png','walking_gameplay_160.png':'.review/renders/walk/three_quarter_gameplay_160.png','shiny_three_quarter.png':'.review/renders/shiny/three_quarter.png'}
          hashes={}
          for name,src in files.items():
            src=Path(src); assert src.is_file(),src; shutil.copy2(src,out/name); im=Image.open(out/name).convert('RGBA'); assert im.size==((160,160) if 'gameplay_160' in name else (1024,1024)); hashes[name]=hashlib.sha256((out/name).read_bytes()).hexdigest()
          metas={t:json.loads(Path(f'.review/renders/{t}/blockbench-metadata.json').read_text()) for t in ('official','hero','battle','walk','shiny')}
          assert metas['official']['modelInfo']['boneCount']==30
          assert all(metas[t]['modelInfo']['boneCount']==43 for t in ('hero','battle','walk','shiny'))
          report={'format':'ouros.cobblemon-full-transformation-review.v1','pokemon':'Hitmonlee','concept':'Cobra Dojo Striker','viewer':'Blockbench 5.1.6','blockbenchSha256':'c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e','sourceManifest':json.loads(Path('docs/cobblemon-skins/0106_hitmonlee/cobra-dojo-source-manifest.json').read_text()),'geometry':json.loads((out/'geometry-summary.json').read_text()),'officialReferenceCameraSha256':hashlib.sha256(Path('.review/official-camera.json').read_bytes()).hexdigest(),'gameplayResolution':160,'pngSha256':hashes,'artisticAcceptance':'PENDING_HUMAN_VISUAL_REVIEW','presentationOnly':True}
          (out/'blockbench-review-metadata.json').write_text(json.dumps(report,indent=2)+'\n'); shutil.copy2('.review/official-camera.json',out/'official-camera.json')
          PY
      - name: Upload real Blockbench evidence
        uses: actions/upload-artifact@v4
        with:
          name: hitmonlee-cobra-dojo-blockbench-review
          path: .review/output
          if-no-files-found: error
          retention-days: 14
