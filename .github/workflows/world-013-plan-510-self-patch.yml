name: WORLD-013 Plan 510 Self Patch

on:
  push:
    branches:
      - world-013-plan-510
    paths:
      - '.github/workflows/world-013-plan-510-self-patch.yml'

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-plan-510
          fetch-depth: 0
      - name: Record shipped WORLD-013 terrain-aware navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          plan = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = plan.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('| WORLD-013 | NEXT/PARTIAL |'):
                  marker = ' All four populations reuse only the same already-approved complete PTU profile;'
                  if marker not in line:
                      raise SystemExit('WORLD-013 insertion marker missing')
                  if 'PR #510 / merge `8ab68ee503c52b0483c107cce823f513163b0fe3`' not in line:
                      addition = (' PR #510 / merge `8ab68ee503c52b0483c107cce823f513163b0fe3` makes leash-safe native CALM navigation terrain-aware: '
                                  'it first preserves the actor-Y route attempt, then retries the exact same authored X/Z destination at Minecraft MOTION_BLOCKING_NO_LEAVES surface height when that target column is vertically offset; '
                                  'initial collision steering and route continuity share the same path helper, and every accepted path node remains inside the authored horizontal habitat leash.')
                      lines[i] = line.replace(marker, addition + marker, 1)
                  break
          else:
              raise SystemExit('WORLD-013 row missing')
          plan.write_text('\n'.join(lines) + '\n')
          PY
          rm .github/workflows/world-013-plan-510-self-patch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/world-013-plan-510-self-patch.yml
          git diff --cached --exit-code && exit 0
          git commit -m 'WORLD-013: record terrain-aware CALM navigation'
          git push origin HEAD:world-013-plan-510
