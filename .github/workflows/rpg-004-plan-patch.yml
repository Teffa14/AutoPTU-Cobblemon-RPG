name: RPG-004 Plan Patch

on:
  push:
    branches:
      - chore/rpg-004-plan

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rpg-004-plan
          fetch-depth: 0
      - name: Patch canonical plan exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = p.read_text()
          replacements = {
              '| RPG-003 | TODO | Quest objective event processing. |': '| RPG-003 | LIVE/PARTIAL | Quest objective event processing — PR #380 / merge `69d752d06941cf49250e34f6385df90110515789` persists owner-scoped objective progress from server-observed Cedar Meadow events and exposes it in the quest journal. Additional authored objective event types remain follow-up work. |',
              '| RPG-004 | TODO | Idempotent quest reward commit. |': '| RPG-004 | LIVE/PARTIAL | Idempotent quest reward commit — PR #381 / merge `0fee2332ab31bd87ace2627d0594bcc9e3dc45ca` lets a completed Cedar Field Notes quest claim its server-authored 240-credit stipend through the physical Cedar Ranger exactly once, including restart-safe replay. Item/XP and multi-store reward bundles remain follow-up work. |',
              '| SVC-011 | TODO | `canAdvanceQuest(player, event)` |': '| SVC-011 | LIVE/PARTIAL | `canAdvanceQuest(player, event)` — PR #380 / merge `69d752d06941cf49250e34f6385df90110515789` advances only accepted server-authored objectives from known server-observed event keys. Broader quest event/prerequisite policy remains follow-up work. |',
              '| SVC-012 | TODO | `canClaimReward(player, source)` |': '| SVC-012 | LIVE/PARTIAL | `canClaimReward(player, source)` — PR #381 / merge `0fee2332ab31bd87ace2627d0594bcc9e3dc45ca` verifies accepted quest plus durable objective completion and resolves reward amount/currency/source from the server-authored catalogue before using the canonical idempotent wallet receipt. Non-currency and multi-store rewards remain follow-up work. |',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one plan row for {old!r}, found {count}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          rm .github/workflows/rpg-004-plan-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/rpg-004-plan-patch.yml
          git commit -m "docs: record RPG-003 and RPG-004 shipped status"
          git push origin HEAD:chore/rpg-004-plan
