name: Cobblemon Release Asset Inspection

on:
  push:
    branches:
      - feat/cobblemon-skin-studio-clean-v2
    paths:
      - '.github/workflows/cobblemon-model-preview.yml'
      - 'docs/cobblemon-skin-catalog.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cobblemon-release-asset-inspection-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo

jobs:
  inspect-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact official Modrinth release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" \
            -o .upstream/version.json
          python - <<'PY' > .upstream/download.env
          import json, shlex
          data = json.load(open('.upstream/version.json', encoding='utf-8'))
          assert data['id'] == 'kF7CvxTo', data['id']
          assert data['version_number'] == '1.7.3', data['version_number']
          assert '1.21.1' in data['game_versions'], data['game_versions']
          assert 'fabric' in data['loaders'], data['loaders']
          primary = next((f for f in data['files'] if f.get('primary')), data['files'][0])
          print('DOWNLOAD_URL=' + shlex.quote(primary['url']))
          print('EXPECTED_SHA512=' + shlex.quote(primary['hashes']['sha512']))
          print('EXPECTED_SHA1=' + shlex.quote(primary['hashes']['sha1']))
          print('JAR_FILENAME=' + shlex.quote(primary['filename']))
          PY
          source .upstream/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$DOWNLOAD_URL" -o .upstream/cobblemon.jar
          test "$(sha512sum .upstream/cobblemon.jar | awk '{print $1}')" = "$EXPECTED_SHA512"
          test "$(sha1sum .upstream/cobblemon.jar | awk '{print $1}')" = "$EXPECTED_SHA1"
          echo "Official release verified: $JAR_FILENAME"

      - name: Inspect exact Pikachu production assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-evidence/visual/cobblemon-skins/upstream
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          jar = Path('.upstream/cobblemon.jar')
          version = json.loads(Path('.upstream/version.json').read_text(encoding='utf-8'))
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              required = {
                  'model': 'assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_male.geo.json',
                  'animation': 'assets/cobblemon/bedrock/pokemon/animations/0025_pikachu/pikachu.animation.json',
                  'poser': 'assets/cobblemon/bedrock/pokemon/posers/0025_pikachu/pikachu.json',
                  'resolver': 'assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/pikachu.json',
                  'texture': 'assets/cobblemon/textures/pokemon/0025_pikachu/pikachu.png',
              }
              missing = {key: path for key, path in required.items() if path not in names}
              if missing:
                  # Report every exact Pikachu path from the official JAR before failing.
                  candidates = sorted(n for n in names if '0025_pikachu' in n or ('pikachu' in n.lower() and '/posers/' in n))
                  raise AssertionError('Missing expected production assets: ' + repr(missing) + '\nCandidates:\n' + '\n'.join(candidates))

              blobs = {key: z.read(path) for key, path in required.items()}
              model = json.loads(blobs['model'])
              animation = json.loads(blobs['animation'])
              poser = json.loads(blobs['poser'])
              resolver = json.loads(blobs['resolver'])

          geo = model['minecraft:geometry'][0]
          desc = geo['description']
          bones = geo.get('bones', [])
          assert (desc['texture_width'], desc['texture_height']) == (128, 64)
          assert len(bones) >= 80, len(bones)
          bone_names = [b['name'] for b in bones]
          for name in ('torso2','neck','head_angle','muzzle','tail2','tail3','locator_item_face','locator_item_hat'):
              assert name in bone_names, name

          def summarize_pose(name, pose):
              return {
                  'name': name,
                  'poseName': pose.get('poseName'),
                  'poseTypes': pose.get('poseTypes', []),
                  'isBattle': pose.get('isBattle'),
                  'animations': pose.get('animations', []),
                  'transformedParts': pose.get('transformedParts', []),
                  'quirks': pose.get('quirks', []),
              }

          poses = poser.get('poses', {})
          manifest = {
              'format': 'ouros.cobblemon-official-release-inspection.v1',
              'source': {
                  'provider': 'Modrinth',
                  'project': 'Cobblemon',
                  'versionId': version['id'],
                  'versionNumber': version['version_number'],
                  'gameVersions': version['game_versions'],
                  'loaders': version['loaders'],
                  'jarFilename': next((f['filename'] for f in version['files'] if f.get('primary')), version['files'][0]['filename']),
                  'jarSha512': hashlib.sha512(jar.read_bytes()).hexdigest(),
              },
              'assets': {
                  key: {'path': required[key], 'sha256': hashlib.sha256(blob).hexdigest(), 'bytes': len(blob)}
                  for key, blob in blobs.items()
              },
              'model': {
                  'identifier': desc.get('identifier'),
                  'textureSize': [desc['texture_width'], desc['texture_height']],
                  'boneCount': len(bones),
                  'boneNames': bone_names,
              },
              'poser': {
                  'rootBone': poser.get('rootBone'),
                  'portraitScale': poser.get('portraitScale'),
                  'profileScale': poser.get('profileScale'),
                  'poses': [summarize_pose(name, pose) for name, pose in poses.items()],
              },
              'animationNames': sorted(animation.get('animations', {}).keys()),
              'resolverKeys': sorted(resolver.keys()),
          }
          out = Path('test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-manifest.json')
          out.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest['source'], indent=2))
          print('Pikachu bones:', len(bones))
          print('Pikachu poses:', [p['name'] for p in manifest['poser']['poses']])
          PY

      - name: Commit release inspection manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-evidence/visual/cobblemon-skins/upstream/pikachu-1.7.3-manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
            exit 0
          fi
          git commit -m 'Evidence: pin official Cobblemon 1.7.3 Pikachu assets'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
