name: Ouros Build Review Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tools/build-review/**'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/AutoPtuCobblemonFabricAdapter.java'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/MeridianCanopyGymBuilder.java'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/MeridianCanopyGymDetailPass.java'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/OurosBuildManifestExportRuntime.java'
      - 'fabric-adapter/build.gradle.kts'
      - '.github/workflows/build-review-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ouros-build-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build production Fabric + Cobblemon mod set
        shell: bash
        run: |
          set -euo pipefail
          gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon

      - name: Export exact Minecraft block manifest
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/build-review-server"
          output="$PWD/site/build-data/meridian-canopy-gym.blocks.json"
          mkdir -p "$server_dir/mods" "$(dirname "$output")"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.17.2/1.0.3/server/jar'

          server_pid=""
          stop_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
          }
          trap stop_server EXIT

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.ourosBuildManifestOutput="$output" \
              -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../build-review-server.log 2>&1
          ) &
          server_pid=$!

          export_ready=0
          for _ in $(seq 1 180); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU exact Ouros build manifest export passed' "$latest" 2>/dev/null \
              && [ -s "$output" ]; then
              export_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$export_ready" -ne 1 ]; then
            cat build-review-server.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          grep 'AutoPTU exact Ouros build manifest export passed' "$server_dir/logs/latest.log"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["geometryAuthority"])' "$output")" = 'live_server_final_blockstate_scan'
          python3 - <<'PY' "$output"
          import json, sys
          p = sys.argv[1]
          data = json.load(open(p, encoding='utf-8'))
          if data['blockCount'] != len(data['blocks']):
              raise SystemExit('blockCount does not match exported block array')
          if not data['geometrySha256'] or len(data['geometrySha256']) != 64:
              raise SystemExit('missing geometry SHA-256')
          print(f"Exact Minecraft manifest: {data['blockCount']} blocks, {len(data['palette'])} states, sha256={data['geometrySha256']}")
          PY
          stop_server

      - name: Stage pinned Minecraft viewer assets
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/site/minecraft-assets"
          mkdir -p "$out"

          summary_sha='483c3f2f70a78e61127b68f3ee2416b58aeecacc'
          atlas_sha='104ada7d63893dcfe08355d6d7c2f157ebbddc42'
          raw='https://raw.githubusercontent.com/misode/mcmeta'

          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$raw/$summary_sha/assets/block_definition/data.min.json" \
            -o "$out/block-definitions.json"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$raw/$summary_sha/assets/model/data.min.json" \
            -o "$out/block-models.json"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$raw/$atlas_sha/blocks/data.min.json" \
            -o "$out/atlas-map.json"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$raw/$atlas_sha/blocks/atlas.png" \
            -o "$out/atlas.png"

          python3 - <<'PY' "$out"
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ('block-definitions.json', 'block-models.json', 'atlas-map.json'):
              path = root / name
              with path.open(encoding='utf-8') as fh:
                  data = json.load(fh)
              if not isinstance(data, dict) or not data:
                  raise SystemExit(f'{name} is empty or invalid')
          png = (root / 'atlas.png').read_bytes()
          if not png.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('atlas.png is not a valid PNG')
          print('Pinned Minecraft viewer assets staged:',
                *(f'{p.name}={p.stat().st_size}' for p in sorted(root.iterdir())))
          PY

      - name: Bundle self-contained Safari viewer runtime
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/ouros-viewer-node"
          out="$PWD/site/assets"
          mkdir -p "$deps" "$out"

          npm install --prefix "$deps" --no-save \
            deepslate@0.26.0 \
            gl-matrix@3.4.3 \
            esbuild@0.25.9

          "$deps/node_modules/.bin/esbuild" \
            tools/build-review/meridian-canopy-gym.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=safari15 \
            --minify \
            --outfile="$out/meridian-canopy-gym.bundle.js"

          test -s "$out/meridian-canopy-gym.bundle.js"
          test "$(wc -c < "$out/meridian-canopy-gym.bundle.js")" -gt 10000
          if grep -q 'esm.sh' "$out/meridian-canopy-gym.bundle.js"; then
            echo 'Viewer bundle still contains esm.sh runtime dependency' >&2
            exit 1
          fi
          if grep -q 'esm.sh' site/builds/meridian-canopy-gym.html; then
            echo 'Viewer HTML still contains esm.sh runtime dependency' >&2
            exit 1
          fi
          grep -q '__ourosViewerBooted' "$out/meridian-canopy-gym.bundle.js"
          echo "Self-contained viewer bundle staged: $(wc -c < "$out/meridian-canopy-gym.bundle.js") bytes"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build review site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
