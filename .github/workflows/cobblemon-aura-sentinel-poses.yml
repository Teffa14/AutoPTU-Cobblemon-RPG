name: Aura Sentinel Real Blockbench Evidence

on:
  push:
    branches:
      - 'feat/lucario-aura-sentinel-epic'
    paths:
      - '.github/workflows/cobblemon-aura-sentinel-poses.yml'
      - 'tools/cobblemon-model-review/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0448_lucario/ouros_aura_sentinel_accessories.png'
  pull_request:
    paths:
      - '.github/workflows/cobblemon-aura-sentinel-poses.yml'
      - 'tools/cobblemon-model-review/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0448_lucario/ouros_aura_sentinel_accessories.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-sentinel-real-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  BLOCKBENCH_VERSION: 5.1.6
  BLOCKBENCH_SHA256: c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e

jobs:
  render-real-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent viewer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64
      - name: Download exact official Lucario source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pose/official
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/lucario-blockbench-review' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .pose/version.json
          python - <<'PY' > .pose/download.env
          import json, shlex
          data=json.load(open('.pose/version.json',encoding='utf-8'))
          assert data['id']=='kF7CvxTo' and data['version_number']=='1.7.3'
          assert data['game_versions']==['1.21.1'] and 'fabric' in data['loaders']
          primary=next(f for f in data['files'] if f.get('primary'))
          assert primary['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL='+shlex.quote(primary['url']))
          print('SHA512='+shlex.quote(primary['hashes']['sha512']))
          PY
          source .pose/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .pose/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.pose/cobblemon.jar' | sha512sum --check --strict
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0448_lucario/lucario.geo.json' > .pose/official/lucario.geo.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0448_lucario/lucario.animation.json' > .pose/official/lucario.animation.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/posers/0448_lucario/lucario.json' > .pose/official/lucario.poser.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/textures/pokemon/0448_lucario/lucario.png' > .pose/official/lucario.png
          test "$(sha256sum .pose/official/lucario.geo.json | awk '{print $1}')" = 'ccc5f4521fd71fcb4db548a0f0fd0ed41f83426f4a5c04efa473d8a20bef2de9'
          test "$(sha256sum .pose/official/lucario.animation.json | awk '{print $1}')" = 'ddf880b0830d7649f8cd8811c1c7e2b7fcdee156c850bbeb398f064995fa8563'
          test "$(sha256sum .pose/official/lucario.png | awk '{print $1}')" = '98c46f44f9e3428c8ecfd9f564d8d2e4c26ea60bee9ace6ff225c66f4803596a'
      - name: Prove cosmetic preserves all official bones
        shell: bash
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/validate_original_model.py \
            --official .pose/official/lucario.geo.json \
            --candidate fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json
      - name: Build exact review texture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          base=Image.open('.pose/official/lucario.png').convert('RGBA')
          overlay=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0448_lucario/ouros_aura_sentinel_accessories.png').convert('RGBA')
          assert base.size==overlay.size==(128,64)
          Image.alpha_composite(base,overlay).save('.pose/aura-sentinel.png',optimize=True)
          PY
      - name: Download pinned Blockbench
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" \
            -o .pose/blockbench.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" '.pose/blockbench.AppImage' | sha256sum --check --strict
          chmod +x .pose/blockbench.AppImage
          (cd .pose && ./blockbench.AppImage --appimage-extract >/dev/null)
          test -x .pose/squashfs-root/AppRun
      - name: Render exact official and Aura Sentinel states in Blockbench
        shell: bash
        run: |
          set -euo pipefail
          root='test-evidence/visual/cobblemon-skins/0448_lucario/aura-sentinel-real-poses'
          rm -rf "$root" .pose/renders
          mkdir -p "$root" .pose/renders
          cleanup_blockbench() {
            pid="${1:-}"
            if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            pkill -f "$PWD/.pose/squashfs-root/blockbench" 2>/dev/null || true
            pkill -f "$PWD/.pose/squashfs-root/AppRun" 2>/dev/null || true
            sleep 2
          }
          render_once() {
            model="$1"; texture="$2"; animation="$3"; frame="$4"; output="$5"; port="$6"; name="$7"; attempt="$8"
            userdata="$PWD/.pose/user-${name}-${attempt}"; log="$PWD/.pose/${name}-${attempt}.log"
            rm -rf "$userdata" "$output"; mkdir -p "$userdata" "$output"
            xvfb-run -a -s '-screen 0 1600x1200x24' env APPDIR="$PWD/.pose/squashfs-root" \
              .pose/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan \
              --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$userdata" \
              "$model" > "$log" 2>&1 &
            pid=$!; ready=0
            for _ in $(seq 1 90); do
              if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; cleanup_blockbench "$pid"; return 1; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then cat "$log"; cleanup_blockbench "$pid"; return 1; fi
            if ! node tools/cobblemon-model-review/blockbench_capture.mjs \
              --endpoint "http://127.0.0.1:${port}" --texture "$texture" \
              --animation "$PWD/.pose/official/lucario.animation.json" \
              --animation-name "$animation" --animation-time "$frame" --output-dir "$output"; then
              cat "$log"; cleanup_blockbench "$pid"; return 1
            fi
            cleanup_blockbench "$pid"
          }
          render_model() {
            for attempt in 1 2 3; do
              if render_once "$1" "$2" "$3" "$4" "$5" "$6" "$7" "$attempt"; then return 0; fi
            done
            return 1
          }
          official="$PWD/.pose/official/lucario.geo.json"
          sentinel="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json"
          render_model "$official" "$PWD/.pose/official/lucario.png" 'animation.lucario.ground_idle' 0.35 "$PWD/.pose/renders/official-hero" 9241 official-hero
          render_model "$sentinel" "$PWD/.pose/aura-sentinel.png" 'animation.lucario.ground_idle' 0.35 "$PWD/.pose/renders/hero" 9242 hero
          render_model "$sentinel" "$PWD/.pose/aura-sentinel.png" 'animation.lucario.battle_idle' 0.35 "$PWD/.pose/renders/battle" 9243 battle
          cp .pose/renders/official-hero/three_quarter.png "$root/official_reference_three_quarter.png"
          cp .pose/renders/hero/three_quarter.png "$root/hero_three_quarter.png"
          cp .pose/renders/battle/three_quarter.png "$root/battle_ready_three_quarter.png"
          cp .pose/renders/hero/front.png "$root/hero_front.png"
          cp .pose/renders/hero/left.png "$root/hero_left.png"
          cp .pose/renders/hero/right.png "$root/hero_right.png"
          cp .pose/renders/hero/back.png "$root/hero_back.png"
      - name: Validate provenance and record procedural-walk limitation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          renders=Path('.pose/renders')
          expected={'official-hero':('animation.lucario.ground_idle',87),'hero':('animation.lucario.ground_idle',95),'battle':('animation.lucario.battle_idle',95)}
          for name,(animation,bones) in expected.items():
              m=json.loads((renders/name/'blockbench-metadata.json').read_text())
              assert m['viewer']=='Blockbench'
              assert m['sourceOfTransforms']=='Blockbench Bedrock animation codec'
              assert m['modelInfo']['boneCount']==bones
              assert m['modelInfo']['appliedAnimation']['name']==animation
              assert m['modelInfo']['appliedAnimation']['codec']=='bedrock'
          poser=json.loads(Path('.pose/official/lucario.poser.json').read_text())
          walk=poser['poses']['walking']['animations']
          assert any('q.biped_walk' in x for x in walk)
          assert any('q.bimanual_swing' in x for x in walk)
          root=Path('test-evidence/visual/cobblemon-skins/0448_lucario/aura-sentinel-real-poses')
          files=['official_reference_three_quarter.png','hero_three_quarter.png','battle_ready_three_quarter.png','hero_front.png','hero_left.png','hero_right.png','hero_back.png']
          hashes={}
          for filename in files:
              p=root/filename; image=Image.open(p).convert('RGBA'); assert image.size==(1024,1024) and image.getbbox() is not None
              hashes[filename]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
              'format':'ouros.cobblemon-blockbench-pose-evidence.v1','viewer':'Blockbench 5.1.6',
              'modelSource':'official Cobblemon 1.7.3 Fabric JAR, Modrinth version kF7CvxTo',
              'modelSha256':'ccc5f4521fd71fcb4db548a0f0fd0ed41f83426f4a5c04efa473d8a20bef2de9',
              'animationSha256':'ddf880b0830d7649f8cd8811c1c7e2b7fcdee156c850bbeb398f064995fa8563',
              'textureSha256':'98c46f44f9e3428c8ecfd9f564d8d2e4c26ea60bee9ace6ff225c66f4803596a',
              'originalBoneCount':87,'derivedBoneCount':95,
              'poses':{'hero':{'animation':'animation.lucario.ground_idle','time':0.35},'battle_ready':{'animation':'animation.lucario.battle_idle','time':0.35}},
              'walkingEvidence':{'status':'not-rendered','reason':'Official Lucario walking poser is procedural q.biped_walk + q.bimanual_swing plus ground_idle; no dedicated Bedrock walking animation exists, so this workflow does not invent manual transforms.'},
              'files':hashes,
          }
          (root/'pose-metadata.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload real Blockbench evidence
        uses: actions/upload-artifact@v4
        with:
          name: aura-sentinel-real-poses
          path: test-evidence/visual/cobblemon-skins/0448_lucario/aura-sentinel-real-poses
          if-no-files-found: error
          retention-days: 14
      - name: Commit validated evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          root='test-evidence/visual/cobblemon-skins/0448_lucario/aura-sentinel-real-poses'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$root"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Evidence: add Aura Sentinel Blockbench review'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
