name: Ouros Build Review Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tools/build-review/**'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/AutoPtuCobblemonFabricAdapter.java'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/**'
      - 'fabric-adapter/build.gradle.kts'
      - '.github/workflows/build-review-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ouros-build-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build production Fabric + Cobblemon mod set
        shell: bash
        run: |
          set -euo pipefail
          gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon

      - name: Export exact Meridian Canopy Gym manifest
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/build-review-server"
          output="$PWD/site/build-data/meridian-canopy-gym.blocks.json"
          mkdir -p "$server_dir/mods" "$(dirname "$output")"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.17.2/1.0.3/server/jar'

          server_pid=""
          stop_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
          }
          trap stop_server EXIT

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.ourosBuildManifestOutput="$output" \
              -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../build-review-server.log 2>&1
          ) &
          server_pid=$!

          export_ready=0
          for _ in $(seq 1 180); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU Ouros capture envelope audit passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Ouros floating component audit passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU exact Ouros build manifest export passed' "$latest" 2>/dev/null \
              && [ -s "$output" ]; then
              export_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done

          if [ "$export_ready" -ne 1 ]; then
            cat build-review-server.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          grep 'AutoPTU Ouros capture envelope audit passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU Ouros floating component audit passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU exact Ouros build manifest export passed' "$server_dir/logs/latest.log"
          python3 - <<'PY' "$output"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['geometryAuthority'] == 'live_server_final_blockstate_scan'
          assert data['captureEnvelopeAudit'] == 'passed'
          assert data['floatingComponentAudit'] == 'passed'
          assert data['blockCount'] == len(data['blocks'])
          assert len(data['geometrySha256']) == 64
          print(f"Exact Meridian manifest: {data['blockCount']} blocks, {len(data['palette'])} states, sha256={data['geometrySha256']}")
          PY
          stop_server

      - name: Export exact Ouros Grand Palace manifest
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/grand-palace-review-server"
          output="$PWD/site/build-data/ouros-grand-palace.blocks.json"
          mkdir -p "$server_dir/mods" "$(dirname "$output")"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.17.2/1.0.3/server/jar'

          server_pid=""
          stop_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
          }
          trap stop_server EXIT

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.ourosGrandPalaceManifestOutput="$output" \
              -Xms768M -Xmx3G -jar fabric-server-launch.jar nogui > ../grand-palace-review-server.log 2>&1
          ) &
          server_pid=$!

          export_ready=0
          for _ in $(seq 1 360); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU Ouros Grand Palace capture envelope audit passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Ouros Grand Palace floating component audit passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU exact Ouros Grand Palace manifest export passed' "$latest" 2>/dev/null \
              && [ -s "$output" ]; then
              export_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done

          if [ "$export_ready" -ne 1 ]; then
            cat grand-palace-review-server.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          grep 'AutoPTU Ouros Grand Palace capture envelope audit passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU Ouros Grand Palace floating component audit passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU exact Ouros Grand Palace manifest export passed' "$server_dir/logs/latest.log"

          python3 - <<'PY' "$output"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['buildId'] == 'ouros_grand_palace'
          assert data['geometryAuthority'] == 'live_server_final_blockstate_scan'
          assert data['captureEnvelopeAudit'] == 'passed'
          assert data['floatingComponentAudit'] == 'passed'
          assert data['blockCount'] == len(data['blocks'])
          assert len(data['geometrySha256']) == 64
          assert data['size'] == [109, 77, 139], data['size']
          assert len(data['authoredSpaces']) == 19
          assert len(data.get('reviewSpaces', [])) >= 19
          print(f"Exact Grand Palace manifest: {data['blockCount']} blocks, {len(data['palette'])} states, sha256={data['geometrySha256']}")
          PY
          stop_server

      - name: Validate shared build-review registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('site/build-data')
          registry = json.loads((root / 'builds.json').read_text(encoding='utf-8'))
          assert registry['format'] == 'ouros.build-review.registry.v1'
          builds = registry['builds']
          assert len(builds) >= 2
          ids = set()
          for build in builds:
              assert build['id'] not in ids
              ids.add(build['id'])
              manifest = json.loads(pathlib.Path('site', build['manifest']).read_text(encoding='utf-8'))
              assert manifest['buildId'] == build['id']
              assert manifest['geometryAuthority'] == 'live_server_final_blockstate_scan'
              assert manifest['captureEnvelopeAudit'] == 'passed'
              assert manifest['floatingComponentAudit'] == 'passed'
          print('Shared build registry validated:', ', '.join(sorted(ids)))
          PY

      - name: Stage pinned Minecraft surface assets
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/site/minecraft-assets"
          mkdir -p "$out"
          atlas_sha='104ada7d63893dcfe08355d6d7c2f157ebbddc42'
          raw='https://raw.githubusercontent.com/misode/mcmeta'

          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$raw/$atlas_sha/blocks/data.min.json" -o "$out/atlas-map.json"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$raw/$atlas_sha/blocks/atlas.png" -o "$out/atlas.png"

          python3 - <<'PY' "$out"
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          with (root / 'atlas-map.json').open(encoding='utf-8') as fh: atlas = json.load(fh)
          if not isinstance(atlas, dict) or not atlas: raise SystemExit('atlas-map.json is empty or invalid')
          png = (root / 'atlas.png').read_bytes()
          if not png.startswith(b'\x89PNG\r\n\x1a\n'): raise SystemExit('atlas.png is not a valid PNG')
          print('Pinned low-memory viewer assets staged:', *(f'{p.name}={p.stat().st_size}' for p in sorted(root.iterdir())))
          PY

      - name: Compile server-side low-memory surface meshes
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-review/compile-surface-mesh.mjs
          node tools/build-review/compile-surface-mesh.mjs \
            site/build-data/builds.json \
            site/build-mesh \
            site/minecraft-assets/atlas-map.json \
            site/minecraft-assets/atlas.png

          python3 - <<'PY'
          import json, pathlib
          site = pathlib.Path('site')
          registry = json.loads((site / 'build-data/builds.json').read_text(encoding='utf-8'))
          for build in registry['builds']:
              source = json.loads((site / build['manifest']).read_text(encoding='utf-8'))
              mesh_path = site / 'build-mesh' / f"{build['id']}.mesh.json"
              mesh = json.loads(mesh_path.read_text(encoding='utf-8'))
              assert mesh['format'] == 'ouros.minecraft.surface-mesh.v1'
              assert mesh['buildId'] == source['buildId']
              assert mesh['geometryAuthority'] == 'live_server_final_blockstate_scan'
              assert mesh['sourceGeometrySha256'] == source['geometrySha256']
              assert mesh['blockCount'] == source['blockCount']
              assert mesh['size'] == source['size']
              assert mesh['captureEnvelopeAudit'] == 'passed'
              assert mesh['floatingComponentAudit'] == 'passed'
              assert mesh['renderMode'] == 'server_precomputed_surface_mesh'
              total = mesh['opaque']['bytes'] + mesh['translucent']['bytes']
              assert total < 48 * 1024 * 1024, f"{build['id']} review mesh exceeds 48 MiB browser budget: {total}"
              assert mesh['meshStats']['exposedBlocks'] <= source['blockCount']
              assert mesh['meshStats']['visibleFaces'] > 0
              for part in ('opaque', 'translucent'):
                  p = site / mesh[part]['url']
                  assert p.is_file(), p
                  assert p.stat().st_size == mesh[part]['bytes'], (p, p.stat().st_size, mesh[part]['bytes'])
              print(build['id'], 'low-memory mesh:', total, 'bytes,', mesh['meshStats']['visibleFaces'], 'faces,', mesh['meshStats']['culledInteriorBlocks'], 'fully interior blocks removed')
          PY

      - name: Assemble unified low-memory browser runtime
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/ouros-viewer-node"
          out="$PWD/site/assets"
          mkdir -p "$deps" "$out"

          npm install --prefix "$deps" --no-save gl-matrix@3.4.3
          glmatrix_umd="$deps/node_modules/gl-matrix/gl-matrix-min.js"
          entry="$PWD/tools/build-review/ouros-build-review.js"
          bundle="$out/ouros-build-review.bundle.js"
          test -s "$glmatrix_umd"
          test -s "$entry"
          node --check "$entry"

          {
            cat "$glmatrix_umd"
            printf '\n;\n'
            cat "$entry"
          } > "$bundle"
          test -s "$bundle"
          test "$(wc -c < "$bundle")" -gt 10000

          node - <<'NODE' "$bundle"
          const fs = require('fs');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          new Function(source);
          const forbidden = ['esm.sh', 'index.mjs', 'NbtFile.ts', 'deepslate', 'StructureRenderer', 'manifest.blocks', 'block-definitions.json', 'block-models.json'];
          for (const token of forbidden) if (source.includes(token)) throw new Error('low-memory viewer contains forbidden browser voxel token: ' + token);
          for (const token of ['build-select', 'cameraMode', 'requestPointerLock', 'reviewSpaces', 'SurfaceMeshRenderer', 'uClipMin', 'uClipMax', 'uSliceMax']) {
            if (!source.includes(token)) throw new Error('unified explorer capability missing: ' + token);
          }
          if (!source.includes('__ourosViewerBooted')) throw new Error('viewer boot marker missing');
          NODE

          if grep -q 'esm.sh' site/index.html; then
            echo 'Unified viewer HTML still contains esm.sh runtime dependency' >&2
            exit 1
          fi
          if grep -q '<iframe' site/index.html; then
            echo 'Unified viewer regressed to per-build iframe gallery' >&2
            exit 1
          fi
          echo "Unified low-memory Ouros viewer: $(wc -c < "$bundle") bytes"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build review site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
