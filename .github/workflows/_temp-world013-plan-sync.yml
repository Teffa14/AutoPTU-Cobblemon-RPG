name: Temporary WORLD-013 plan sync

on:
  push:
    branches: [world-013-migration-projection]

permissions:
  contents: write

jobs:
  sync-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-migration-projection
      - name: Record PR 480 in canonical plan
        shell: python
        run: |
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          marker = 'PR #480 / production head `ae4c3f3c2a46bd846f438480501dea4ee5c49906`'
          if marker in text:
              raise SystemExit(0)
          needle = ' All four populations reuse only the same already-approved complete PTU profile; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists. Movement-only invisible encounters remain prohibited. |'
          replacement = (' PR #480 / production head `ae4c3f3c2a46bd846f438480501dea4ee5c49906` adds deterministic server-clock migration projection for the lower-shelf cohort: the same two canonical Fletchling encounter identities remain at Sendero del Vidrio before departure, are not projected during authored transit, and reappear at Sendero Seasonal Crossing while habitat cues resolve against that same projected site; the WILD blueprint and encounter bindings remain unchanged. All four populations reuse only the same already-approved complete PTU profile; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists. Movement-only invisible encounters remain prohibited. |')
          if needle not in text:
              raise SystemExit('WORLD-013 plan anchor not found')
          path.write_text(text.replace(needle, replacement, 1))
      - name: Commit canonical plan update
        run: |
          if git diff --quiet -- MINECRAFT_RPG_TOOLING_PLAN.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m 'WORLD-013 record migration projection PR'
          git push origin HEAD:world-013-migration-projection
