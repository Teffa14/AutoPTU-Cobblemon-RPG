name: Generate Storm Courier V4 Full Transformation

on:
  push:
    branches:
      - 'art/issue-308-full-surface-skins'
    paths:
      - '.github/workflows/cobblemon-generate-storm-courier-v4.yml'
      - 'tools/cobblemon-model-review/build_storm_courier_v4.py'
      - 'tools/cobblemon-model-review/validate_original_model.py'
      - 'tools/cobblemon-model-review/validate_derived_texture.py'
      - 'docs/cobblemon-skins/0025_pikachu/storm-courier-v4-source-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-storm-courier-v4-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  COBBLEMON_VERSION: '1.7.3'
  MINECRAFT_VERSION: '1.21.1'
  COBBLEMON_FILENAME: 'Cobblemon-fabric-1.7.3+1.21.1.jar'
  OFFICIAL_PIKACHU_MALE_SHA256: 'f8ea21f6821d49e8a358f05d43562312a0e018e883f1354aa1445d2a0b432c83'
  OFFICIAL_PIKACHU_FEMALE_SHA256: 'd49ba9bce368fed677832685f57a0ca3e7a00a6014639f1e79dbb0b749ed4318'
  OFFICIAL_PIKACHU_TEXTURE_SHA256: 'df0b0b2029e0cb51ace2fd7d65ce94fc6a7bf1a4681722bf20aa22edd2cc3c8e'
  OFFICIAL_PIKACHU_ANIMATION_SHA256: 'd9ca00604978f295ad312d358a06f2655c725b30ac3da73c3637ae160c543384'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download exact official Cobblemon release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .official-source
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/storm-courier-v4-generator' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" \
            -o .official-source/version.json
          python - <<'PY' > .official-source/download.env
          import json, shlex
          data = json.load(open('.official-source/version.json', encoding='utf-8'))
          assert data['id'] == 'kF7CvxTo'
          assert data['version_number'] == '1.7.3'
          assert '1.21.1' in data['game_versions']
          assert 'fabric' in data['loaders']
          primary = next(f for f in data['files'] if f.get('primary'))
          assert primary['filename'] == 'Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL=' + shlex.quote(primary['url']))
          print('SHA512=' + shlex.quote(primary['hashes']['sha512']))
          PY
          source .official-source/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .official-source/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.official-source/cobblemon.jar' | sha512sum --check --strict

      - name: Extract and pin exact official Pikachu presentation assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          jar = Path('.official-source/cobblemon.jar')
          version = json.loads(Path('.official-source/version.json').read_text(encoding='utf-8'))
          primary = next(f for f in version['files'] if f.get('primary'))
          sources = {
              'maleModel': ('assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_male.geo.json', 'pikachu_male.geo.json'),
              'femaleModel': ('assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_female.geo.json', 'pikachu_female.geo.json'),
              'animation': ('assets/cobblemon/bedrock/pokemon/animations/0025_pikachu/pikachu.animation.json', 'pikachu.animation.json'),
              'poser': ('assets/cobblemon/bedrock/pokemon/posers/0025_pikachu/pikachu.json', 'pikachu.poser.json'),
              'resolver': ('assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/pikachu.json', 'pikachu.resolver.json'),
              'normalTexture': ('assets/cobblemon/textures/pokemon/0025_pikachu/pikachu.png', 'pikachu.png'),
              'shinyTexture': ('assets/cobblemon/textures/pokemon/0025_pikachu/pikachu_shiny.png', 'pikachu_shiny.png'),
              'license': ('LICENSE', 'LICENSE'),
          }
          files = {}
          with zipfile.ZipFile(jar) as archive:
              for label, (member, target_name) in sources.items():
                  try:
                      payload = archive.read(member)
                  except KeyError as exc:
                      related = [p for p in archive.namelist() if '/0025_pikachu/' in p and p.endswith('.json')]
                      raise SystemExit(f'official JAR missing required {label}: {member}; Pikachu JSON entries={related}') from exc
                  Path('.official-source', target_name).write_bytes(payload)
                  files[label] = {'jarPath': member, 'sha256': hashlib.sha256(payload).hexdigest()}

          expected = {
              'maleModel': os.environ['OFFICIAL_PIKACHU_MALE_SHA256'],
              'femaleModel': os.environ['OFFICIAL_PIKACHU_FEMALE_SHA256'],
              'normalTexture': os.environ['OFFICIAL_PIKACHU_TEXTURE_SHA256'],
              'animation': os.environ['OFFICIAL_PIKACHU_ANIMATION_SHA256'],
          }
          for label, digest in expected.items():
              assert files[label]['sha256'] == digest, (label, files[label]['sha256'], digest)

          jar_sha256 = hashlib.sha256(jar.read_bytes()).hexdigest()
          jar_sha512 = hashlib.sha512(jar.read_bytes()).hexdigest()
          assert jar_sha512 == primary['hashes']['sha512']
          manifest = {
              'format': 'ouros.cobblemon-official-source-manifest.v1',
              'minecraftVersion': '1.21.1',
              'cobblemonVersion': '1.7.3',
              'modrinthVersionId': 'kF7CvxTo',
              'filename': 'Cobblemon-fabric-1.7.3+1.21.1.jar',
              'jarSha256': jar_sha256,
              'jarSha512': jar_sha512,
              'license': 'MPL-2.0',
              'files': files,
          }
          generated = Path('.official-source/storm-courier-v4-source-manifest.json')
          generated.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          committed = Path('docs/cobblemon-skins/0025_pikachu/storm-courier-v4-source-manifest.json')
          if committed.exists():
              assert json.loads(committed.read_text(encoding='utf-8')) == manifest, 'official source drift versus committed manifest'
          print(json.dumps(manifest, indent=2))
          PY

      - name: Inspect official models poser resolver animations and forms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          male = json.loads(Path('.official-source/pikachu_male.geo.json').read_text(encoding='utf-8'))
          female = json.loads(Path('.official-source/pikachu_female.geo.json').read_text(encoding='utf-8'))
          animation = json.loads(Path('.official-source/pikachu.animation.json').read_text(encoding='utf-8'))
          poser = json.loads(Path('.official-source/pikachu.poser.json').read_text(encoding='utf-8'))
          resolver = json.loads(Path('.official-source/pikachu.resolver.json').read_text(encoding='utf-8'))
          assert len(male['minecraft:geometry'][0]['bones']) == 90
          assert len(female['minecraft:geometry'][0]['bones']) == 90
          for name in ('animation.pikachu.ground_idle', 'animation.pikachu.battle_idle', 'animation.pikachu.ground_walk'):
              assert name in animation['animations'], name
          assert isinstance(poser, dict) and poser
          assert isinstance(resolver, dict) and resolver
          raw = json.dumps(resolver)
          assert 'female' in raw, 'official Pikachu resolver no longer exposes expected female presentation branch'
          print('Official Pikachu male/female geometry, poser, resolver and animation contract parsed from pinned JAR.')
          PY

      - name: Generate v4 geometry and full-surface textures
        shell: bash
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/build_storm_courier_v4.py \
            --male .official-source/pikachu_male.geo.json \
            --female .official-source/pikachu_female.geo.json \
            --base-texture .official-source/pikachu.png \
            --shiny-texture .official-source/pikachu_shiny.png \
            --male-out fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json \
            --female-out fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json \
            --normal-texture-out fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier.png \
            --shiny-texture-out fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_shiny.png \
            --overlay-out fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png \
            --normal-metadata-out docs/cobblemon-skins/0025_pikachu/storm-courier-v4-normal.texture.json \
            --shiny-metadata-out docs/cobblemon-skins/0025_pikachu/storm-courier-v4-shiny.texture.json

      - name: Validate original anatomy and exact v4 cosmetic groups
        shell: bash
        run: |
          set -euo pipefail
          male='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json'
          female='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json'
          python tools/cobblemon-model-review/validate_original_model.py --official .official-source/pikachu_male.geo.json --candidate "$male"
          python tools/cobblemon-model-review/validate_original_model.py --official .official-source/pikachu_female.geo.json --candidate "$female"
          python - <<'PY'
          import json
          from pathlib import Path
          expected = [
              'ouros_storm_head_system', 'ouros_storm_mantle_shell', 'ouros_storm_torso_suit',
              'ouros_storm_core', 'ouros_storm_power_frame', 'ouros_storm_left_pylon',
              'ouros_storm_right_pylon', 'ouros_storm_tail_conductor',
          ]
          for path in (
              Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json'),
              Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json'),
          ):
              bones = json.loads(path.read_text(encoding='utf-8'))['minecraft:geometry'][0]['bones']
              assert len(bones) == 98
              assert [bone['name'] for bone in bones[90:]] == expected
          PY

      - name: Validate full-surface normal and shiny texture derivation
        shell: bash
        run: |
          set -euo pipefail
          shiny_sha="$(sha256sum .official-source/pikachu_shiny.png | awk '{print $1}')"
          python tools/cobblemon-model-review/validate_derived_texture.py \
            --official .official-source/pikachu.png \
            --derived fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier.png \
            --metadata docs/cobblemon-skins/0025_pikachu/storm-courier-v4-normal.texture.json \
            --expected-official-sha256 "$OFFICIAL_PIKACHU_TEXTURE_SHA256"
          python tools/cobblemon-model-review/validate_derived_texture.py \
            --official .official-source/pikachu_shiny.png \
            --derived fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_shiny.png \
            --metadata docs/cobblemon-skins/0025_pikachu/storm-courier-v4-shiny.texture.json \
            --expected-official-sha256 "$shiny_sha"

      - name: Validate accessory UV reservation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          data = json.loads(Path('.official-source/pikachu_male.geo.json').read_text(encoding='utf-8'))['minecraft:geometry'][0]
          width, height = data['description']['texture_width'], data['description']['texture_height']
          assert (width, height) == (128, 64)
          used = set()
          def mark(x, y, w, h):
              x0, x1 = sorted((int(x), int(x + w))); y0, y1 = sorted((int(y), int(y + h)))
              for yy in range(max(0, y0), min(height, y1)):
                  for xx in range(max(0, x0), min(width, x1)): used.add((xx, yy))
          for bone in data['bones']:
              for item in bone.get('cubes', []):
                  dx, dy, dz = item.get('size', [0, 0, 0]); uv = item.get('uv', [0, 0])
                  if isinstance(uv, list):
                      u, v = uv
                      for rect in ((u+dz,v,dx,dz),(u+dz+dx,v,dx,dz),(u,v+dz,dz,dy),(u+dz,v+dz,dx,dy),(u+dz+dx,v+dz,dz,dy),(u+2*dz+dx,v+dz,dx,dy)): mark(*rect)
                  else:
                      for face in uv.values():
                          if isinstance(face, dict):
                              p=face.get('uv',[0,0]); e=face.get('uv_size',[1,1]); mark(p[0],p[1],e[0],e[1])
          reserved = {(x,63) for x in range(8)}
          assert not reserved & used
          overlay = Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png').convert('RGBA')
          painted = {(x,y) for y in range(64) for x in range(128) if overlay.getpixel((x,y))[3] > 0}
          assert painted == reserved
          PY

      - name: Validate resolver keeps official poser and sex/shiny branches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          resolver = json.loads(Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/90_ouros_storm_courier.json').read_text(encoding='utf-8'))
          expected = {
              ('ouros_storm_courier',): ('cobblemon:ouros_storm_courier_pikachu_male.geo','cobblemon:textures/pokemon/0025_pikachu/ouros_storm_courier.png'),
              ('ouros_storm_courier','shiny'): ('cobblemon:ouros_storm_courier_pikachu_male.geo','cobblemon:textures/pokemon/0025_pikachu/ouros_storm_courier_shiny.png'),
              ('ouros_storm_courier','female'): ('cobblemon:ouros_storm_courier_pikachu_female.geo','cobblemon:textures/pokemon/0025_pikachu/ouros_storm_courier.png'),
              ('ouros_storm_courier','shiny','female'): ('cobblemon:ouros_storm_courier_pikachu_female.geo','cobblemon:textures/pokemon/0025_pikachu/ouros_storm_courier_shiny.png'),
          }
          assert resolver['species'] == 'cobblemon:pikachu' and resolver['order'] == 90
          assert {tuple(v['aspects']) for v in resolver['variations']} == set(expected)
          for variation in resolver['variations']:
              assert variation['poser'] == 'cobblemon:pikachu'
              assert (variation['model'], variation['texture']) == expected[tuple(variation['aspects'])]
              assert any(layer['name'] == 'ouros_storm_courier' for layer in variation['layers'])
          PY

      - name: Commit pinned manifest and generated production assets
        shell: bash
        run: |
          set -euo pipefail
          cp .official-source/storm-courier-v4-source-manifest.json docs/cobblemon-skins/0025_pikachu/storm-courier-v4-source-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/cobblemon-skins/0025_pikachu/storm-courier-v4-source-manifest.json \
            docs/cobblemon-skins/0025_pikachu/storm-courier-v4-normal.texture.json \
            docs/cobblemon-skins/0025_pikachu/storm-courier-v4-shiny.texture.json \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json \
            fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier.png \
            fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_shiny.png \
            fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png
          if git diff --cached --quiet; then
            echo 'Generated v4 assets already current.'
            exit 0
          fi
          git commit -m 'RPG: generate Storm Courier v4 full transformation from official Cobblemon'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
