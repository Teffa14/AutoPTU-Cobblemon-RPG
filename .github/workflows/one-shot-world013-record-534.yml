name: One-shot WORLD-013 record 534

on:
  push:
    paths:
      - '.github/workflows/one-shot-world013-record-534.yml'

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record shipped global collision navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = p.read_text()
          old = 'New ecology work must continue removing behavior responsibility from `MareaWild*` runtimes: next globalize collision steering/native navigation, route recovery/continuity and reciprocal-yield intent handling.'
          new = 'PR #534 / merge `6af750c526093baaaee0a9da69f10b6814dbbc6e` globalizes collision steering and Minecraft-native CALM navigation through `WildCalmCollisionNavigationRuntime`, so every population published through the global ecology registry shares leash-safe terrain/collision-aware pathfinding without region-specific behavior code. New ecology work must continue removing behavior responsibility from `MareaWild*` runtimes: next globalize route recovery/continuity and reciprocal-yield intent handling.'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one WORLD-013 tail marker, found {count}')
          p.write_text(text.replace(old, new, 1))
      - name: Commit canonical plan update and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-world013-record-534.yml
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m 'Record WORLD-013 global collision navigation'
          git push origin HEAD:main
