name: WORLD-025 Plan Bookkeeping Once

on:
  push:
    branches:
      - rpg/plan-world-025-live

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpg/plan-world-025-live
          fetch-depth: 0
      - name: Patch canonical plan exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = p.read_text()
          old = '| WORLD-025 | TODO | Ambient Pokémon behavior framework that never becomes PTU stat truth. |'
          new = '| WORLD-025 | LIVE | Ambient Pokémon behavior framework — PR #370 / merge `b5d2ea746856ef3043415b92d27506f00fa4328c`; Cedar Meadow wild presentation actors now use a reusable server-owned proximity/recovery controller with authored thresholds. It drives Minecraft navigation/look presentation only and never reads or derives Cobblemon species stats, HP, moves, statuses, abilities, BattleState, encounter legality or PTU outcomes. |'
          if text.count(old) != 1:
              raise SystemExit('WORLD-025 source row mismatch')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit plan-only change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git diff --cached --check
          git commit -m 'Plan: record WORLD-025 ambient Pokemon framework live'
          git push origin HEAD:rpg/plan-world-025-live
