name: WORLD-013 Plan Self Patch

on:
  push:
    branches:
      - world-013-calm-surface-edge-safety
    paths:
      - '.github/workflows/world-013-plan-self-patch.yml'

permissions:
  contents: write

jobs:
  record-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-calm-surface-edge-safety
      - name: Record shipped slice in canonical plan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          marker = ' All four populations reuse only the same already-approved complete PTU profile; multi-species ecology stays blocked until another complete authoritative WILD blueprint exists.'
          record = ' PR #512 / implementation head `4764a9bba99585e8f69694bae22cb67e16e28658` rejects Minecraft-native CALM target columns when any cardinal MOTION_BLOCKING_NO_LEAVES neighbor differs by more than one block, so isolated pillars and abrupt ledges fall back to the existing deterministic leash-safe steering without changing the authored X/Z destination, encounter identity or any PTU rule.'
          if record in text:
              raise SystemExit(0)
          if text.count(marker) != 1:
              raise SystemExit(f'expected one WORLD-013 tail marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, record + marker))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m 'WORLD-013: record CALM ledge target safety'
          git push origin HEAD:world-013-calm-surface-edge-safety
