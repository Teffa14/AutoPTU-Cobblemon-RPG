name: Generate Omen Regent Epic V2
on:
  push:
    branches: ['feat/absol-omen-regent']
    paths: ['.github/workflows/cobblemon-generate-omen-regent-v2.yml','tools/cobblemon-model-review/build_omen_regent_absol_v2.py']
  workflow_dispatch:
permissions: {contents: write}
env: {COBBLEMON_VERSION_ID: kF7CvxTo}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Fetch exact official inputs
        shell: bash
        run: |
          set -euo pipefail; mkdir -p .official
          curl --fail --silent --show-error --location "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .official/v.json
          python - <<'PY' > .official/e
          import json,shlex
          d=json.load(open('.official/v.json')); p=next(x for x in d['files'] if x.get('primary')); assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1']; print('URL='+shlex.quote(p['url'])); print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .official/e; curl --fail --silent --show-error --location "$URL" -o .official/c.jar; printf '%s  %s\n' "$SHA512" .official/c.jar | sha512sum --check --strict
          unzip -p .official/c.jar 'assets/cobblemon/bedrock/pokemon/models/0359_absol/absol.geo.json' > .official/absol.geo.json
          unzip -p .official/c.jar 'assets/cobblemon/bedrock/pokemon/resolvers/0359_absol/0_absol_base.json' > .official/resolver.json
          test "$(sha256sum .official/absol.geo.json|awk '{print $1}')" = ed8b82b60caaeb0ee8b97597b5bd194a52d52d671da7bbc0eb35aa8dd864d462
      - name: Generate and validate epic v2
        shell: bash
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/build_omen_regent_absol_v2.py --official .official/absol.geo.json --model-out fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json --overlay-out fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png --metadata-out docs/cobblemon-skins/0359_absol/omen-regent-build-metadata.json
          python tools/cobblemon-model-review/validate_original_model.py --official .official/absol.geo.json --candidate fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json
          PYTHONPATH=tools/cobblemon-model-review python - <<'PY'
          import json,copy
          from pathlib import Path
          from PIL import Image
          import build_omen_regent_absol_v2 as b
          meta=json.loads(Path('docs/cobblemon-skins/0359_absol/omen-regent-build-metadata.json').read_text()); assert meta['originalBoneCount']==73 and meta['derivedBoneCount']==81 and meta['cosmeticCubeCount']>=55 and len(meta['cosmeticBones'])==8
          g=json.loads(Path('.official/absol.geo.json').read_text())['minecraft:geometry'][0]; reserved={tuple(v) for v in meta['palettePixels'].values()}; assert reserved.isdisjoint(b.mark_uv_usage(g)); im=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png').convert('RGBA'); assert {(x,y) for y in range(im.height) for x in range(im.width) if im.getpixel((x,y))[3]}==reserved
          src=json.loads(Path('.official/resolver.json').read_text()); out={'species':src['species'],'order':90,'variations':[]}
          for v in src['variations']:
              nv=copy.deepcopy(v); nv['aspects']=['ouros_omen_regent']+list(nv.get('aspects',[])); nv['model']='cobblemon:ouros_omen_regent_absol.geo'; nv.setdefault('layers',[]).append({'name':'ouros_omen_regent','texture':'cobblemon:textures/pokemon/0359_absol/ouros_omen_regent_accessories.png','translucent':True}); out['variations'].append(nv)
          p=Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0359_absol/90_ouros_omen_regent.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,separators=(',',':'))+'\n')
          PY
      - name: Commit production v2
        shell: bash
        run: |
          set -euo pipefail; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0359_absol/90_ouros_omen_regent.json fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png docs/cobblemon-skins/0359_absol/omen-regent-build-metadata.json; git commit -m 'RPG: regenerate Omen Regent epic v2' || exit 0; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin HEAD:"${GITHUB_REF_NAME}"
