name: One-shot WORLD-013 plan record 545

on:
  push:
    branches:
      - world-013-plan-record-545
    paths:
      - .github/workflows/one-shot-world013-plan-545.yml

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-plan-record-545
          fetch-depth: 0
      - name: Update canonical WORLD-013 row exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          marker = '| WORLD-013 | NEXT/PARTIAL |'
          old = "PR #543 / merge `f7924e747dd5c126b6c822ad5add927c9c8d9fa8` centralizes current-site resolution in `WildPopulationContentRegistry.projectedSiteId(...)`, migrates the active ecology projection source and all remaining Marea presentation consumers onto that registered boundary, and removes `MareaWildMigrationProjection`. Next remove the remaining region-owned `ProjectedActor` assembly, presentation-anchor policy and `WildBehaviorProfile` authoring from `MareaWildEcologyProjectionSource` by registering those projection inputs through the global ecology content boundary, so another region requires content registration rather than another source class."
          new = "PR #543 / merge `f7924e747dd5c126b6c822ad5add927c9c8d9fa8` centralizes current-site resolution in `WildPopulationContentRegistry.projectedSiteId(...)`, migrates the active ecology projection source and all remaining Marea presentation consumers onto that registered boundary, and removes `MareaWildMigrationProjection`. PR #545 / merge `731298bc641a453ab98f10dff53c189e79ded0f6` removes `MareaWildEcologyProjectionSource`, moves Marea ambient `WildBehaviorProfile` values into authored content, and introduces the global `WildEcologyProjectionContentRegistry` plus `WildEcologyProjectionSource`, so visible actor binding, projected-site lookup, presentation-anchor resolution and loaded-Cobblemon actor assembly are shared by every registered population. Next consolidate the remaining duplicated Marea population selector, world eligibility, projection schedule, blueprint/content eligibility and ambient behavior registration into one global ecology content descriptor, so another approved region contributes one server-authored source rather than parallel registry entries."
          if text.count(marker) != 1:
              raise SystemExit(f'expected one WORLD-013 row, found {text.count(marker)}')
          if text.count(old) != 1:
              raise SystemExit(f'expected one WORLD-013 tail, found {text.count(old)}')
          updated = text.replace(old, new, 1)
          if updated == text:
              raise SystemExit('WORLD-013 update produced no change')
          path.write_text(updated)
          PY
      - name: Remove one-shot helper
        run: rm .github/workflows/one-shot-world013-plan-545.yml
      - name: Commit canonical plan update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/one-shot-world013-plan-545.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/one-shot-world013-plan-545.yml MINECRAFT_RPG_TOOLING_PLAN.md "
          git commit -m 'Record WORLD-013 PR 545'
          git push origin HEAD:world-013-plan-record-545
