name: Storm Courier Real Pose Evidence (legacy v3)

on:
  pull_request:
    paths:
      - '.github/workflows/cobblemon-storm-courier-poses.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-pose-gate-retired:
    runs-on: ubuntu-latest
    steps:
      - name: Point reviewers to Storm Courier v4 evidence
        run: |
          echo 'The v3 pose-evidence workflow is retired.'
          echo 'Storm Courier v4 official idle, battle and walking evidence is generated by .github/workflows/cobblemon-storm-courier-v4-review.yml.'
          echo 'That gate also enforces matched official camera profiles and 160px gameplay-scale review.'
