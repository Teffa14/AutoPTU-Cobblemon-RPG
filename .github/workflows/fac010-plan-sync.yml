name: FAC010 Plan Sync

on:
  push:
    branches:
      - automation/fac-010-league-registration

permissions:
  contents: write

jobs:
  sync-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical Minecraft RPG plan
        shell: python
        run: |
          from pathlib import Path

          path = Path("MINECRAFT_RPG_TOOLING_PLAN.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "| FAC-006 | TODO | Move tutor/relearner service shell. |":
                  "| FAC-006 | BLOCKED | Move tutor/relearner application remains blocked on the authoritative PTU move-learning/evolution mutation contract under RPG-007. Minecraft may present the existing read-only tutor shell, but it must not decide learnability or mutate moves. |",
              "| FAC-008 | TODO | Fast-travel unlock and destination service. |":
                  "| FAC-008 | LIVE/PARTIAL | Fast-travel unlock and destination service — PR #404 / merge `a228f771495063a1108a118e7eeeba162c9471c2`; authored destinations now require durable owner-scoped location discovery before `CanonicalFastTravelService` can authorize teleport. Additional destinations/checkpoint authoring remain follow-up work. |",
              "| FAC-009 | TODO | Daycare/nursery persistence shell. |":
                  "| FAC-009 | LIVE/PARTIAL | Daycare/nursery persistence shell — PR #407 / merge `333f23c012d88aa499cfab7d2e5bb60c38a8a693`; boxed canonical Pokemon can enter/release durable Cedar Nursery custody through owner-scoped atomic persistence. Breeding, eggs, XP, evolution, inherited moves and PTU care effects remain absent. |",
              "| FAC-010 | TODO | Gym/league challenge registration and records. |":
                  "| FAC-010 | LIVE/PARTIAL | Gym/league challenge registration and records — PR #408 / implementation head `fb452f60fb14dddbb146f2df78e5dad79d074c08`; authenticated Trainers can persist idempotent registration for the already-authored Cedar Gym Trial and inspect it alongside canonical Trainer records. Registration never starts/resolves a battle or mutates wins/losses/badges/tournaments. |",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected plan row missing: {old}")
              text = text.replace(old, new, 1)

          cmd_anchor = "| CMD-109 | LIVE/PARTIAL | `/autoptu mail claim <mailId>` — PR #401 / merge `6dc7cdeec086de809e27be9d454acf07af8710e2`; resolves the reward entirely server-side and commits it through the canonical wallet exactly once. |"
          cmd_rows = cmd_anchor + "\n| CMD-110 | LIVE/PARTIAL | `/autoptu league` — PR #408 / implementation head `fb452f60fb14dddbb146f2df78e5dad79d074c08`; authenticated read surface for durable Gym/League registrations plus already-persisted canonical Trainer record counts. |\n| CMD-111 | LIVE/PARTIAL | `/autoptu league register <challengeId>` — PR #408 / implementation head `fb452f60fb14dddbb146f2df78e5dad79d074c08`; accepts only a server-authored registration ID that resolves to an existing canonical Trainer challenge, then persists owner-scoped registration exactly once. |"
          if "| CMD-110 |" not in text:
              if cmd_anchor not in text:
                  raise SystemExit("CMD-109 anchor missing")
              text = text.replace(cmd_anchor, cmd_rows, 1)

          svc_anchor = "| SVC-046 | LIVE/PARTIAL | `inspectMail(player)` / `readMail(player, mailId)` / `claimMailReward(player, mailId)` — PR #401 / merge `6dc7cdeec086de809e27be9d454acf07af8710e2`; resolves authored mail/reward truth server-side, persists read/claim state and uses deterministic wallet transaction receipts so retry/restart cannot double-credit. |"
          svc_rows = svc_anchor + "\n| SVC-047 | LIVE/PARTIAL | `inspectLeagueRegistration(player)` / `registerLeagueChallenge(player, challengeId)` — PR #408 / implementation head `fb452f60fb14dddbb146f2df78e5dad79d074c08`; re-resolves canonical Trainer identity, validates registration metadata against the canonical Trainer challenge catalogue and persists an owner-scoped idempotent registration. Battle start, opponent selection, PTU eligibility and record mutation remain outside this boundary. |"
          if "| SVC-047 |" not in text:
              if svc_anchor not in text:
                  raise SystemExit("SVC-046 anchor missing")
              text = text.replace(svc_anchor, svc_rows, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit plan and remove one-off helper
        shell: bash
        run: |
          rm .github/workflows/fac010-plan-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/fac010-plan-sync.yml
          git commit -m "FAC-010 sync canonical Minecraft RPG plan"
          git push origin HEAD:automation/fac-010-league-registration
