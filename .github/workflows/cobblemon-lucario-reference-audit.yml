name: Lucario External Skin Reference Gate

on:
  push:
    branches:
      - 'art/lucario-reference-gate-v2'
    paths:
      - '.github/workflows/cobblemon-lucario-reference-audit.yml'
      - 'tools/cobblemon-model-review/audit_reference_package.py'
      - 'tools/cobblemon-model-review/validate_species_reference_dossier.py'
      - 'docs/cobblemon-skin-reference-dossiers/0448_lucario.json'
  pull_request:
    paths:
      - '.github/workflows/cobblemon-lucario-reference-audit.yml'
      - 'tools/cobblemon-model-review/audit_reference_package.py'
      - 'tools/cobblemon-model-review/validate_species_reference_dossier.py'
      - 'docs/cobblemon-skin-reference-dossiers/0448_lucario.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  USER_AGENT: 'Ouros-AutoPTU-Cobblemon-RPG/lucario-reference-gate-v2'

jobs:
  verify-same-species-custom-skins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic audit dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Compile reference tooling
        run: |
          python -m py_compile tools/cobblemon-model-review/audit_reference_package.py
          python -m py_compile tools/cobblemon-model-review/validate_species_reference_dossier.py

      - name: Download exact public reference packages from primary Modrinth files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .reference-audit/packages .reference-audit/reports
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A "$USER_AGENT" \
            'https://cdn.modrinth.com/data/uWyj4p7w/versions/ZakKcKn2/Lucario_Overhaul_v1.2.zip' \
            -o .reference-audit/packages/Lucario_Overhaul_v1.2.zip
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A "$USER_AGENT" \
            'https://cdn.modrinth.com/data/LizLsGI4/versions/GmEDUt5z/StylesUponStyles.v.1.5.zip' \
            -o .reference-audit/packages/StylesUponStyles.v.1.5.zip
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A "$USER_AGENT" \
            'https://cdn.modrinth.com/data/GFTKLMrj/versions/c9J7iOYZ/Failskins4.21%20for%20Cobblemon%201.7.zip' \
            -o '.reference-audit/packages/Failskins4.21 for Cobblemon 1.7.zip'

      - name: Pin package SHA-256 before inspection
        shell: bash
        run: |
          set -euo pipefail
          echo '00252b222d3f1aee73b45ccab1e9519266288b3d51d6f5507401f0d2a0fd3b10  .reference-audit/packages/Lucario_Overhaul_v1.2.zip' | sha256sum --check --strict
          echo '6bb9124fd2be0d48c3158716887be8da48cec6434fdf3a758e8bdd93e40b2a3d  .reference-audit/packages/StylesUponStyles.v.1.5.zip' | sha256sum --check --strict
          echo 'ee5dd844e4bdac5972e153f2cf7a31b2737b8f5efc907f42e918e11287bba8c6  .reference-audit/packages/Failskins4.21 for Cobblemon 1.7.zip' | sha256sum --check --strict

      - name: Audit actual Lucario MODEL TEXTURE animation poser resolver assets
        shell: bash
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/audit_reference_package.py \
            .reference-audit/packages/Lucario_Overhaul_v1.2.zip \
            --species lucario --project 'Lucario Overhaul' --version '1.2 / ZakKcKn2' \
            --source-url 'https://modrinth.com/datapack/lucario-overhaul/version/ZakKcKn2' \
            --output .reference-audit/reports/lucario-overhaul.json
          python tools/cobblemon-model-review/audit_reference_package.py \
            .reference-audit/packages/StylesUponStyles.v.1.5.zip \
            --species lucario --project 'Styles Upon Styles - Cobblemon Costume Pack' --version '1.5 / GmEDUt5z' \
            --source-url 'https://modrinth.com/datapack/styles-upon-styles/version/1.5' \
            --output .reference-audit/reports/styles-upon-styles.json
          python tools/cobblemon-model-review/audit_reference_package.py \
            '.reference-audit/packages/Failskins4.21 for Cobblemon 1.7.zip' \
            --species lucario --project 'Cobblemon FailSkins' --version '4.21 / c9J7iOYZ' \
            --source-url 'https://modrinth.com/datapack/cobblemon-failskins/version/c9J7iOYZ' \
            --output .reference-audit/reports/failskins.json

      - name: Cross-check dossier paths and hashes against downloaded package bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          dossier = json.loads(Path('docs/cobblemon-skin-reference-dossiers/0448_lucario.json').read_text())
          report_paths = {
              'Lucario Overhaul': Path('.reference-audit/reports/lucario-overhaul.json'),
              'Styles Upon Styles - Cobblemon Costume Pack': Path('.reference-audit/reports/styles-upon-styles.json'),
              'Cobblemon FailSkins': Path('.reference-audit/reports/failskins.json'),
          }

          for ref in dossier['references']:
              project = ref['project']
              if project not in report_paths:
                  raise SystemExit(f'no reproducible package audit configured for project: {project}')
              report = json.loads(report_paths[project].read_text())
              if report['packageSha256'] != ref['auditPackage']['sha256']:
                  raise SystemExit(f'{ref["referenceId"]}: package SHA mismatch')
              actual = {(item['path'], item['sha256']) for item in report['matchingFiles']}
              for asset in ref['assetFilesInspected']:
                  pair = (asset['path'], asset['sha256'])
                  if pair not in actual:
                      raise SystemExit(f'{ref["referenceId"]}: dossier asset not proven by package audit: {pair}')
              print(ref['referenceId'], 'package-and-assets=PASS')
          PY

      - name: Enforce strict three-reference custom-geometry dossier gate
        run: |
          python tools/cobblemon-model-review/validate_species_reference_dossier.py \
            docs/cobblemon-skin-reference-dossiers/0448_lucario.json \
            --expected-species lucario

      - name: Upload metadata-only audit reports
        uses: actions/upload-artifact@v4
        with:
          name: lucario-reference-gate-v2-audit
          path: .reference-audit/reports
          if-no-files-found: error
          retention-days: 14
