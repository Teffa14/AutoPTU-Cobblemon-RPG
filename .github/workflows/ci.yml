name: Integration Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare test evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-evidence/runtime test-evidence/visual
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
          } > test-evidence/run-metadata.txt
      - name: Run authority tests
        shell: bash
        run: |
          set -euo pipefail
          gradle test --no-daemon 2>&1 | tee test-evidence/gradle-test.log
      - name: Prepare production Fabric + Cobblemon smoke mods
        shell: bash
        run: |
          set -euo pipefail
          gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon 2>&1 | tee test-evidence/prepare-production-smoke.log
      - name: Boot production Fabric + Cobblemon dedicated server twice
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/fabric-production-smoke"
          mkdir -p "$server_dir/mods"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.18.2/1.1.0/server/jar'

          server_pid=""
          stop_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
          }
          cleanup() {
            stop_server
          }
          trap cleanup EXIT

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.liveRelocationSmoke=true \
              -Dautoptu.liveHealthSmoke=true \
              -Dautoptu.liveBattleInterceptionSmoke=true \
              -Dautoptu.liveAuthenticatedPlayerContextSmoke=true \
              -Dautoptu.liveHealingStationSmoke=true \
              -Dautoptu.liveFastTravelSmoke=true \
              -Dautoptu.liveInnRestSmoke=true \
              -Dautoptu.liveMoveTutorSmoke=true \
              -Dautoptu.liveRpgProtectionSmoke=true \
              -Dautoptu.liveCraftingWorkstationSmoke=true \
              -Dautoptu.liveMareaWildPresenceSmoke=true \
              -Dautoptu.liveCanonicalStoreRestartSmoke=seed \
              -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../fabric-server-smoke-first.log 2>&1
          ) &
          server_pid=$!

          first_ready=0
          for _ in $(seq 1 180); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU Fabric server adapter initialized' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Cobblemon runtime detected:' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon relocation smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon HP projection smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon battle interception smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live authenticated player context smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon healing machine reuse smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Minecraft lodestone fast travel surface smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live namespaced PTU recovery bed smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live canonical move tutor shell smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live RPG actor damage protection smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live canonical crafting workstation smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Marea wild presence reconciliation smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live canonical player store seed smoke passed' "$latest" 2>/dev/null \
              && grep -q 'Done (' "$latest" 2>/dev/null; then
              first_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$first_ready" -ne 1 ]; then
            cat fabric-server-smoke-first.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          cp "$server_dir/logs/latest.log" "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical move tutor shell smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical crafting workstation smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Marea wild presence reconciliation smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical player store seed smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          stop_server

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.liveCanonicalStoreRestartSmoke=verify \
              -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../fabric-server-smoke-restart.log 2>&1
          ) &
          server_pid=$!

          second_ready=0
          for _ in $(seq 1 180); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU Fabric server adapter initialized' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Cobblemon runtime detected:' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live canonical player store restart smoke passed' "$latest" 2>/dev/null \
              && grep -q 'Done (' "$latest" 2>/dev/null; then
              second_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$second_ready" -ne 1 ]; then
            cat fabric-server-smoke-restart.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          cp "$server_dir/logs/latest.log" "$server_dir/autoptu-second-boot-latest.log"
          grep 'AutoPTU live Cobblemon relocation smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Cobblemon HP projection smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Cobblemon battle interception smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live authenticated player context smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Cobblemon healing machine reuse smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Minecraft lodestone fast travel surface smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live namespaced PTU recovery bed smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical move tutor shell smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live RPG actor damage protection smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical crafting workstation smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Marea wild presence reconciliation smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical player store restart smoke passed' "$server_dir/autoptu-second-boot-latest.log"
      - name: Collect runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p test-evidence/runtime
          cp fabric-server-smoke-first.log test-evidence/runtime/fabric-server-smoke-first.log 2>/dev/null || true
          cp fabric-server-smoke-restart.log test-evidence/runtime/fabric-server-smoke-restart.log 2>/dev/null || true
          cp fabric-production-smoke/autoptu-first-boot-latest.log test-evidence/runtime/minecraft-first-boot-latest.log 2>/dev/null || true
          cp fabric-production-smoke/autoptu-second-boot-latest.log test-evidence/runtime/minecraft-second-boot-latest.log 2>/dev/null || true
          cp fabric-production-smoke/logs/debug.log test-evidence/runtime/minecraft-second-boot-debug.log 2>/dev/null || true

          first="fabric-production-smoke/autoptu-first-boot-latest.log"
          second="fabric-production-smoke/autoptu-second-boot-latest.log"
          manifest="test-evidence/runtime/smoke-markers.txt"
          : > "$manifest"
          record_marker() {
            file="$1"
            marker="$2"
            if [ -f "$file" ] && grep -F "$marker" "$file" >> "$manifest"; then
              true
            else
              echo "MISSING: $marker" >> "$manifest"
            fi
          }
          record_marker "$first" 'AutoPTU Fabric server adapter initialized'
          record_marker "$first" 'AutoPTU Cobblemon runtime detected:'
          record_marker "$first" 'AutoPTU live Cobblemon relocation smoke passed'
          record_marker "$first" 'AutoPTU live Cobblemon HP projection smoke passed'
          record_marker "$first" 'AutoPTU live Cobblemon battle interception smoke passed'
          record_marker "$first" 'AutoPTU live authenticated player context smoke passed'
          record_marker "$first" 'AutoPTU live Cobblemon healing machine reuse smoke passed'
          record_marker "$first" 'AutoPTU live Minecraft lodestone fast travel surface smoke passed'
          record_marker "$first" 'AutoPTU live namespaced PTU recovery bed smoke passed'
          record_marker "$first" 'AutoPTU live canonical move tutor shell smoke passed'
          record_marker "$first" 'AutoPTU live RPG actor damage protection smoke passed'
          record_marker "$first" 'AutoPTU live canonical crafting workstation smoke passed'
          record_marker "$first" 'AutoPTU live Marea wild presence reconciliation smoke passed'
          record_marker "$first" 'AutoPTU live canonical player store seed smoke passed'
          record_marker "$first" 'Done ('
          record_marker "$second" 'AutoPTU Fabric server adapter initialized'
          record_marker "$second" 'AutoPTU Cobblemon runtime detected:'
          record_marker "$second" 'AutoPTU live canonical player store restart smoke passed'
          record_marker "$second" 'Done ('

          cat > test-evidence/visual/README.txt <<'EOF'
          Visual evidence belongs here when a test runs with a graphical Minecraft client.
          Store MP4 recordings and PNG screenshots in this directory. The CI artifact upload
          step collects them automatically. Dedicated-server smokes are headless, so they
          produce runtime logs and marker evidence rather than video.
          EOF
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-evidence/**
            build/test-results/test/**
            build/reports/tests/test/**
            fabric-adapter/build/test-results/test/**
            fabric-adapter/build/reports/tests/test/**
