name: One-shot WORLD-013 plan bookkeeping

on:
  push:
    branches:
      - world-013-plan-654

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-plan-654
      - name: Record shipped dormant WILD damage shield
        shell: python
        run: |
          from pathlib import Path

          path = Path("MINECRAFT_RPG_TOOLING_PLAN.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          marker = "| WORLD-013 | NEXT/PARTIAL |"
          record = (
              "PR #654 / merge `73a5dc2275df10c26066e6edae3e35e2909af343` protects dormant or otherwise interaction-inactive canonical WILD presentation actors from vanilla/environmental Minecraft damage, restores each actor's prior invulnerability policy on reactivation or projection release, and keeps restoration snapshots dimension-scoped without deriving PTU damage, HP or outcomes. "
          )
          matches = [i for i, line in enumerate(lines) if line.startswith(marker)]
          if len(matches) != 1:
              raise SystemExit(f"expected one WORLD-013 row, found {len(matches)}")
          index = matches[0]
          if "PR #654 / merge `73a5dc2275df10c26066e6edae3e35e2909af343`" in lines[index]:
              raise SystemExit("WORLD-013 already records PR #654; refusing duplicate edit")
          if not lines[index].endswith(" |"):
              raise SystemExit("WORLD-013 row has unexpected ending; refusing broad edit")
          lines[index] = lines[index][:-2] + " " + record + "|"
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Remove one-shot workflow and commit exact plan edit
        run: |
          rm .github/workflows/one-shot-world-013-plan-654.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/one-shot-world-013-plan-654.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Record WORLD-013 PR #654"
          git push origin HEAD:world-013-plan-654
