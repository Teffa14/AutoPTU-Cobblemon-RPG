name: Lucario V7 Candidate Materialize

on:
  push:
    branches:
      - art/lucario-aura-sentinel-v5-resonance-ronin

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[lucario-v7-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate same-species reference gate before geometry
        run: python tools/cobblemon-model-review/validate_species_reference_dossier.py docs/cobblemon-skin-reference-dossiers/0448_lucario.json --expected-species lucario
      - name: Materialize deterministic V7 production bytes
        run: python tools/cobblemon-model-review/build_aura_sentinel_resonance_ronin_v7.py --bootstrap
      - name: Commit exact generated candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cobblemon-skin-review-manifests/0448_lucario.json \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0448_lucario/90_ouros_aura_sentinel.json \
            fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0448_lucario/ouros_aura_sentinel_accessories.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Art: materialize Lucario Resonance Ronin V7 [lucario-v7-materialized]'
          git push origin HEAD:${GITHUB_REF_NAME}
