name: Inspect Public Gengar CC0 Reference Assets

on:
  push:
    branches:
      - 'art/gengar-overtime-reference-inspection'
    paths:
      - '.github/workflows/cobblemon-gengar-meshy-reference-discovery.yml'
      - 'tools/cobblemon-model-review/inspect_external_glb_reference.py'
  pull_request:
    paths:
      - '.github/workflows/cobblemon-gengar-meshy-reference-discovery.yml'
      - 'tools/cobblemon-model-review/inspect_external_glb_reference.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: mars-attack
            id: 019d9f8c-4884-7c4b-97d9-e42baa48df79
            title: Gengar Mars Attack
          - slug: gumball-machine
            id: 0199e7ee-f19d-7a8e-83c7-5b32f8b24b92
            title: Gengar Gumball Machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch exact public community page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .external/${{ matrix.slug }}
          curl --fail --silent --show-error --location --retry 3 \
            -A 'Mozilla/5.0 Ouros-Reference-Research' \
            "https://www.meshy.ai/3d-models/${{ matrix.id }}" \
            -o .external/${{ matrix.slug }}/page.html

      - name: Prove page identity and explicit CC0 marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re
          from pathlib import Path
          slug='${{ matrix.slug }}'; model_id='${{ matrix.id }}'; expected_title='${{ matrix.title }}'
          raw=Path(f'.external/{slug}/page.html').read_text(encoding='utf-8',errors='replace')
          text=html.unescape(raw).replace('\\u0026','&').replace('\\/','/')
          compact=re.sub(r'\\+"','"',text)
          evidence={
            'modelId':model_id,
            'expectedTitle':expected_title,
            'titlePresent':expected_title.casefold() in compact.casefold(),
            'modelIdPresent':model_id in compact,
            'explicitLicenseFieldCC0':bool(re.search(r'(?i)(?:"license"|license)\s*[:=]\s*["\']?CC0\b',compact)),
            'cc0TokenCount':len(re.findall(r'(?i)\bCC0\b',compact)),
            'sourceUrl':f'https://www.meshy.ai/3d-models/{model_id}'
          }
          Path(f'.external/{slug}/page-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          assert evidence['titlePresent'] and evidence['modelIdPresent']
          assert evidence['explicitLicenseFieldCC0'], 'exact page did not expose explicit CC0 license field'
          PY

      - name: Extract exact signed model-manifest and texture URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re
          from pathlib import Path
          from urllib.parse import urlsplit
          slug='${{ matrix.slug }}'; model_id='${{ matrix.id }}'
          raw=Path(f'.external/{slug}/page.html').read_text(encoding='utf-8',errors='replace')
          text=html.unescape(raw).replace('\\u0026','&').replace('\\/','/')
          urls=[]
          for match in re.findall(r'https?://[^"\'<>\\\s]+',text):
            url=match.rstrip('),;]}')
            if model_id in url and url not in urls: urls.append(url)
          def p(url): return urlsplit(url).path.lower()
          model_json=[u for u in urls if p(u).endswith('/model.json')]
          model_meshy=[u for u in urls if p(u).endswith('/model.meshy')]
          model_formats=[u for u in urls if p(u).endswith(('.glb','.obj','.fbx','.stl','.usdz'))]
          base_texture=[u for u in urls if p(u).endswith('/texture_0.png')]
          preview=[u for u in urls if p(u).endswith('/preview.png')]
          report={'modelJsonUrls':model_json,'modelMeshyUrls':model_meshy,'directFormatUrls':model_formats,'baseColorTextureUrls':base_texture,'previewUrls':preview}
          Path(f'.external/{slug}/asset-urls.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert model_json and model_meshy and base_texture, 'public page did not expose required model manifest/model.meshy/texture URLs'
          Path(f'.external/{slug}/model-json.url').write_text(model_json[0])
          Path(f'.external/{slug}/model-meshy.url').write_text(model_meshy[0])
          Path(f'.external/{slug}/texture.url').write_text(base_texture[0])
          if preview: Path(f'.external/{slug}/preview.url').write_text(preview[0])
          PY

      - name: Download actual public model manifests and texture bytes
        shell: bash
        run: |
          set -euo pipefail
          dir='.external/${{ matrix.slug }}'
          ua='Mozilla/5.0 Ouros-Reference-Research'
          curl --fail --silent --show-error --location --retry 3 -A "$ua" "$(cat "$dir/model-json.url")" -o "$dir/model.json"
          curl --fail --silent --show-error --location --retry 3 -A "$ua" "$(cat "$dir/model-meshy.url")" -o "$dir/model.meshy"
          curl --fail --silent --show-error --location --retry 3 -A "$ua" "$(cat "$dir/texture.url")" -o "$dir/texture_0.png"
          if test -f "$dir/preview.url"; then curl --fail --silent --show-error --location --retry 3 -A "$ua" "$(cat "$dir/preview.url")" -o "$dir/preview.png"; fi
          sha256sum "$dir/model.json" "$dir/model.meshy" "$dir/texture_0.png" | tee "$dir/source-hashes.txt"
          file "$dir/model.json" "$dir/model.meshy" "$dir/texture_0.png" | tee "$dir/file-types.txt"

      - name: Inspect actual model manifest structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          slug='${{ matrix.slug }}'; root=Path(f'.external/{slug}')
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def walk(obj, depth=0, out=None):
            if out is None: out={}
            if depth>8: return out
            if isinstance(obj,dict):
              for k,v in obj.items():
                key=str(k)
                low=key.casefold()
                if any(t in low for t in ('mesh','vert','position','indice','face','triangle','buffer','material','texture','model','node','primitive','accessor','url')):
                  out[key]=out.get(key,0)+1
                walk(v,depth+1,out)
            elif isinstance(obj,list):
              for v in obj[:10000]: walk(v,depth+1,out)
            return out
          result={'files':{}}
          jp=root/'model.json'; mp=root/'model.meshy'; tp=root/'texture_0.png'
          jbytes=jp.read_bytes(); mbytes=mp.read_bytes(); tbytes=tp.read_bytes()
          result['files']['model.json']={'size':len(jbytes),'sha256':sha(jp),'first16Hex':jbytes[:16].hex()}
          result['files']['model.meshy']={'size':len(mbytes),'sha256':sha(mp),'first16Hex':mbytes[:16].hex()}
          result['files']['texture_0.png']={'size':len(tbytes),'sha256':sha(tp),'pngSignature':tbytes[:8].hex()}
          try:
            payload=json.loads(jbytes.decode('utf-8'))
            result['modelJson']={
              'topLevelKeys':list(payload)[:100] if isinstance(payload,dict) else [],
              'interestingKeyCounts':walk(payload),
              'isGltfJson':isinstance(payload,dict) and isinstance(payload.get('asset'),dict) and isinstance(payload.get('meshes'),list),
              'meshCount':len(payload.get('meshes',[])) if isinstance(payload,dict) and isinstance(payload.get('meshes'),list) else None,
              'nodeCount':len(payload.get('nodes',[])) if isinstance(payload,dict) and isinstance(payload.get('nodes'),list) else None,
              'accessorCount':len(payload.get('accessors',[])) if isinstance(payload,dict) and isinstance(payload.get('accessors'),list) else None,
              'bufferCount':len(payload.get('buffers',[])) if isinstance(payload,dict) and isinstance(payload.get('buffers'),list) else None,
            }
          except Exception as exc:
            result['modelJson']={'parseError':str(exc)}
          magic=mbytes[:4]
          result['modelMeshy']={'isGLB':magic==b'glTF','isZip':magic[:2]==b'PK','looksJson':mbytes.lstrip()[:1] in (b'{',b'[')}
          if result['modelMeshy']['looksJson']:
            try:
              payload=json.loads(mbytes.decode('utf-8'))
              result['modelMeshy']['topLevelKeys']=list(payload)[:100] if isinstance(payload,dict) else []
              result['modelMeshy']['interestingKeyCounts']=walk(payload)
            except Exception as exc: result['modelMeshy']['parseError']=str(exc)
          out=root/'manifest-inspection.json'; out.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          assert tbytes[:8]==b'\x89PNG\r\n\x1a\n'
          assert len(jbytes)>100 and len(mbytes)>100
          PY

      - name: Upload metadata-only inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gengar-${{ matrix.slug }}-reference-inspection
          path: |
            .external/${{ matrix.slug }}/page-evidence.json
            .external/${{ matrix.slug }}/asset-urls.json
            .external/${{ matrix.slug }}/source-hashes.txt
            .external/${{ matrix.slug }}/file-types.txt
            .external/${{ matrix.slug }}/manifest-inspection.json
          if-no-files-found: warn
          retention-days: 30
