name: Temporary WORLD-013 plan bookkeeping

on:
  push:
    branches:
      - world-013-calm-corridor-intent

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-calm-corridor-intent
          fetch-depth: 0
      - name: Patch canonical plan and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('| WORLD-013 | NEXT/PARTIAL |')]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one WORLD-013 NEXT/PARTIAL row, found {len(matches)}')
          i = matches[0]
          if 'PR #521' not in lines[i]:
              if not lines[i].endswith(' |'):
                  raise SystemExit('WORLD-013 row does not have expected markdown row ending')
              addition = (
                  ' PR #519 / implementation head `18cc1712a2371c88eb3da747a6dfc61c46056176` adds deterministic canonical reciprocal presentation yield when two active CALM wild actors approach head-on, selecting exactly one yielding actor from canonical encounter identity without PTU initiative or movement rules.'
                  ' PR #520 / implementation head `43323508a007ca1aab0835a2a63ab492dc97ce3e` stabilizes that reciprocal yield with a server-owned lease retained while the same peer occupies the forward corridor, with a 40-tick hard cap and immediate release when the canonical presentation conflict clears.'
                  ' PR #521 / implementation head `f9b259c306a90b03f5a91b8e59ce80cdbeab1138` publishes short-lived server-owned CALM movement corridors from observed presentation velocity and yields on future non-parallel corridor conflicts before actor bounding boxes contact; the lease remains stable while the peer physically occupies or still claims the shared corridor, without changing encounter identity, habitat authority or any PTU rule.'
              )
              lines[i] = lines[i][:-2] + addition + ' |'
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/tmp-world-013-plan-bookkeeping.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/tmp-world-013-plan-bookkeeping.yml
          git diff --cached --check
          git commit -m 'Record WORLD-013 corridor coordination in tooling plan'
          git push origin HEAD:world-013-calm-corridor-intent
