name: Inspect Official Cobblemon Greninja

on:
  push:
    branches: ['feat/greninja-shadow-tide']
    paths:
      - '.github/workflows/cobblemon-inspect-greninja.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-greninja-${{ github.ref }}
  cancel-in-progress: true

env:
  COBBLEMON_VERSION_ID: kF7CvxTo

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download latest stable compatible official Cobblemon JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .official-source docs/cobblemon-skins/0658_greninja
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Greninja-Inspection' \
            'https://api.modrinth.com/v2/project/cobblemon/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D' -o .official-source/versions.json
          python - <<'PY'
          import json
          versions=json.load(open('.official-source/versions.json',encoding='utf-8'))
          releases=sorted((v for v in versions if v.get('version_type')=='release'),key=lambda v:v['date_published'],reverse=True)
          assert releases and releases[0]['id']=='kF7CvxTo', (releases[0]['id'],releases[0]['version_number'])
          PY
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Greninja-Inspection' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .official-source/version.json
          python - <<'PY' > .official-source/download.env
          import json,shlex
          d=json.load(open('.official-source/version.json',encoding='utf-8'))
          assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1'] and 'fabric' in d['loaders']
          p=next(f for f in d['files'] if f.get('primary'))
          assert p['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL='+shlex.quote(p['url']))
          print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .official-source/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .official-source/cobblemon.jar
          printf '%s  %s\n' "$SHA512" .official-source/cobblemon.jar | sha512sum --check --strict
      - name: Inspect exact Greninja assets and referenced JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          jar=Path('.official-source/cobblemon.jar')
          version=json.loads(Path('.official-source/version.json').read_text(encoding='utf-8'))
          primary=next(f for f in version['files'] if f.get('primary'))
          out={'latest_compatible_release':{'VERSION_ID':version['id'],'VERSION_NUMBER':version['version_number'],'FILE_NAME':primary['filename'],'SHA512':primary['hashes']['sha512'],'URL':primary['url']},'matching_paths':[],'reference_json_paths':[],'models':[],'animations':[],'posers':[],'resolvers':[],'textures':[],'license_candidates':[]}
          with zipfile.ZipFile(jar) as z:
            names=z.namelist()
            matches=[n for n in names if ('0658_greninja' in n.lower() or '/greninja' in n.lower())]
            out['matching_paths']=matches
            assert matches, 'No Greninja assets found in official JAR'
            # Find any JSON whose content references greninja. This catches shared/global poser tables.
            refs=[]
            for n in names:
              if not n.lower().endswith('.json'): continue
              try: raw=z.read(n); text=raw.decode('utf-8')
              except Exception: continue
              if 'greninja' in text.lower() or '0658_greninja' in text.lower(): refs.append(n)
            out['reference_json_paths']=refs
            candidate_paths=sorted(set(matches+refs))
            for n in candidate_paths:
              raw=z.read(n); sha=hashlib.sha256(raw).hexdigest(); low=n.lower()
              if low.endswith('.geo.json'):
                data=json.loads(raw)
                for g in data.get('minecraft:geometry',[]):
                  bones=g.get('bones',[])
                  out['models'].append({'path':n,'sha256':sha,'identifier':g.get('description',{}).get('identifier'),'texture_width':g.get('description',{}).get('texture_width'),'texture_height':g.get('description',{}).get('texture_height'),'bone_count':len(bones),'bones':[{'name':b.get('name'),'parent':b.get('parent'),'pivot':b.get('pivot')} for b in bones]})
              elif low.endswith('.animation.json'):
                try: data=json.loads(raw); out['animations'].append({'path':n,'sha256':sha,'names':list(data.get('animations',{}).keys())})
                except Exception: pass
              elif ('/posers/' in low or 'poser' in low) and low.endswith('.json'):
                try: out['posers'].append({'path':n,'sha256':sha,'json':json.loads(raw)})
                except Exception: pass
              elif '/resolvers/' in low and low.endswith('.json'):
                try: out['resolvers'].append({'path':n,'sha256':sha,'json':json.loads(raw)})
                except Exception: pass
              elif '/textures/' in low and low.endswith('.png'):
                out['textures'].append({'path':n,'sha256':sha,'size_bytes':len(raw)})
            for n in names:
              low=n.lower()
              if '0658_greninja' in low and 'license' in low:
                raw=z.read(n); out['license_candidates'].append({'path':n,'sha256':hashlib.sha256(raw).hexdigest()})
            # PNGs are binary and won't appear in JSON reference scan, so add direct species texture matches explicitly.
            for n in matches:
              if '/textures/' in n.lower() and n.lower().endswith('.png'):
                raw=z.read(n); item={'path':n,'sha256':hashlib.sha256(raw).hexdigest(),'size_bytes':len(raw)}
                if item not in out['textures']: out['textures'].append(item)
          assert out['models'], 'official Greninja model missing'
          assert out['resolvers'], 'official Greninja resolver missing'
          assert out['textures'], 'official Greninja texture missing'
          Path('docs/cobblemon-skins/0658_greninja/official-source-inspection.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print('models',[(x['path'],x['bone_count']) for x in out['models']])
          print('animations',[(x['path'],len(x['names'])) for x in out['animations']])
          print('posers',[x['path'] for x in out['posers']])
          print('resolvers',[x['path'] for x in out['resolvers']])
          print('textures',[x['path'] for x in out['textures']])
          print('refs',refs)
          PY
      - name: Commit inspection evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cobblemon-skins/0658_greninja/official-source-inspection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Evidence: record official Cobblemon Greninja source'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
