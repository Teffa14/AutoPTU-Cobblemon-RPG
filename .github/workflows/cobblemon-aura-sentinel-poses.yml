name: Aura Sentinel Real Blockbench Evidence (legacy v1)

on:
  pull_request:
    paths:
      - '.github/workflows/cobblemon-aura-sentinel-poses.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-aura-evidence-retired:
    runs-on: ubuntu-latest
    steps:
      - name: Point reviewers to Aura Sentinel v2 evidence
        run: |
          echo 'Aura Sentinel v1 accessory-first evidence is retired under the full-transformation art standard.'
          echo 'Use .github/workflows/cobblemon-aura-sentinel-v2-review.yml.'
          echo 'The v2 gate validates the exact official Lucario source, full-surface normal/shiny textures, matched-camera Blockbench hero/battle/four-view evidence, and 160px gameplay readability.'
