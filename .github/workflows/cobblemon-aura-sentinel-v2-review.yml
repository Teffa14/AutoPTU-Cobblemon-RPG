name: Aura Sentinel V2 Full Transformation Review (superseded first pass)

on:
  pull_request:
    paths:
      - '.github/workflows/cobblemon-aura-sentinel-v2-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-v2-pass-superseded:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'The first Aura Sentinel v2 Blockbench pass was structurally valid but rejected by human art review because its gameplay silhouette remained too close to base Lucario.'
          echo 'Use .github/workflows/cobblemon-aura-sentinel-v2-refined-review.yml for the refined macro-silhouette pass.'
