name: Omen Regent Blockbench Review V3
on:
  push:
    branches: ['feat/absol-omen-regent']
    paths: ['.github/workflows/cobblemon-omen-regent-review-v3.yml']
  workflow_dispatch:
permissions: {contents: write}
env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  BLOCKBENCH_VERSION: 5.1.6
  BLOCKBENCH_SHA256: c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64 >/dev/null
      - name: Fetch exact official source and Blockbench
        shell: bash
        run: |
          set -euo pipefail; mkdir -p .pose/official
          curl --fail --silent --show-error --location "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .pose/v.json
          python - <<'PY' > .pose/e
          import json,shlex
          d=json.load(open('.pose/v.json')); p=next(x for x in d['files'] if x.get('primary')); assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1']; print('URL='+shlex.quote(p['url'])); print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .pose/e; curl --fail --silent --show-error --location "$URL" -o .pose/c.jar; printf '%s  %s\n' "$SHA512" .pose/c.jar | sha512sum --check --strict
          unzip -p .pose/c.jar 'assets/cobblemon/bedrock/pokemon/models/0359_absol/absol.geo.json' > .pose/official/absol.geo.json
          unzip -p .pose/c.jar 'assets/cobblemon/bedrock/pokemon/animations/0359_absol/absol.animation.json' > .pose/official/absol.animation.json
          unzip -p .pose/c.jar 'assets/cobblemon/textures/pokemon/0359_absol/absol.png' > .pose/official/absol.png
          test "$(sha256sum .pose/official/absol.geo.json|awk '{print $1}')" = ed8b82b60caaeb0ee8b97597b5bd194a52d52d671da7bbc0eb35aa8dd864d462
          python tools/cobblemon-model-review/validate_original_model.py --official .pose/official/absol.geo.json --candidate fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json
          python - <<'PY'
          from PIL import Image
          b=Image.open('.pose/official/absol.png').convert('RGBA'); o=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png').convert('RGBA'); Image.alpha_composite(b,o).save('.pose/omen.png',optimize=True)
          PY
          curl --fail --silent --show-error --location "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" -o .pose/b.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" .pose/b.AppImage | sha256sum --check --strict; chmod +x .pose/b.AppImage; (cd .pose && ./b.AppImage --appimage-extract >/dev/null)
      - name: Render official and implemented states
        shell: bash
        run: |
          set -euo pipefail; root="$PWD/test-evidence/visual/cobblemon-skins/0359_absol/omen-regent-real-poses"; rm -rf "$root" .pose/renders; mkdir -p "$root" .pose/renders
          cleanup(){ p="${1:-}"; [ -z "$p" ] || { kill "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true; }; pkill -f "$PWD/.pose/squashfs-root/blockbench" 2>/dev/null || true; pkill -f "$PWD/.pose/squashfs-root/AppRun" 2>/dev/null || true; sleep 2; }
          once(){ model="$1"; tex="$2"; anim="$3"; tm="$4"; out="$5"; port="$6"; tag="$7"; n="$8"; ud="$PWD/.pose/u-${tag}-${n}"; log="$PWD/.pose/${tag}-${n}.log"; rm -rf "$ud" "$out"; mkdir -p "$ud" "$out"; xvfb-run -a -s '-screen 0 1600x1200x24' env APPDIR="$PWD/.pose/squashfs-root" .pose/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$ud" "$model" > "$log" 2>&1 & pid=$!; ready=0; for _ in $(seq 1 90); do if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi; if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; cleanup "$pid"; return 1; fi; sleep 1; done; [ "$ready" = 1 ] || { cat "$log"; cleanup "$pid"; return 1; }; node tools/cobblemon-model-review/blockbench_capture.mjs --endpoint "http://127.0.0.1:${port}" --texture "$tex" --animation "$PWD/.pose/official/absol.animation.json" --animation-name "$anim" --animation-time "$tm" --output-dir "$out" || { cat "$log"; cleanup "$pid"; return 1; }; cleanup "$pid"; }
          render(){ for n in 1 2 3; do once "$1" "$2" "$3" "$4" "$5" "$6" "$7" "$n" && return 0; done; return 1; }
          off="$PWD/.pose/official/absol.geo.json"; skin="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json"; render "$off" "$PWD/.pose/official/absol.png" animation.absol.ground_idle .35 "$PWD/.pose/renders/off" 9281 off; render "$skin" "$PWD/.pose/omen.png" animation.absol.ground_idle .35 "$PWD/.pose/renders/hero" 9282 hero; render "$skin" "$PWD/.pose/omen.png" animation.absol.cry .25 "$PWD/.pose/renders/cry" 9283 cry
          cp .pose/renders/off/three_quarter.png "$root/official_reference_three_quarter.png"; cp .pose/renders/hero/three_quarter.png "$root/hero_three_quarter.png"; cp .pose/renders/cry/three_quarter.png "$root/cry_three_quarter.png"; cp .pose/renders/hero/front.png "$root/hero_front.png"; cp .pose/renders/hero/left.png "$root/hero_left.png"; cp .pose/renders/hero/right.png "$root/hero_right.png"; cp .pose/renders/hero/back.png "$root/hero_back.png"
      - name: Validate and record evidence
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path('test-evidence/visual/cobblemon-skins/0359_absol/omen-regent-real-poses'); names=['official_reference_three_quarter.png','hero_three_quarter.png','cry_three_quarter.png','hero_front.png','hero_left.png','hero_right.png','hero_back.png']; hs={}
          for n in names:
           p=root/n; im=Image.open(p).convert('RGBA'); assert im.size==(1024,1024) and im.getbbox(); hs[n]=hashlib.sha256(p.read_bytes()).hexdigest()
          meta=json.loads(Path('docs/cobblemon-skins/0359_absol/omen-regent-build-metadata.json').read_text()); assert meta['originalBoneCount']==73 and meta['derivedBoneCount']==81 and meta['artPass']=='v2-epic-silhouette'
          m={'format':'ouros.cobblemon-blockbench-pose-evidence.v1','viewer':'Blockbench 5.1.6','modelSource':'Cobblemon 1.7.3 Fabric JAR / kF7CvxTo','officialModelSha256':'ed8b82b60caaeb0ee8b97597b5bd194a52d52d671da7bbc0eb35aa8dd864d462','originalBoneCount':73,'derivedBoneCount':81,'artPass':'v2','poses':{'hero':{'animation':'animation.absol.ground_idle','time':0.35},'cry':{'animation':'animation.absol.cry','time':0.25}},'walkingEvidence':'omitted: q.quadruped_walk is procedural','battleEvidence':'omitted: no official battle pose/clip','files':hs}; (root/'pose-metadata.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: omen-regent-v2-real-poses, path: test-evidence/visual/cobblemon-skins/0359_absol/omen-regent-real-poses, retention-days: 14}
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add test-evidence/visual/cobblemon-skins/0359_absol/omen-regent-real-poses; git commit -m 'Evidence: refresh Omen Regent v2 renders' || exit 0; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin HEAD:"${GITHUB_REF_NAME}"
