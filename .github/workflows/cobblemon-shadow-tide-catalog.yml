name: Stage Shadow Tide Catalog Entry
on:
  push:
    branches: ['feat/greninja-shadow-tide']
    paths: ['.github/workflows/cobblemon-shadow-tide-catalog.yml']
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Insert catalog entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/cobblemon-skin-catalog.md'); s=p.read_text()
          if '## 0658 Greninja — Shadow Tide' not in s:
              entry='''## 0658 Greninja — Shadow Tide\n\nStatus: EPIC V2 ACCEPTED IN BLOCKBENCH — repository-wide PR gates pending\n\nShadow Tide is derived independently from the exact normal Greninja (78 bones) and Ash-Greninja (81 bones) geometries distributed in Cobblemon 1.7.3. Eight cosmetic groups produce 86 and 89 bones respectively, with 60 cosmetic cubes in the accepted v2. All original bones remain JSON-equivalent and in order.\n\nThe first structurally valid pass was rejected after direct Blockbench review because its three-quarter silhouette remained too close to standard Greninja. V2 adds a dominant asymmetric executioner tide-glaive, heavier split mantle, open crescent cowl, tide-core gorget, asymmetric pauldrons and bracers. Normal hero, battle idle and ground walk remain motion-safe in real Blockbench 5.1.6 evidence. The overlay occupies only `(0..7,63)`, proven free in both official geometry UV layouts.\n\nThe official base resolver exposes only normal and shiny presentation variations; Battle Bond is a separate official species feature and Greninja uses a code-backed model class. This cosmetic preserves the official resolver scope and does not invent Ash/Battle Bond battle-state routing. A separately derived Ash model is retained for anatomy/form parity and diagnostic visual evidence.\n\nDetailed provenance, source hashes, form handling and visual QA: `docs/cobblemon-skins/0658_greninja/greninja-shadow-tide.md`.\n\n'''
              s=s.replace('## Authority boundary',entry+'## Authority boundary')
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/cobblemon-skin-catalog.md
          git commit -m 'Docs: catalog Shadow Tide Greninja' || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
