name: Cobblemon Model Preview

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'tools/cobblemon-model-review/**'
      - '.github/workflows/cobblemon-model-preview.yml'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png'
  workflow_dispatch:

permissions:
  contents: write

env:
  COBBLEMON_173_SHA: e428d34ea7f4aeca6dc9031488fb51fe0e315218
  COBBLEMON_173_ROOT: https://raw.githubusercontent.com/MayIHaveK/cobblemon-1.7.3/e428d34ea7f4aeca6dc9031488fb51fe0e315218/common/src/main/resources/assets/cobblemon

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic model-review dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pillow==11.0.0

      - name: Fetch pinned Cobblemon 1.7.3 Pikachu assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview-input
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$COBBLEMON_173_ROOT/bedrock/pokemon/models/0025_pikachu/pikachu_male.geo.json" \
            -o .preview-input/pikachu_male.geo.json
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$COBBLEMON_173_ROOT/bedrock/pokemon/animations/0025_pikachu/pikachu.animation.json" \
            -o .preview-input/pikachu.animation.json
          for name in pikachu pikachu_shiny pikachu_emissive pikachu_emissive_shiny; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              "$COBBLEMON_173_ROOT/textures/pokemon/0025_pikachu/${name}.png" \
              -o ".preview-input/${name}.png"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          model = json.loads(Path('.preview-input/pikachu_male.geo.json').read_text())
          desc = model['minecraft:geometry'][0]['description']
          assert (desc['texture_width'], desc['texture_height']) == (128, 64), desc
          names = {b['name'] for b in model['minecraft:geometry'][0]['bones']}
          assert {'torso2','neck','head_angle','muzzle','tail2','tail3','locator_item_face','locator_tail_tip'} <= names
          for name in ('pikachu','pikachu_shiny','pikachu_emissive','pikachu_emissive_shiny'):
              img = Image.open(f'.preview-input/{name}.png')
              assert img.size == (128, 64), (name, img.size)
          animation = json.loads(Path('.preview-input/pikachu.animation.json').read_text())['animations']
          assert 'animation.pikachu.ground_idle' in animation
          assert 'animation.pikachu.battle_idle' in animation
          assert 'animation.pikachu.ground_walk' in animation
          print('Pinned Cobblemon 1.7.3 Pikachu source validated')
          PY

      - name: Build Storm Courier on exact 1.7.3 anatomy
        shell: bash
        run: |
          set -euo pipefail
          out='test-evidence/visual/cobblemon-skins/0025_pikachu/ouros_storm_courier'
          rm -rf "$out"
          mkdir -p "$out"
          python tools/cobblemon-model-review/build_storm_courier_173.py \
            --source-model .preview-input/pikachu_male.geo.json \
            --base-texture .preview-input/pikachu.png \
            --shiny-texture .preview-input/pikachu_shiny.png \
            --emissive-texture .preview-input/pikachu_emissive.png \
            --emissive-shiny-texture .preview-input/pikachu_emissive_shiny.png \
            --output-model fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu.geo.json \
            --output-accessory fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png \
            --output-metadata "$out/source-build-metadata.json"

      - name: Render official-animation review states
        shell: bash
        run: |
          set -euo pipefail
          out='test-evidence/visual/cobblemon-skins/0025_pikachu/ouros_storm_courier'
          python tools/cobblemon-model-review/render_cobblemon_animation.py \
            --model fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu.geo.json \
            --animation-file .preview-input/pikachu.animation.json \
            --base-texture .preview-input/pikachu.png \
            --accessory-texture fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png \
            --output-dir "$out" \
            --size 1024

      - name: Validate anatomy preservation and PNG evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image

          root = Path('test-evidence/visual/cobblemon-skins/0025_pikachu/ouros_storm_courier')
          source = json.loads(Path('.preview-input/pikachu_male.geo.json').read_text())
          model_path = Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu.geo.json')
          built = json.loads(model_path.read_text())
          source_geo = source['minecraft:geometry'][0]
          built_geo = built['minecraft:geometry'][0]
          source_bones = source_geo['bones']
          built_bones = built_geo['bones']
          assert built_geo['description']['texture_width'] == 128
          assert built_geo['description']['texture_height'] == 64
          assert built_geo['description']['identifier'] == 'geometry.ouros_storm_courier_pikachu'
          assert built_bones[:-4] == source_bones, 'Cobblemon anatomy changed'
          assert [b['name'] for b in built_bones[-4:]] == [
              'ouros_courier_goggles','ouros_courier_harness','ouros_courier_pack','ouros_courier_tail_clamp'
          ]
          assert built_bones[-4]['parent'] == 'head_angle'
          assert built_bones[-3]['parent'] == 'torso2'
          assert built_bones[-2]['parent'] == 'torso2'
          assert built_bones[-1]['parent'] == 'tail'

          overlay = Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png').convert('RGBA')
          assert overlay.size == (128, 64)
          opaque = [(x,y) for y in range(64) for x in range(128) if overlay.getpixel((x,y))[3] > 0]
          assert len(opaque) == 4, opaque

          files = {
              'front': root / 'front.png',
              'left': root / 'left.png',
              'right': root / 'right.png',
              'back': root / 'back.png',
              'hero_three_quarter': root / 'poses/hero_three_quarter.png',
              'battle_ready': root / 'poses/battle_ready.png',
              'walking': root / 'poses/walking.png',
          }
          hashes = {}
          bboxes = {}
          for name, path in files.items():
              img = Image.open(path).convert('RGBA')
              assert img.size == (1024, 1024), (name, img.size)
              bbox = img.getchannel('A').getbbox()
              assert bbox is not None, name
              assert (bbox[2]-bbox[0]) > 180, (name, bbox)
              assert (bbox[3]-bbox[1]) > 300, (name, bbox)
              hashes[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              bboxes[name] = bbox
          assert len(set(hashes.values())) == 7, hashes

          metadata = {
              'format': 'ouros.cobblemon-model-review.v3',
              'cobblemonVersion': '1.7.3',
              'pinnedSourceCommit': 'e428d34ea7f4aeca6dc9031488fb51fe0e315218',
              'sourceModelSha256': hashlib.sha256(Path('.preview-input/pikachu_male.geo.json').read_bytes()).hexdigest(),
              'outputModelSha256': hashlib.sha256(model_path.read_bytes()).hexdigest(),
              'sourceBoneCount': len(source_bones),
              'outputBoneCount': len(built_bones),
              'baseAtlas': [128,64],
              'reviewStates': {
                  'front': 'ground_idle@0.0 front',
                  'left': 'ground_idle@0.0 left',
                  'right': 'ground_idle@0.0 right',
                  'back': 'ground_idle@0.0 back',
                  'hero_three_quarter': 'ground_idle@0.0 camera 34/5',
                  'battle_ready': 'battle_idle@0.0 camera -30/3',
                  'walking': 'ground_walk@0.14 camera 26/1',
              },
              'hashes': hashes,
              'boundingBoxes': {k:list(v) for k,v in bboxes.items()},
              'note': 'Model is built from pinned Cobblemon 1.7.3 Pikachu anatomy. Review poses use official Cobblemon animation transforms; no generative imagery.'
          }
          (root / 'render-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata, indent=2))
          PY

      - name: Commit corrected production asset and evidence
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu.geo.json \
            fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png \
            test-evidence/visual/cobblemon-skins/0025_pikachu/ouros_storm_courier
          if git diff --cached --quiet; then
            echo 'No generated asset changes to commit.'
            exit 0
          fi
          git commit -m 'RPG: rebuild Storm Courier on Cobblemon 1.7.3 Pikachu'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
