name: WORLD-013 Plan Self Patch

on:
  push:
    branches:
      - world-013-active-route-collision-revalidation
    paths:
      - '.github/workflows/world-013-plan-self-patch.yml'

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-active-route-collision-revalidation
      - name: Record shipped WORLD-013 slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          marker = '| WORLD-013 | NEXT/PARTIAL |'
          sentence = " PR #515 / implementation head `f641a9758bfe5e050d7cde985ca0c66322fb5196` revalidates the actor-sized collision volume of every unconsumed native CALM path node, so new walls or other blockers on otherwise-flat ground revoke and recalculate stale routes while already-traversed geometry is ignored."
          lines = text.splitlines()
          matches = [index for index, line in enumerate(lines) if line.startswith(marker)]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one WORLD-013 NEXT/PARTIAL row, found {len(matches)}')
          index = matches[0]
          if sentence.strip() not in lines[index]:
              if not lines[index].endswith(' |'):
                  raise SystemExit('WORLD-013 row did not end with expected table delimiter')
              lines[index] = lines[index][:-2] + sentence + ' |'
          path.write_text('\n'.join(lines) + '\n')
          PY
          rm .github/workflows/world-013-plan-self-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/world-013-plan-self-patch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'WORLD-013: record active route collision revalidation'
          git push origin HEAD:world-013-active-route-collision-revalidation
