name: Battle Visual Evidence

on:
  pull_request:
    paths:
      - 'fabric-adapter/**'
      - '.github/workflows/battle-visual-evidence.yml'
  workflow_dispatch:

jobs:
  authoritative-battle-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install graphical launcher tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          python3 -m pip install --disable-pip-version-check 'minecraft-launcher-lib==8.0'
      - name: Prepare production Fabric + Cobblemon mods
        run: gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon
      - name: Prepare battle evidence server and client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-evidence/battle test-evidence/diagnostics graphical-client/mods graphical-server/mods
          cp fabric-adapter/build/production-smoke/mods/*.jar graphical-client/mods/
          cp fabric-adapter/build/production-smoke/mods/*.jar graphical-server/mods/
          printf 'eula=true\n' > graphical-server/eula.txt
          cat > graphical-server/server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          gamemode=creative
          difficulty=peaceful
          level-type=minecraft:flat
          generate-structures=false
          view-distance=8
          simulation-distance=6
          motd=AutoPTU Battle Visual Evidence
          EOF
          cat > graphical-server/ops.json <<'EOF'
          [{"uuid":"43d6469a-bef9-3d6f-bbb3-3ad8e4494453","name":"AutoPTUVisual","level":4,"bypassesPlayerLimit":true}]
          EOF
          curl -fsSL -o graphical-server/fabric-server-launch.jar 'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.17.2/1.0.3/server/jar'
      - name: Launch authoritative battle and capture frames
        shell: bash
        run: |
          set -euo pipefail
          server_pid=""; client_pid=""
          cleanup() {
            [ -z "$client_pid" ] || kill "$client_pid" 2>/dev/null || true
            [ -z "$server_pid" ] || kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          (cd graphical-server && exec java -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../graphical-server.log 2>&1) & server_pid=$!
          for _ in $(seq 1 180); do
            if grep -q 'AutoPTU Fabric server adapter initialized' graphical-server/logs/latest.log 2>/dev/null && grep -q 'Done (' graphical-server/logs/latest.log 2>/dev/null; then break; fi
            kill -0 "$server_pid" 2>/dev/null || { cat graphical-server.log; exit 1; }
            sleep 1
          done
          Xvfb :99 -screen 0 1280x720x24 > xvfb.log 2>&1 & export DISPLAY=:99
          timeout 300s python3 - <<'PY' > graphical-client.log 2>&1 &
          import os, shutil, subprocess, minecraft_launcher_lib
          root=os.path.abspath('graphical-client')
          cb={'setStatus':lambda x:print(x,flush=True),'setProgress':lambda x:None,'setMax':lambda x:None}
          minecraft_launcher_lib.fabric.install_fabric('1.21.1',root,loader_version='0.17.2',callback=cb,java=shutil.which('java'))
          options=minecraft_launcher_lib.utils.generate_test_options()
          options.update({'username':'AutoPTUVisual','uuid':'43d6469abef93d6fbbb33ad8e4494453','token':'autoptu-ci-test-token','executablePath':shutil.which('java'),'defaultExecutablePath':shutil.which('java'),'customResolution':True,'resolutionWidth':'1280','resolutionHeight':'720'})
          options['jvmArguments']=['-Xms512M','-Xmx4G','-Dautoptu.battleVisualEvidenceCapture=true','-Dautoptu.visualEvidenceServer=127.0.0.1:25565']
          cmd=minecraft_launcher_lib.command.get_minecraft_command('fabric-loader-0.17.2-1.21.1',root,options)
          raise SystemExit(subprocess.call(cmd,cwd=root))
          PY
          client_pid=$!
          ready='graphical-client/screenshots/autoptu-battle-ready.png'; first='graphical-client/screenshots/autoptu-battle-first-strike.png'; counter='graphical-client/screenshots/autoptu-battle-counter-strike.png'
          capture_ready=0
          for _ in $(seq 1 280); do
            if [ -s "$ready" ] && [ -s "$first" ] && [ -s "$counter" ] && grep -q 'observed two server-synchronized battle Pokemon' graphical-client/logs/latest.log 2>/dev/null && grep -q 'captured ready window' graphical-client/logs/latest.log 2>/dev/null && grep -q 'captured post-first-move window' graphical-client/logs/latest.log 2>/dev/null && grep -q 'captured post-counter-move window' graphical-client/logs/latest.log 2>/dev/null; then capture_ready=1; break; fi
            kill -0 "$client_pid" 2>/dev/null || { cat graphical-client.log; exit 1; }
            sleep 1
          done
          [ "$capture_ready" -eq 1 ] || { cat graphical-client/logs/latest.log 2>/dev/null || true; cat graphical-server/logs/latest.log 2>/dev/null || true; exit 1; }
          cp "$ready" "$first" "$counter" test-evidence/battle/
          for frame in test-evidence/battle/*.png; do
            colors="$(identify -format '%k' "$frame")"; geometry="$(identify -format '%wx%h' "$frame")"
            echo "Captured $(basename "$frame") ${geometry} ${colors} colors"
            [ "$colors" -ge 64 ] || exit 1
          done
          grep 'AutoPTU battle visual evidence observed two server-synchronized battle Pokemon' graphical-client/logs/latest.log
          grep 'AutoPTU battle visual evidence captured ready window' graphical-client/logs/latest.log
          grep 'AutoPTU battle visual evidence captured post-first-move window' graphical-client/logs/latest.log
          grep 'AutoPTU battle visual evidence captured post-counter-move window' graphical-client/logs/latest.log
      - name: Collect graphical diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          cp graphical-client/logs/latest.log test-evidence/diagnostics/minecraft-client-latest.log 2>/dev/null || true
          cp graphical-server/logs/latest.log test-evidence/diagnostics/minecraft-server-latest.log 2>/dev/null || true
          cp graphical-client.log test-evidence/diagnostics/graphical-client-launch.log 2>/dev/null || true
          cp graphical-server.log test-evidence/diagnostics/graphical-server-launch.log 2>/dev/null || true
          cp xvfb.log test-evidence/diagnostics/xvfb.log 2>/dev/null || true
      - name: Upload battle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-visual-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            test-evidence/battle/**
            test-evidence/diagnostics/**
