name: Generate Eclipse Herald From Official Cobblemon

on:
  push:
    branches: ['skin/mimikyu-eclipse-herald']
    paths:
      - '.github/workflows/cobblemon-generate-eclipse-herald.yml'
      - 'tools/cobblemon-model-review/build_eclipse_herald_mimikyu.py'
      - 'tools/cobblemon-model-review/validate_original_model.py'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0778_mimikyu/90_ouros_eclipse_herald.json'
      - 'fabric-adapter/src/main/resources/data/cobblemon/species_features/ouros_eclipse_herald.json'
      - 'fabric-adapter/src/main/resources/data/cobblemon/species_feature_assignments/ouros_mimikyu_cosmetics.json'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: generate-eclipse-herald-${{ github.ref }}
  cancel-in-progress: true
env:
  COBBLEMON_VERSION_ID: kF7CvxTo
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download and pin official Cobblemon source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .official-source
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Mimikyu-Eclipse-Herald' "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .official-source/version.json
          python - <<'PY' > .official-source/download.env
          import json,shlex
          d=json.load(open('.official-source/version.json')); assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1'] and 'fabric' in d['loaders']
          p=next(f for f in d['files'] if f.get('primary')); assert p['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL='+shlex.quote(p['url'])); print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .official-source/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .official-source/cobblemon.jar
          printf '%s  %s\n' "$SHA512" .official-source/cobblemon.jar | sha512sum --check --strict
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0778_mimikyu/mimikyu.geo.json' > .official-source/mimikyu.geo.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0778_mimikyu/mimikyu.animation.json' > .official-source/mimikyu.animation.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/posers/0778_mimikyu/mimikyu.json' > .official-source/mimikyu.poser.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/resolvers/0778_mimikyu/0_mimikyu_base.json' > .official-source/mimikyu.resolver.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0778_mimikyu/mimikyu.png' > .official-source/mimikyu.png
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0778_mimikyu/mimikyu_shiny.png' > .official-source/mimikyu_shiny.png
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0778_mimikyu/license' > .official-source/model-license.txt
          test "$(sha256sum .official-source/mimikyu.geo.json|awk '{print $1}')" = d763a4704b345606af71fe567422abada299c44391bbf39a26628c63070236ab
          test "$(sha256sum .official-source/mimikyu.animation.json|awk '{print $1}')" = 5adc2d0a21d9f0264906f01e2eec960801698894924eb39589119263b5ab24c5
          test "$(sha256sum .official-source/mimikyu.poser.json|awk '{print $1}')" = 3f5b3a7bf7f2c21b0fc80cb3b991bf8f3b1d6fcaefc19f3bce1678085505f5c9
          test "$(sha256sum .official-source/mimikyu.resolver.json|awk '{print $1}')" = 98326f43805816badd6de27639943694ff6aeb800e00402888de4b4114bc7ec3
          test "$(sha256sum .official-source/mimikyu.png|awk '{print $1}')" = 8a715d58bf5eb8904537946acf7c902bdc6fa8a5e56bd7cea3cb39ebfef3d376
          test "$(sha256sum .official-source/mimikyu_shiny.png|awk '{print $1}')" = 349afd9be3b5540fd9d468e2c8910db2851aa028a94d464f17467d34b591c731
          test "$(sha256sum .official-source/model-license.txt|awk '{print $1}')" = fb8e971d1895863ec9fc5f3cfc526c64af980bd6c93d0a1615c7969df46a6660
      - name: Generate cosmetic production assets
        run: |
          python tools/cobblemon-model-review/build_eclipse_herald_mimikyu.py --official .official-source/mimikyu.geo.json --model-out fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0778_mimikyu/ouros_eclipse_herald_mimikyu.geo.json --overlay-out fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0778_mimikyu/ouros_eclipse_herald_accessories.png --metadata-out docs/cobblemon-skins/0778_mimikyu/eclipse-herald-build-metadata.json
      - name: Validate anatomy, extras, UV and resolver
        shell: bash
        run: |
          set -euo pipefail
          model=fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0778_mimikyu/ouros_eclipse_herald_mimikyu.geo.json
          python tools/cobblemon-model-review/validate_original_model.py --official .official-source/mimikyu.geo.json --candidate "$model"
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          from PIL import Image
          o=json.loads(Path('.official-source/mimikyu.geo.json').read_text())['minecraft:geometry'][0]
          m=json.loads(Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0778_mimikyu/ouros_eclipse_herald_mimikyu.geo.json').read_text())['minecraft:geometry'][0]
          meta=json.loads(Path('docs/cobblemon-skins/0778_mimikyu/eclipse-herald-build-metadata.json').read_text())
          expected=['ouros_eclipse_halo','ouros_eclipse_cowl','ouros_eclipse_mantle','ouros_eclipse_pennant_left','ouros_eclipse_pennant_right','ouros_eclipse_tail_reliquary','ouros_eclipse_hand_charm_right','ouros_eclipse_hand_charm_left']
          assert len(o['bones'])==48 and len(m['bones'])==56 and [b['name'] for b in m['bones'][48:]]==expected
          assert meta['originalBoneCount']==48 and meta['derivedBoneCount']==56 and meta['cosmeticCubeCount']>=40
          spec=importlib.util.spec_from_file_location('builder','tools/cobblemon-model-review/build_eclipse_herald_mimikyu.py'); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          reserved={tuple(v) for v in meta['palettePixels'].values()}; assert reserved.isdisjoint(mod.mark_uv_usage(o))
          im=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0778_mimikyu/ouros_eclipse_herald_accessories.png').convert('RGBA'); assert list(im.size)==meta['textureSize']
          opaque={(x,y) for y in range(im.height) for x in range(im.width) if im.getpixel((x,y))[3]}; assert opaque==reserved
          r=json.loads(Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0778_mimikyu/90_ouros_eclipse_herald.json').read_text()); assert r['species']=='cobblemon:mimikyu' and len(r['variations'])==2
          for v in r['variations']:
              assert v['poser']=='cobblemon:mimikyu' and v['model']=='cobblemon:ouros_eclipse_herald_mimikyu.geo' and v['layers'][-1]['name']=='ouros_eclipse_herald'
          a=json.loads(Path('.official-source/mimikyu.animation.json').read_text())['animations']; assert 'animation.mimikyu.ground_idle' in a and 'animation.mimikyu.ground_walk' in a
          print('validated',len(o['bones']),'official bones +',len(m['bones'])-len(o['bones']),'cosmetic bones; cubes',meta['cosmeticCubeCount'])
          PY
      - name: Preserve model license
        run: |
          mkdir -p docs/cobblemon-skins/0778_mimikyu
          cp .official-source/model-license.txt docs/cobblemon-skins/0778_mimikyu/official-model-license.txt
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0778_mimikyu/ouros_eclipse_herald_mimikyu.geo.json fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0778_mimikyu/ouros_eclipse_herald_accessories.png docs/cobblemon-skins/0778_mimikyu/eclipse-herald-build-metadata.json docs/cobblemon-skins/0778_mimikyu/official-model-license.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RPG: generate Eclipse Herald from official Cobblemon Mimikyu'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
