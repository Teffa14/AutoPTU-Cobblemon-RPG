name: Review Storm Courier In Blockbench

on:
  push:
    branches:
      - feat/cobblemon-skin-studio-clean-v2
    paths:
      - '.github/workflows/cobblemon-storm-courier-review.yml'
      - 'tools/cobblemon-model-review/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_*.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/90_ouros_storm_courier.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png'
  pull_request:
    paths:
      - '.github/workflows/cobblemon-storm-courier-review.yml'
      - 'tools/cobblemon-model-review/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_*.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/90_ouros_storm_courier.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png'
  workflow_dispatch:

permissions:
  contents: read

env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  BLOCKBENCH_VERSION: 5.1.6
  BLOCKBENCH_SHA256: c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64

      - name: Download verified official Cobblemon 1.7.3 Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .review/official
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/storm-courier-review' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" \
            -o .review/version.json
          python - <<'PY' > .review/download.env
          import json, shlex
          data = json.load(open('.review/version.json', encoding='utf-8'))
          assert data['id'] == 'kF7CvxTo'
          assert data['version_number'] == '1.7.3'
          primary = next(f for f in data['files'] if f.get('primary'))
          assert primary['filename'] == 'Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL=' + shlex.quote(primary['url']))
          print('SHA512=' + shlex.quote(primary['hashes']['sha512']))
          PY
          source .review/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .review/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.review/cobblemon.jar' | sha512sum --check --strict

      - name: Extract exact official source assets
        shell: bash
        run: |
          set -euo pipefail
          unzip -p .review/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_male.geo.json' > .review/official/pikachu_male.geo.json
          unzip -p .review/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_female.geo.json' > .review/official/pikachu_female.geo.json
          unzip -p .review/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0025_pikachu/pikachu.animation.json' > .review/official/pikachu.animation.json
          unzip -p .review/cobblemon.jar 'assets/cobblemon/textures/pokemon/0025_pikachu/pikachu.png' > .review/official/pikachu.png
          test "$(sha256sum .review/official/pikachu_male.geo.json | awk '{print $1}')" = 'f8ea21f6821d49e8a358f05d43562312a0e018e883f1354aa1445d2a0b432c83'
          test "$(sha256sum .review/official/pikachu_female.geo.json | awk '{print $1}')" = 'd49ba9bce368fed677832685f57a0ca3e7a00a6014639f1e79dbb0b749ed4318'
          test "$(sha256sum .review/official/pikachu.animation.json | awk '{print $1}')" = 'd9ca00604978f295ad312d358a06f2655c725b30ac3da73c3637ae160c543384'
          test "$(sha256sum .review/official/pikachu.png | awk '{print $1}')" = 'df0b0b2029e0cb51ace2fd7d65ce94fc6a7bf1a4681722bf20aa22edd2cc3c8e'
          python - <<'PY'
          import json
          animation = json.load(open('.review/official/pikachu.animation.json', encoding='utf-8'))
          assert 'animation.pikachu.ground_idle' in animation['animations']
          assert 'animation.pikachu.battle_idle' in animation['animations']
          assert 'animation.pikachu.ground_walk' in animation['animations']
          PY

      - name: Validate and reproduce committed cosmetic
        shell: bash
        run: |
          set -euo pipefail
          male='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json'
          female='fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json'
          overlay='fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png'

          python tools/cobblemon-model-review/validate_original_model.py --official .review/official/pikachu_male.geo.json --candidate "$male"
          python tools/cobblemon-model-review/validate_original_model.py --official .review/official/pikachu_female.geo.json --candidate "$female"

          mkdir -p .review/regenerated
          python tools/cobblemon-model-review/build_storm_courier.py \
            --male .review/official/pikachu_male.geo.json \
            --female .review/official/pikachu_female.geo.json \
            --male-out .review/regenerated/male.geo.json \
            --female-out .review/regenerated/female.geo.json \
            --overlay-out .review/regenerated/accessories.png
          cmp --silent "$male" .review/regenerated/male.geo.json
          cmp --silent "$female" .review/regenerated/female.geo.json
          cmp --silent "$overlay" .review/regenerated/accessories.png

      - name: Build Blockbench review texture and verify resolver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          base = Image.open('.review/official/pikachu.png').convert('RGBA')
          overlay_path = Path('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png')
          overlay = Image.open(overlay_path).convert('RGBA')
          assert base.size == overlay.size == (128, 64)
          composite = Image.alpha_composite(base, overlay)
          composite.save('.review/storm_courier_preview.png', optimize=True)

          resolver_path = Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/90_ouros_storm_courier.json')
          resolver = json.loads(resolver_path.read_text(encoding='utf-8'))
          assert resolver['species'] == 'cobblemon:pikachu'
          assert resolver['order'] == 90
          aspects = {tuple(v['aspects']) for v in resolver['variations']}
          assert ('ouros_storm_courier',) in aspects
          assert ('ouros_storm_courier', 'shiny') in aspects
          assert ('ouros_storm_courier', 'female') in aspects
          assert ('ouros_storm_courier', 'shiny', 'female') in aspects
          for variation in resolver['variations']:
              assert variation['poser'] == 'cobblemon:pikachu'
              assert any(layer['name'] == 'ouros_storm_courier' for layer in variation['layers'])
          PY

      - name: Download pinned Blockbench
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" \
            -o .review/blockbench.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" '.review/blockbench.AppImage' | sha256sum --check --strict
          chmod +x .review/blockbench.AppImage
          (cd .review && ./blockbench.AppImage --appimage-extract >/dev/null)
          test -x .review/squashfs-root/AppRun

      - name: Render official and Storm Courier through Blockbench official idle
        shell: bash
        run: |
          set -euo pipefail
          root='test-evidence/visual/cobblemon-skins/0025_pikachu/storm-courier-blockbench-review'
          rm -rf "$root"
          mkdir -p "$root/official-male" "$root/storm-male" "$root/storm-female"

          render_model() {
            model="$1"
            texture="$2"
            output="$3"
            port="$4"
            userdata="$5"
            log="$6"
            rm -rf "$userdata"
            mkdir -p "$userdata"
            xvfb-run -a -s '-screen 0 1600x1200x24' \
              env APPDIR="$PWD/.review/squashfs-root" \
              .review/squashfs-root/AppRun \
              --no-sandbox \
              --disable-gpu-sandbox \
              --remote-debugging-port="$port" \
              --userData "$userdata" \
              "$model" > "$log" 2>&1 &
            pid=$!
            ready=0
            for _ in $(seq 1 90); do
              if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; return 1; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then cat "$log"; kill "$pid" 2>/dev/null || true; return 1; fi
            node tools/cobblemon-model-review/blockbench_capture.mjs \
              --endpoint "http://127.0.0.1:${port}" \
              --texture "$texture" \
              --animation "$PWD/.review/official/pikachu.animation.json" \
              --animation-name 'animation.pikachu.ground_idle' \
              --animation-time '0.35' \
              --output-dir "$output"
            kill "$pid" 2>/dev/null || true
          }

          render_model "$PWD/.review/official/pikachu_male.geo.json" "$PWD/.review/official/pikachu.png" "$root/official-male" 9222 "$PWD/.review/user-official" "$PWD/.review/official.log"
          render_model "$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_male.geo.json" "$PWD/.review/storm_courier_preview.png" "$root/storm-male" 9223 "$PWD/.review/user-storm-male" "$PWD/.review/storm-male.log"
          render_model "$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu_female.geo.json" "$PWD/.review/storm_courier_preview.png" "$root/storm-female" 9224 "$PWD/.review/user-storm-female" "$PWD/.review/storm-female.log"

          cp .review/official.log "$root/official-male/blockbench.log"
          cp .review/storm-male.log "$root/storm-male/blockbench.log"
          cp .review/storm-female.log "$root/storm-female/blockbench.log"

      - name: Prove Blockbench applied official animation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('test-evidence/visual/cobblemon-skins/0025_pikachu/storm-courier-blockbench-review')
          for variant in ('official-male', 'storm-male', 'storm-female'):
              metadata = json.loads((root / variant / 'blockbench-metadata.json').read_text(encoding='utf-8'))
              assert metadata['viewer'] == 'Blockbench'
              assert metadata['sourceOfTransforms'] == 'Blockbench Bedrock animation codec'
              applied = metadata['modelInfo']['appliedAnimation']
              assert applied['name'] == 'animation.pikachu.ground_idle'
              assert applied['codec'] == 'bedrock'
              assert abs(applied['requestedTime'] - 0.35) < 1e-9
          PY

      - name: Build side-by-side review sheets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('test-evidence/visual/cobblemon-skins/0025_pikachu/storm-courier-blockbench-review')
          summary = []
          for view in ('front', 'left', 'right', 'back'):
              official = Image.open(root / 'official-male' / f'{view}.png').convert('RGBA')
              storm = Image.open(root / 'storm-male' / f'{view}.png').convert('RGBA')
              female = Image.open(root / 'storm-female' / f'{view}.png').convert('RGBA')
              assert official.size == storm.size == female.size == (1024, 1024)
              assert hashlib.sha256((root / 'official-male' / f'{view}.png').read_bytes()).digest() != hashlib.sha256((root / 'storm-male' / f'{view}.png').read_bytes()).digest()

              sheet = Image.new('RGBA', (3072, 1080), (32, 32, 32, 255))
              sheet.alpha_composite(official, (0, 56))
              sheet.alpha_composite(storm, (1024, 56))
              sheet.alpha_composite(female, (2048, 56))
              draw = ImageDraw.Draw(sheet)
              draw.text((20, 18), f'{view.upper()} — OFFICIAL MALE / GROUND IDLE', fill=(255,255,255,255))
              draw.text((1044, 18), f'{view.upper()} — STORM MALE / SAME FRAME', fill=(255,255,255,255))
              draw.text((2068, 18), f'{view.upper()} — STORM FEMALE / SAME FRAME', fill=(255,255,255,255))
              sheet.save(root / f'compare-{view}.png', optimize=True)
              summary.append(view)
          print('Blockbench comparisons:', summary)
          PY

      - name: Upload Blockbench review evidence
        uses: actions/upload-artifact@v4
        with:
          name: storm-courier-blockbench-review
          path: test-evidence/visual/cobblemon-skins/0025_pikachu/storm-courier-blockbench-review
          if-no-files-found: error
          retention-days: 14
