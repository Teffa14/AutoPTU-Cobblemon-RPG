name: Lucario V45 Blockbench Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/cobblemon-model-review/authored-sources/0448_lucario/v45-aura-knight-macroform.patch.json'
      - 'tools/cobblemon-model-review/materialize_lucario_authored_preview.py'
      - 'tools/cobblemon-model-review/blockbench_authored_capture.mjs'
      - '.github/workflows/lucario-v45-blockbench-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blockbench-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Validate reference gate and V45 source
        run: |
          python tools/cobblemon-model-review/validate_species_reference_dossier.py docs/cobblemon-skin-reference-dossiers/0448_lucario.json --expected-species lucario
          python tools/cobblemon-model-review/validate_authored_cosmetic_patch.py tools/cobblemon-model-review/authored-sources/0448_lucario/v45-aura-knight-macroform.patch.json --expected-species lucario
      - name: Install preview dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64
      - name: Fetch exact Cobblemon 1.7.3 Lucario assets
        run: |
          set -euo pipefail
          mkdir -p .v45-official .v45-output
          curl --fail --silent --show-error --location --retry 4 https://api.modrinth.com/v2/version/kF7CvxTo -o .v45-official/version.json
          python - <<'PY'
          import json,pathlib
          d=json.load(open('.v45-official/version.json')); f=next((x for x in d['files'] if x.get('primary')),d['files'][0]); pathlib.Path('.v45-official/url').write_text(f['url']); pathlib.Path('.v45-official/name').write_text(f['filename'])
          PY
          curl --fail --silent --show-error --location --retry 4 "$(cat .v45-official/url)" -o .v45-official/cobblemon.jar
          echo 'f7c25955176badc444ad6211fc556514fedbdba776227f105fe899f8819d74e3  .v45-official/cobblemon.jar' | sha256sum --check --strict
          python - <<'PY'
          import hashlib,zipfile,pathlib,json
          expected={'model':'ccc5f4521fd71fcb4db548a0f0fd0ed41f83426f4a5c04efa473d8a20bef2de9','texture':'98c46f44f9e3428c8ecfd9f564d8d2e4c26ea60bee9ace6ff225c66f4803596a','animation':'ddf880b0830d7649f8cd8811c1c7e2b7fcdee156c850bbeb398f064995fa8563','poser':'7cd9642b38fd1c3e2518cc7f30cd1ea221cac9c89e4b413551151418a4e3c07d','resolver':'a1785270f9f21378e6287b30e3e309de4daa348f21e33fcb8a8b03a134508e81','license':'fb8e971d1895863ec9fc5f3cfc526c64af980bd6c93d0a1615c7969df46a6660'}
          ext={'model':'.geo.json','texture':'.png','animation':'.animation.json','poser':'.poser.json','resolver':'.resolver.json','license':'.license'}; found={}
          with zipfile.ZipFile('.v45-official/cobblemon.jar') as z:
            for n in z.namelist():
              if n.endswith('/'): continue
              b=z.read(n); h=hashlib.sha256(b).hexdigest()
              for k,w in expected.items():
                if h==w: pathlib.Path('.v45-official',k+ext[k]).write_bytes(b); found[k]={'path':n,'sha256':h}
          if set(found)!=set(expected): raise SystemExit(f'missing hashes {set(expected)-set(found)}')
          json.dump(found,open('.v45-output/official-assets.json','w'),indent=2)
          PY
      - name: Materialize V45 preview
        run: |
          python tools/cobblemon-model-review/materialize_lucario_authored_preview.py --patch tools/cobblemon-model-review/authored-sources/0448_lucario/v45-aura-knight-macroform.patch.json --official-model .v45-official/model.geo.json --official-texture .v45-official/texture.png --output-dir .v45-output
      - name: Resolve official animation states
        id: anim
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          k=list(json.load(open('.v45-official/animation.animation.json'))['animations']); g=next(x for x in k if 'ground_idle' in x.lower()); b=next(x for x in k if 'battle_idle' in x.lower()); print('ground='+g); print('battle='+b); print('time=0.35')
          PY
      - name: Pin Blockbench 5.1.6
        run: |
          curl --fail --silent --show-error --location --retry 4 https://github.com/JannisX11/blockbench/releases/download/v5.1.6/Blockbench_5.1.6.AppImage -o .v45-official/blockbench.AppImage
          echo 'c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e  .v45-official/blockbench.AppImage' | sha256sum --check --strict
          chmod +x .v45-official/blockbench.AppImage && (cd .v45-official && ./blockbench.AppImage --appimage-extract >/dev/null)
      - name: Capture matched-camera Blockbench evidence
        env: {GROUND: '${{ steps.anim.outputs.ground }}', BATTLE: '${{ steps.anim.outputs.battle }}', AT: '${{ steps.anim.outputs.time }}'}
        run: |
          set -euo pipefail
          capture(){ model="$1"; tex="$2"; anim="$3"; out="$4"; port="$5"; pin="$6"; pout="$7"; user="$PWD/.v45-official/u$port"; mkdir -p "$user" "$out"; xvfb-run -a -s '-screen 0 1600x1200x24' env APPDIR="$PWD/.v45-official/squashfs-root" .v45-official/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$user" "$model" >/tmp/bb$port.log 2>&1 & pid=$!; for _ in $(seq 1 90); do curl -fs "http://127.0.0.1:$port/json/version" >/dev/null 2>&1 && break; sleep 1; done; args=(--endpoint "http://127.0.0.1:$port" --texture "$tex" --animation "$PWD/.v45-official/animation.animation.json" --animation-name "$anim" --animation-time "$AT" --output-dir "$out"); [ -n "$pin" ] && args+=(--camera-profile-in "$pin"); [ -n "$pout" ] && args+=(--camera-profile-out "$pout"); node tools/cobblemon-model-review/blockbench_authored_capture.mjs "${args[@]}"; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          CAMERA="$PWD/.v45-output/camera.json"
          capture "$PWD/.v45-official/model.geo.json" "$PWD/.v45-official/texture.png" "$GROUND" "$PWD/.v45-output/official" 9451 '' "$CAMERA"
          capture "$PWD/.v45-output/lucario_v45_preview.geo.json" "$PWD/.v45-output/lucario_v45_preview.png" "$GROUND" "$PWD/.v45-output/hero" 9452 "$CAMERA" ''
          capture "$PWD/.v45-output/lucario_v45_preview.geo.json" "$PWD/.v45-output/lucario_v45_preview.png" "$BATTLE" "$PWD/.v45-output/battle" 9453 "$CAMERA" ''
          cp .v45-output/official/three_quarter.png .v45-output/official_reference_three_quarter.png
          cp .v45-output/hero/three_quarter.png .v45-output/hero_three_quarter.png
          cp .v45-output/battle/three_quarter.png .v45-output/battle_ready_three_quarter.png
          cp .v45-output/hero/front.png .v45-output/hero_front.png
          cp .v45-output/hero/left.png .v45-output/hero_left.png
          cp .v45-output/hero/right.png .v45-output/hero_right.png
          cp .v45-output/hero/back.png .v45-output/hero_back.png
          cp .v45-output/hero/three_quarter_gameplay_160.png .v45-output/hero_gameplay_160.png
      - name: Build contact sheet
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          root=Path('.v45-output'); names=['official_reference_three_quarter.png','hero_three_quarter.png','battle_ready_three_quarter.png','hero_front.png','hero_back.png','hero_gameplay_160.png']; cells=[]
          for n in names:
            im=Image.open(root/n).convert('RGBA'); im.thumbnail((512,512)); c=Image.new('RGBA',(540,570),(245,245,245,255)); c.alpha_composite(im,((540-im.width)//2,20)); ImageDraw.Draw(c).text((12,540),n,fill=(0,0,0,255)); cells.append(c)
          s=Image.new('RGBA',(1080,1710),(230,230,230,255)); [s.alpha_composite(c,((i%2)*540,(i//2)*570)) for i,c in enumerate(cells)]; s.save(root/'contact_sheet.png')
          PY
      - name: Upload V45 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: lucario-v45-blockbench-evidence, path: .v45-output, if-no-files-found: error, include-hidden-files: true, retention-days: 30}
