name: Generate Omen Regent From Official Cobblemon

on:
  push:
    branches: ['feat/absol-omen-regent']
    paths:
      - '.github/workflows/cobblemon-generate-omen-regent.yml'
      - 'tools/cobblemon-model-review/build_omen_regent_absol.py'
      - 'tools/cobblemon-model-review/validate_original_model.py'
      - 'fabric-adapter/src/main/resources/data/cobblemon/species_features/ouros_omen_regent.json'
      - 'fabric-adapter/src/main/resources/data/cobblemon/species_feature_assignments/ouros_absol_cosmetics.json'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: generate-omen-regent-${{ github.ref }}
  cancel-in-progress: true
env: {COBBLEMON_VERSION_ID: kF7CvxTo}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download exact latest-compatible official source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .official-source
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Omen-Regent' 'https://api.modrinth.com/v2/project/cobblemon/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D' -o .official-source/versions.json
          python - <<'PY'
          import json
          r=sorted((x for x in json.load(open('.official-source/versions.json')) if x.get('version_type')=='release'),key=lambda x:x['date_published'],reverse=True); assert r and r[0]['id']=='kF7CvxTo'
          PY
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Omen-Regent' "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .official-source/version.json
          python - <<'PY' > .official-source/env
          import json,shlex
          d=json.load(open('.official-source/version.json')); p=next(f for f in d['files'] if f.get('primary')); assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1'] and p['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'; print('URL='+shlex.quote(p['url'])); print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .official-source/env; curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .official-source/cobblemon.jar; printf '%s  %s\n' "$SHA512" .official-source/cobblemon.jar | sha512sum --check --strict
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0359_absol/absol.geo.json' > .official-source/absol.geo.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0359_absol/absol.animation.json' > .official-source/absol.animation.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/posers/0359_absol/absol.json' > .official-source/absol.poser.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/resolvers/0359_absol/0_absol_base.json' > .official-source/absol.resolver.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0359_absol/absol.png' > .official-source/absol.png
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0359_absol/absol_shiny.png' > .official-source/absol_shiny.png
          test "$(sha256sum .official-source/absol.geo.json|awk '{print $1}')" = ed8b82b60caaeb0ee8b97597b5bd194a52d52d671da7bbc0eb35aa8dd864d462
          test "$(sha256sum .official-source/absol.animation.json|awk '{print $1}')" = 3e706148f3159fb60b51acd8221d4a1292306a8a780ab4b69a874eb72700ece4
          test "$(sha256sum .official-source/absol.poser.json|awk '{print $1}')" = d47d56606e412b794261ee3b8220d80b93da576f030f40e5b28eebe7ad8f06be
          test "$(sha256sum .official-source/absol.resolver.json|awk '{print $1}')" = 41048e936f18c108331a0d739388fef686a8f01be72cbf70e4a146603aa3e832
          test "$(sha256sum .official-source/absol.png|awk '{print $1}')" = 9f0ce5dcf5ccc6bcb24e6821f2ee7c8dbd572c0e9ce8634a548d1ec8b1fc26e7
          test "$(sha256sum .official-source/absol_shiny.png|awk '{print $1}')" = 633051ce706888f14ff59afda37e22d4d82debab5716445c3ae1d603fc97a6a1
      - name: Generate Omen Regent production assets
        run: |
          python tools/cobblemon-model-review/build_omen_regent_absol.py --official .official-source/absol.geo.json --model-out fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json --overlay-out fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png --metadata-out docs/cobblemon-skins/0359_absol/omen-regent-build-metadata.json
      - name: Preserve official resolver scope and add cosmetic layer
        shell: bash
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          src=json.loads(Path('.official-source/absol.resolver.json').read_text()); out={'species':src['species'],'order':90,'variations':[]}
          for v in src['variations']:
              nv=copy.deepcopy(v); nv['aspects']=['ouros_omen_regent']+list(nv.get('aspects',[])); nv['model']='cobblemon:ouros_omen_regent_absol.geo'; nv.setdefault('layers',[]).append({'name':'ouros_omen_regent','texture':'cobblemon:textures/pokemon/0359_absol/ouros_omen_regent_accessories.png','translucent':True}); out['variations'].append(nv)
          assert len(out['variations'])==len(src['variations'])==2
          p=Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0359_absol/90_ouros_omen_regent.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,separators=(',',':'))+'\n')
          PY
      - name: Validate anatomy, UVs, resolver, poser and official clips
        shell: bash
        run: |
          set -euo pipefail
          model=fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol/ouros_omen_regent_absol.geo.json
          python tools/cobblemon-model-review/validate_original_model.py --official .official-source/absol.geo.json --candidate "$model"
          PYTHONPATH=tools/cobblemon-model-review python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          import build_omen_regent_absol as b
          meta=json.loads(Path('docs/cobblemon-skins/0359_absol/omen-regent-build-metadata.json').read_text()); assert meta['originalBoneCount']==73 and meta['derivedBoneCount']==81 and len(meta['cosmeticBones'])==8 and meta['cosmeticCubeCount']>=40
          g=json.loads(Path('.official-source/absol.geo.json').read_text())['minecraft:geometry'][0]; reserved={tuple(v) for v in meta['palettePixels'].values()}; assert reserved.isdisjoint(b.mark_uv_usage(g))
          im=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png').convert('RGBA'); assert {(x,y) for y in range(im.height) for x in range(im.width) if im.getpixel((x,y))[3]}==reserved
          src=json.loads(Path('.official-source/absol.resolver.json').read_text()); out=json.loads(Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0359_absol/90_ouros_omen_regent.json').read_text()); assert len(src['variations'])==len(out['variations'])==2
          for s,v in zip(src['variations'],out['variations']): assert v['aspects'][1:]==s.get('aspects',[]) and v['aspects'][0]=='ouros_omen_regent' and v['layers'][-1]['name']=='ouros_omen_regent'
          poser=json.loads(Path('.official-source/absol.poser.json').read_text()); assert poser['rootBone']=='absol' and 'standing' in poser['poses'] and 'walking' in poser['poses']
          clips=json.loads(Path('.official-source/absol.animation.json').read_text())['animations']; assert 'animation.absol.ground_idle' in clips and 'animation.absol.render' in clips and 'animation.absol.cry' in clips and 'animation.absol.blink' in clips
          meta.update({'officialModelSha256':hashlib.sha256(Path('.official-source/absol.geo.json').read_bytes()).hexdigest(),'officialAnimationSha256':hashlib.sha256(Path('.official-source/absol.animation.json').read_bytes()).hexdigest(),'officialPoserSha256':hashlib.sha256(Path('.official-source/absol.poser.json').read_bytes()).hexdigest(),'officialResolverSha256':hashlib.sha256(Path('.official-source/absol.resolver.json').read_bytes()).hexdigest(),'officialNormalTextureSha256':hashlib.sha256(Path('.official-source/absol.png').read_bytes()).hexdigest(),'officialShinyTextureSha256':hashlib.sha256(Path('.official-source/absol_shiny.png').read_bytes()).hexdigest()}); Path('docs/cobblemon-skins/0359_absol/omen-regent-build-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0359_absol fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/resolvers/0359_absol/90_ouros_omen_regent.json fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0359_absol/ouros_omen_regent_accessories.png docs/cobblemon-skins/0359_absol/omen-regent-build-metadata.json
          git commit -m 'RPG: generate Omen Regent Absol assets' || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin HEAD:"${GITHUB_REF_NAME}"
