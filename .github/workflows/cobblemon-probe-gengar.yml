name: Probe Official Gengar Presentation Assets

on:
  push:
    branches:
      - 'feat/gengar-rift-warden-epic'
    paths:
      - '.github/workflows/cobblemon-probe-gengar.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  COBBLEMON_VERSION_ID: kF7CvxTo

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact official Cobblemon release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .probe docs/cobblemon-skins/0094_gengar
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/gengar-source-probe' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .probe/version.json
          python - <<'PY' > .probe/download.env
          import json, shlex
          data=json.load(open('.probe/version.json',encoding='utf-8'))
          assert data['id']=='kF7CvxTo' and data['version_number']=='1.7.3'
          assert data['game_versions']==['1.21.1'] and 'fabric' in data['loaders']
          primary=next(f for f in data['files'] if f.get('primary'))
          assert primary['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL='+shlex.quote(primary['url']))
          print('SHA512='+shlex.quote(primary['hashes']['sha512']))
          PY
          source .probe/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .probe/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.probe/cobblemon.jar' | sha512sum --check --strict
      - name: Inspect Gengar paths, geometry, animation and resolver contracts
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 .probe/cobblemon.jar | grep -Ei '(^|/)0094_gengar/|gengar' | sort > .probe/gengar-paths.txt
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          z=zipfile.ZipFile('.probe/cobblemon.jar')
          paths=Path('.probe/gengar-paths.txt').read_text().splitlines()
          def sha(path): return hashlib.sha256(z.read(path)).hexdigest()
          assets=[]
          for p in paths:
              if not p.endswith(('.json','.geo.json')): continue
              try: data=json.loads(z.read(p))
              except Exception: continue
              entry={'path':p,'sha256':sha(p)}
              if 'minecraft:geometry' in data:
                  geo=data['minecraft:geometry'][0]
                  entry['geometryIdentifier']=geo.get('description',{}).get('identifier')
                  entry['textureSize']=[geo.get('description',{}).get('texture_width'),geo.get('description',{}).get('texture_height')]
                  entry['boneCount']=len(geo.get('bones',[]))
                  details=[]
                  mins=[10**9,10**9,10**9]; maxs=[-10**9,-10**9,-10**9]
                  for b in geo.get('bones',[]):
                      item={'name':b.get('name'),'parent':b.get('parent'),'pivot':b.get('pivot'),'rotation':b.get('rotation'),'cubeCount':len(b.get('cubes',[]))}
                      cubes=[]
                      for c in b.get('cubes',[]):
                          o=c.get('origin',[0,0,0]); s=c.get('size',[0,0,0]); cubes.append({'origin':o,'size':s,'pivot':c.get('pivot'),'rotation':c.get('rotation')})
                          for i in range(3): mins[i]=min(mins[i],o[i]); maxs[i]=max(maxs[i],o[i]+s[i])
                      if cubes: item['cubes']=cubes
                      details.append(item)
                  entry['bounds']={'min':mins,'max':maxs}
                  entry['bones']=details
              if 'animations' in data: entry['animationNames']=sorted(data['animations'].keys())
              if isinstance(data,dict) and 'species' in data and 'variations' in data:
                  entry['species']=data.get('species'); entry['resolverOrder']=data.get('order'); entry['variations']=data.get('variations')
              assets.append(entry)
          textures=[{'path':p,'sha256':sha(p)} for p in paths if p.endswith('.png')]
          licenses=[{'path':p,'sha256':sha(p),'text':z.read(p).decode('utf-8','replace')} for p in paths if p.lower().endswith(('license','license.txt'))]
          report={'source':{'modrinthVersionId':'kF7CvxTo','cobblemonVersion':'1.7.3','minecraft':'1.21.1','jar':'Cobblemon-fabric-1.7.3+1.21.1.jar'},'matchingPaths':paths,'jsonAssets':assets,'textures':textures,'licenses':licenses,'poserInspection':{'resourceJsonPresent':False,'runtimePoser':'cobblemon:gengar','note':'No Gengar poser JSON is distributed in the official JAR; resolver points at the runtime Gengar poser/model implementation. No synthetic poser file is introduced.'}}
          Path('docs/cobblemon-skins/0094_gengar/official-source-probe.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Correct prior Lucario validation status before new asset authoring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements={
            Path('docs/cobblemon-skin-catalog.md'):[('Status: ARTISTICALLY ACCEPTED IN BLOCKBENCH — PLAYABLE/CORE CI PENDING','Status: EPIC ACCEPTED — BLOCKBENCH + PLAYABLE/CORE VALIDATED')],
            Path('docs/cobblemon-skins/0448_lucario/lucario-aura-sentinel.md'):[('Status: ARTISTICALLY ACCEPTED IN BLOCKBENCH; PLAYABLE/CORE CI PENDING','Status: EPIC ACCEPTED; BLOCKBENCH + PLAYABLE/CORE VALIDATED'),('Playable Fabric and Integration Core checks remain required before the status can be promoted to fully validated/mergeable.','Playable Fabric and Integration Core validation completed successfully before PR #296 merged; Aura Sentinel is fully validated as presentation content.')]
          }
          for path,pairs in replacements.items():
              text=path.read_text()
              for old,new in pairs:
                  assert old in text, (path,old)
                  text=text.replace(old,new)
              path.write_text(text)
          PY
      - name: Commit source contract and corrected prior status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cobblemon-skins/0094_gengar/official-source-probe.json docs/cobblemon-skin-catalog.md docs/cobblemon-skins/0448_lucario/lucario-aura-sentinel.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Docs: pin Gengar source and close Lucario validation status'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
