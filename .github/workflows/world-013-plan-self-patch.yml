name: WORLD-013 Plan Self Patch

on:
  push:
    branches:
      - world-013-calm-path-surface-continuity

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-calm-path-surface-continuity
      - name: Record shipped WORLD-013 slice and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = p.read_text()
          needle = "PR #512 / implementation head `4764a9bba99585e8f69694bae22cb67e16e28658` rejects Minecraft-native CALM target columns when any cardinal MOTION_BLOCKING_NO_LEAVES neighbor differs by more than one block, so isolated pillars and abrupt ledges fall back to the existing deterministic leash-safe steering without changing the authored X/Z destination, encounter identity or any PTU rule. All four populations"
          replacement = "PR #512 / implementation head `4764a9bba99585e8f69694bae22cb67e16e28658` rejects Minecraft-native CALM target columns when any cardinal MOTION_BLOCKING_NO_LEAVES neighbor differs by more than one block, so isolated pillars and abrupt ledges fall back to the existing deterministic leash-safe steering without changing the authored X/Z destination, encounter identity or any PTU rule. PR #513 / implementation head `0cf4744225b149797499e71835dfe53ec0ba9acd` validates every accepted native CALM path node against locally continuous MOTION_BLOCKING_NO_LEAVES surface support and rejects consecutive route-surface transitions greater than one block, preserving normal one-block slopes while falling back before an abrupt intermediate ledge. All four populations"
          if needle not in text:
              raise SystemExit('WORLD-013 plan anchor not found')
          p.write_text(text.replace(needle, replacement, 1))
          PY
          rm .github/workflows/world-013-plan-self-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/world-013-plan-self-patch.yml
          git commit -m "WORLD-013: record CALM path surface continuity (#513)"
          git push origin HEAD:world-013-calm-path-surface-continuity
