name: Ouros Structure Gate

on:
  pull_request:
    paths:
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/**'
      - 'fabric-adapter/src/main/java/io/autoptu/cobblemon/fabric/world/build/**'
      - '.github/workflows/build-review-pages.yml'
      - '.github/workflows/ouros-structure-gate.yml'

jobs:
  exact-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build production Fabric + Cobblemon mod set
        shell: bash
        run: |
          set -euo pipefail
          gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon

      - name: Export and structurally audit exact Minecraft build
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/ouros-structure-gate-server"
          output="$PWD/ouros-structure-gate/meridian-canopy-gym.blocks.json"
          mkdir -p "$server_dir/mods" "$(dirname "$output")"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.18.2/1.1.0/server/jar'

          server_pid=""
          stop_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
          }
          trap stop_server EXIT

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.ourosBuildManifestOutput="$output" \
              -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../ouros-structure-gate.log 2>&1
          ) &
          server_pid=$!

          ready=0
          for _ in $(seq 1 180); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU Ouros capture envelope audit passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Ouros floating component audit passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU exact Ouros build manifest export passed' "$latest" 2>/dev/null \
              && [ -s "$output" ]; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat ouros-structure-gate.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          grep 'AutoPTU Ouros capture envelope audit passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU Ouros floating component audit passed' "$server_dir/logs/latest.log"
          grep 'AutoPTU exact Ouros build manifest export passed' "$server_dir/logs/latest.log"

          python3 - <<'PY' "$output"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['geometryAuthority'] == 'live_server_final_blockstate_scan'
          assert data['captureEnvelopeAudit'] == 'passed'
          assert data['floatingComponentAudit'] == 'passed'
          assert data['blockCount'] == len(data['blocks'])
          assert len(data['geometrySha256']) == 64
          assert data['blockCount'] > 10000, data['blockCount']
          assert len(data['palette']) > 40, len(data['palette'])
          print(
              'Ouros structure gate passed:',
              data['blockCount'], 'blocks,',
              len(data['palette']), 'states,',
              data['structuralComponentCount'], 'anchored components,',
              data['geometrySha256']
          )
          PY
          stop_server

      - name: Upload exact structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ouros-structure-gate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ouros-structure-gate/**
            ouros-structure-gate.log
            ouros-structure-gate-server/logs/latest.log
