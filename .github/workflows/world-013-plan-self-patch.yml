name: WORLD-013 Plan Self Patch

on:
  push:
    branches:
      - world-013-calm-fallback-wild-occupancy
    paths:
      - '.github/workflows/world-013-plan-self-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-calm-fallback-wild-occupancy
          fetch-depth: 0
      - name: Record PR 518 in canonical Minecraft RPG queue
        shell: python
        run: |
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          old = "PR #517 / implementation head `bd5440e1f8198c7802d8dfae7007517b6a6cc311` rejects a newly computed Minecraft-native CALM route before movement starts when any actor-sized path node is blocked or already occupied by another interaction-active visible wild Pokemon, so the existing leash-safe replanning/deterministic fallback runs without changing the authored destination, encounter identity or PTU authority boundary. |"
          new = old[:-2] + " PR #518 / implementation head `168573428ba3ad55a701c11f4e6760c6e5e5c3dd` makes the direct CALM presentation probe and deterministic angular fallback reject actor-sized volume occupied by another interaction-active visible wild Pokemon, so a native-route rejection cannot immediately steer the same actor into that occupied space; the authored destination, habitat leash, canonical encounter identity and PTU authority boundary remain unchanged. |"
          if old not in text:
              raise SystemExit('WORLD-013 PR #517 anchor not found exactly once')
          if text.count(old) != 1:
              raise SystemExit(f'WORLD-013 PR #517 anchor count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new, 1))
      - name: Remove self-patch workflow and commit plan
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/world-013-plan-self-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/world-013-plan-self-patch.yml
          git diff --cached --check
          git commit -m 'WORLD-013: record PR 518 in tooling plan'
          git push origin HEAD:world-013-calm-fallback-wild-occupancy