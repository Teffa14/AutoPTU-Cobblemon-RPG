name: One-shot WORLD-013 plan update

on:
  push:
    paths:
      - '.github/workflows/one-shot-world013-plan-update.yml'

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch canonical tooling plan and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text(encoding='utf-8')
          old = "PR #531 / production head `dd62d38b57faf1ce903c4d69fed39cc8ab192d87` adds a visible deterministic CALM rest scan: an interaction-active Marea actor with idle native navigation, negligible horizontal motion and no nearby non-spectator player turns toward the authored habitat interior with a stable per-actor scan offset; WATCHING, ALARMED, recovery and native pathing retain priority and no PTU rule is inferred. These slices remain Minecraft presentation locomotion and do not add PTU movement, initiative, targeting, RNG or battle rules. |"
          new = "PR #531 / production head `dd62d38b57faf1ce903c4d69fed39cc8ab192d87` adds a visible deterministic CALM rest scan: an interaction-active Marea actor with idle native navigation, negligible horizontal motion and no nearby non-spectator player turns toward the authored habitat interior with a stable per-actor scan offset; WATCHING, ALARMED, recovery and native pathing retain priority and no PTU rule is inferred. PR #532 / merge `e8eeaee900ca0c79fa1762e16d64f8e5fc25ec9d` introduces the world-wide `WildBehaviorProfile`, `WildEcologyProjectionRegistry` and generic CALM idle-look runtime; Marea is reduced to an authored population adapter/fixture rather than the behavior architecture. PR #533 / production head `a74ecdcce382fbef663df6d961f7689a3eb976c5` / merge `40a27dfe5f9c6dd7893090b0e219518c88c22ad1` moves the normal ambient execution path for CALM roaming, same-population separation/cohesion, habitat recovery and WATCHING/ALARMED presentation into `WildAmbientBehaviorRuntime`, consuming population identity, habitat leash and behavior policy from the global ecology registry without region/species knowledge. New ecology work must continue removing behavior responsibility from `MareaWild*` runtimes: next globalize collision steering/native navigation, route recovery/continuity and reciprocal-yield intent handling. Missing additional complete WILD blueprints block activation of additional species/populations only; they do not block generic ecology infrastructure. These slices remain Minecraft presentation locomotion and do not add PTU movement, initiative, targeting, RNG or battle rules. |"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one WORLD-013 tail match, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-world013-plan-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m 'WORLD-013: record global wild ecology runtime'
          git push origin HEAD:main
