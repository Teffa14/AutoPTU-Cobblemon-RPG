name: One-shot canonical bag plan update

on:
  push:
    branches:
      - rpg/canonical-bag-query

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpg/canonical-bag-query
          fetch-depth: 0
      - name: Patch canonical tooling plan
        shell: python
        run: |
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          s = p.read_text()
          s = s.replace(
              '| CMD-060 | TODO | `/autoptu bag` |',
              '| CMD-060 | LIVE | `/autoptu bag` — PR pending on `rpg/canonical-bag-query`; reads only authenticated-player durable canonical stacks currently unreserved and spendable. |'
          )
          marker = '| SVC-025 | LIVE | `establishFieldCamp(attemptId, campId, player, task)` — PR #241 / implementation head `fcc356e4f2260caf4e7d142a23a4c03d5bf02d23`. The server derives physical camp identity, freezes canonical Trainer capability plus authored Ouros quality odds before resolution, persists one result exactly once, and reuses it after retry/reconnect/restart without creating PTU Feature policy or battle state. |'
          addition = marker + '\n| SVC-026 | LIVE | `readAvailableBag(player)` — PR pending on `rpg/canonical-bag-query`; aggregates only authenticated-player authored canonical stacks that are currently unreserved. Minecraft/Cobblemon inventory is never treated as RPG inventory truth, and in-flight reservations are excluded from spendable quantities. |'
          if '| SVC-026 |' not in s:
              s = s.replace(marker, addition)
          old = '| NEXT/PARTIAL | Canonical inventory quantities and wallet. PR #231 persists authored crafting ingredient quantities in canonical item stacks, PR #233 consumes those canonical quantities into exactly-once durable craft outputs from the normal workstation, PR #235 exposes the same canonical mutation through explicit recipe fallback requests, and PR #236 exposes recipe selection/readiness through the normal workstation. PR #238 / implementation commit `317cb76f879315fc9cc0f496c5fbd3b4ceaf74f8` closes the crash-recoverable Minecraft-to-canonical ingredient handoff. General bag semantics, transfer/use/equipment, and wallet remain TODO/NEXT. |'
          new = '| NEXT/PARTIAL | Canonical inventory quantities and wallet. PR #231 persists authored crafting ingredient quantities in canonical item stacks, PR #233 consumes those canonical quantities into exactly-once durable craft outputs from the normal workstation, PR #235 exposes the same canonical mutation through explicit recipe fallback requests, and PR #236 exposes recipe selection/readiness through the normal workstation. PR #238 / implementation commit `317cb76f879315fc9cc0f496c5fbd3b4ceaf74f8` closes the crash-recoverable Minecraft-to-canonical ingredient handoff. `/autoptu bag` and `readAvailableBag(player)` now expose spendable authenticated-player canonical stacks while excluding active reservations. Bag inspection, transfer/use/equipment, reserved-vs-total detail, and wallet remain TODO/NEXT. |'
          s = s.replace(old, new)
          p.write_text(s)
      - name: Remove one-shot workflow
        run: git rm .github/workflows/one-shot-canonical-bag-plan.yml
      - name: Commit plan update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m "Plan: record canonical bag query"
          git push origin HEAD:rpg/canonical-bag-query
