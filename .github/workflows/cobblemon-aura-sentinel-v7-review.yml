name: Aura Sentinel V7 Blockbench Review

on:
  push:
    branches: ['art/lucario-aura-sentinel-v7-reference-led']
    paths:
      - '.github/workflows/cobblemon-aura-sentinel-v7-review.yml'
      - 'tools/cobblemon-model-review/blockbench_capture.mjs'
      - 'tools/cobblemon-model-review/build_aura_sentinel_v7_reference_led.py'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0448_lucario/ouros_aura_sentinel*.png'
  pull_request:
    paths:
      - '.github/workflows/cobblemon-aura-sentinel-v7-review.yml'
      - 'tools/cobblemon-model-review/build_aura_sentinel_v7_reference_led.py'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0448_lucario/ouros_aura_sentinel*.png'
  workflow_dispatch:

permissions:
  contents: read

env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  JAR_SHA256: f7c25955176badc444ad6211fc556514fedbdba776227f105fe899f8819d74e3
  MODEL_SHA256: ccc5f4521fd71fcb4db548a0f0fd0ed41f83426f4a5c04efa473d8a20bef2de9
  ANIMATION_SHA256: ddf880b0830d7649f8cd8811c1c7e2b7fcdee156c850bbeb398f064995fa8563
  NORMAL_SHA256: 98c46f44f9e3428c8ecfd9f564d8d2e4c26ea60bee9ace6ff225c66f4803596a
  BLOCKBENCH_VERSION: '5.1.6'
  BLOCKBENCH_SHA256: c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e

jobs:
  blockbench-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install review dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64

      - name: Extract pinned official Lucario assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .review/official .review/output
          curl --fail --silent --show-error --location --retry 4 "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .review/version.json
          python - <<'PY' > .review/url
          import json
          d=json.load(open('.review/version.json')); f=next(x for x in d['files'] if x.get('primary'))
          assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and 'fabric' in d['loaders'] and '1.21.1' in d['game_versions']
          print(f['url'])
          PY
          curl --fail --silent --show-error --location --retry 4 "$(cat .review/url)" -o .review/cobblemon.jar
          echo "$JAR_SHA256  .review/cobblemon.jar" | sha256sum --check --strict
          unzip -p .review/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0448_lucario/lucario.geo.json' > .review/official/lucario.geo.json
          unzip -p .review/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0448_lucario/lucario.animation.json' > .review/official/lucario.animation.json
          unzip -p .review/cobblemon.jar 'assets/cobblemon/textures/pokemon/0448_lucario/lucario.png' > .review/official/lucario.png
          echo "$MODEL_SHA256  .review/official/lucario.geo.json" | sha256sum --check --strict
          echo "$ANIMATION_SHA256  .review/official/lucario.animation.json" | sha256sum --check --strict
          echo "$NORMAL_SHA256  .review/official/lucario.png" | sha256sum --check --strict
          python tools/cobblemon-model-review/validate_species_reference_dossier.py docs/cobblemon-skin-reference-dossiers/0448_lucario.json --expected-species lucario
          python tools/cobblemon-model-review/validate_original_model.py --official .review/official/lucario.geo.json --candidate fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json
          python tools/cobblemon-model-review/validate_cosmetic_attachment.py --official .review/official/lucario.geo.json --candidate fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json --anchor-gap 1.50 --piece-gap 1.00

      - name: Compose exact production texture plus accessory overlay
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0448_lucario')
          body=Image.open(root/'ouros_aura_sentinel.png').convert('RGBA')
          overlay=Image.open(root/'ouros_aura_sentinel_accessories.png').convert('RGBA')
          Image.alpha_composite(body,overlay).save('.review/aura.png',optimize=True)
          PY

      - name: Download pinned Blockbench
        run: |
          curl --fail --silent --show-error --location --retry 4 "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" -o .review/blockbench.AppImage
          echo "$BLOCKBENCH_SHA256  .review/blockbench.AppImage" | sha256sum --check --strict
          chmod +x .review/blockbench.AppImage
          (cd .review && ./blockbench.AppImage --appimage-extract >/dev/null)

      - name: Capture matched-camera official hero battle and structural evidence
        shell: bash
        run: |
          set -euo pipefail
          capture() {
            model="$1"; texture="$2"; anim="$3"; t="$4"; out="$5"; port="$6"; profile_in="$7"; profile_out="$8"
            rm -rf "$out" ".review/user-$port"; mkdir -p "$out" ".review/user-$port"
            xvfb-run -a -s '-screen 0 1600x1200x24' env APPDIR="$PWD/.review/squashfs-root" .review/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$PWD/.review/user-$port" "$model" >".review/blockbench-$port.log" 2>&1 &
            pid=$!
            for i in $(seq 1 90); do curl --fail --silent "http://127.0.0.1:$port/json/version" >/dev/null 2>&1 && break; kill -0 "$pid" 2>/dev/null || { cat ".review/blockbench-$port.log"; return 1; }; sleep 1; done
            args=(--endpoint "http://127.0.0.1:$port" --texture "$texture" --animation "$PWD/.review/official/lucario.animation.json" --animation-name "$anim" --animation-time "$t" --gameplay-resolution 160 --output-dir "$out")
            [ -n "$profile_in" ] && args+=(--camera-profile-in "$profile_in")
            [ -n "$profile_out" ] && args+=(--camera-profile-out "$profile_out")
            node tools/cobblemon-model-review/blockbench_capture.mjs "${args[@]}"
            kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          }
          official="$PWD/.review/official/lucario.geo.json"
          candidate="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json"
          capture "$official" "$PWD/.review/official/lucario.png" animation.lucario.ground_idle 0.35 "$PWD/.review/official-render" 9222 '' "$PWD/.review/camera.json"
          capture "$candidate" "$PWD/.review/aura.png" animation.lucario.ground_idle 0.35 "$PWD/.review/hero-render" 9223 "$PWD/.review/camera.json" ''
          capture "$candidate" "$PWD/.review/aura.png" animation.lucario.battle_idle 0.35 "$PWD/.review/battle-render" 9224 "$PWD/.review/camera.json" ''
          cp .review/official-render/three_quarter.png .review/output/official_reference_three_quarter.png
          cp .review/hero-render/three_quarter.png .review/output/hero_three_quarter.png
          cp .review/battle-render/three_quarter.png .review/output/battle_ready_three_quarter.png
          cp .review/hero-render/front.png .review/output/hero_front.png
          cp .review/hero-render/left.png .review/output/hero_left.png
          cp .review/hero-render/right.png .review/output/hero_right.png
          cp .review/hero-render/back.png .review/output/hero_back.png
          cp .review/hero-render/three_quarter_gameplay_160.png .review/output/hero_gameplay_160.png
          cp .review/battle-render/three_quarter_gameplay_160.png .review/output/battle_ready_gameplay_160.png
          sha256sum .review/output/*.png | sort > .review/output/png-sha256.txt
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.load(open('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0448_lucario/ouros_aura_sentinel_lucario.geo.json'))['minecraft:geometry'][0]
          extra=m['bones'][87:]
          report={'viewer':'Blockbench','version':'5.1.6','head':'${{ github.sha }}','officialModelSha256':'ccc5f4521fd71fcb4db548a0f0fd0ed41f83426f4a5c04efa473d8a20bef2de9','animationSha256':'ddf880b0830d7649f8cd8811c1c7e2b7fcdee156c850bbeb398f064995fa8563','originalBones':87,'totalBones':len(m['bones']),'cosmeticBones':len(extra),'cosmeticCubes':sum(len(b.get('cubes',[])) for b in extra),'animations':{'hero':['animation.lucario.ground_idle',0.35],'battle':['animation.lucario.battle_idle',0.35]},'walking':'No dedicated Bedrock walking clip; official poser uses q.biped_walk + q.bimanual_swing.'}
          Path('.review/output/review-contract.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aura-sentinel-v7-current-blockbench-review
          path: .review/output
          if-no-files-found: error
          retention-days: 14
