name: WORLD-013 PR506 Plan Self Patch

on:
  push:
    branches:
      - world-013-native-calm-navigation
    paths:
      - '.github/workflows/plan-world-013-pr506-selfpatch.yml'

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-native-calm-navigation
          fetch-depth: 0
      - name: Record WORLD-013 native navigation slice and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          s = p.read_text(encoding='utf-8')
          old = "PR #504 / merge `cd47bc79458393b76932c76b5887af48da2cec2c` makes low-speed CALM roaming probe Minecraft collision geometry and choose deterministic leash-safe detours, stopping rather than pushing through geometry when no safe detour exists."
          new = old + " PR #506 / implementation head `1c62d55559d756a1399949ea65b9c97f035302df` routes collision-blocked CALM roaming toward the same deterministic authored target through Minecraft native navigation when a leash-safe path can start, retaining the deterministic angular detour as fallback."
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one WORLD-013 PR #504 anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/plan-world-013-pr506-selfpatch.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/plan-world-013-pr506-selfpatch.yml
          git commit -m 'plan: record WORLD-013 PR 506 native navigation'
          git push origin HEAD:world-013-native-calm-navigation
