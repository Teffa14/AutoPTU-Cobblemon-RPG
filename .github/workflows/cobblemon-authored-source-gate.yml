name: Cobblemon Authored Source Gate
on:
  pull_request:
    paths:
      - 'tools/cobblemon-model-review/authored-sources/**'
      - 'tools/cobblemon-model-review/validate_authored_cosmetic_patch.py'
      - 'docs/cobblemon-skin-reference-dossiers/**'
permissions:
  contents: read
jobs:
  validate-authored-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate Lucario hard reference gate before authored geometry
        run: python tools/cobblemon-model-review/validate_species_reference_dossier.py docs/cobblemon-skin-reference-dossiers/0448_lucario.json --expected-species lucario
      - name: Validate authored cosmetic sources as rejection floors only
        run: |
          set -euo pipefail
          for patch in tools/cobblemon-model-review/authored-sources/0448_lucario/*.patch.json; do
            python tools/cobblemon-model-review/validate_authored_cosmetic_patch.py "$patch" --expected-species lucario
          done
