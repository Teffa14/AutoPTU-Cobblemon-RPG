name: Integration Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  plan-bookkeeping:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/svc-018-persistent-switch' && !contains(github.event.pull_request.head.sha, 'never') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/svc-018-persistent-switch
          fetch-depth: 0
      - name: Reconcile canonical RPG plan exactly once
        shell: python
        run: |
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = p.read_text()
          if 'PR #452 / production head `a03f605705f619cc9942b33a8e16010e9b797c5d`' in text:
              print('plan already reconciled')
              raise SystemExit(0)
          replacements = {
            "| SVC-010 | LIVE/PARTIAL | `canAcceptQuest(player, quest)` — PR #258 validates that the quest is server-authored, is offered by the revalidated canonical NPC and is not trusted from client metadata. PR #445 / production head `f41b19e0c36aa79610e6f82382fdf591b13205cc` adds server-authored required-accepted-quest prerequisites, projects locked/eligible state in physical NPC dialogue, and rechecks the durable journal immediately before acceptance so stale or unmet requests cannot mutate quest state. PR #446 / production head `48ab29537884d77a3d163ba6e2d669ea87b9637e` adds server-authored required story-flag prerequisites, projects the locked/eligible state in the physical Cedar Ranger dialogue, rechecks durable world-story state immediately before quest mutation, and routes both dialogue projection and acceptance through the lifecycle-managed world-scoped canonical story repository. Relationship and faction prerequisite predicates remain follow-up work. |": "| SVC-010 | LIVE/PARTIAL | `canAcceptQuest(player, quest)` — PR #258 validates that the quest is server-authored, is offered by the revalidated canonical NPC and is not trusted from client metadata. PR #445 / production head `f41b19e0c36aa79610e6f82382fdf591b13205cc` adds server-authored required-accepted-quest prerequisites. PR #446 / production head `48ab29537884d77a3d163ba6e2d669ea87b9637e` adds server-authored required story-flag prerequisites. PR #447 / merge `1873613bb0319152cd59151d328f912ebb813041` adds required-met-NPC relationship prerequisites and revalidates durable relationship state at the physical quest giver before journal mutation. Faction-reputation prerequisite predicates remain follow-up work. |",
            "| SVC-011 | LIVE/PARTIAL | `canAdvanceQuest(player, event)` — PR #380 / merge `69d752d06941cf49250e34f6385df90110515789` advances only accepted server-authored objectives from known server-observed event keys. Broader quest event/prerequisite policy remains follow-up work. |": "| SVC-011 | LIVE/PARTIAL | `canAdvanceQuest(player, event)` — PR #380 / merge `69d752d06941cf49250e34f6385df90110515789` advances only accepted server-authored objectives from known server-observed event keys. PR #448 / merge `6f660dd2197b5c0cc878f2d0d18d96a173818b03` adds physical canonical NPC-contact objective events. PR #449 / merge `6132af627d9f7b7bd577cf9045c94e8d64ced2de` advances Patient Approach from the canonical field-notes lectern. PR #450 / merge `23b4075dc4e919d9039825ad3966e120fae6f8f1` advances Trainer-record review from Sela Orrin using durable canonical records. PR #451 / merge `9293df487d5b988bc1af276b02d9026a11d08769` adds authored objective prerequisites so the Tideglass comparison requires both location observations before the physical return to Taro. Additional authored event/prerequisite types remain follow-up work. |",
            "| SVC-018 | LIVE/PARTIAL | Persistent world-object mutation/idempotency — PR #417 / implementation head `44b3b3c62a5a699e572f6309ce9ad803f6250a78`; the existing atomic revisioned world-event object aggregate is now consumed by Fabric to project ACTIVATED shrine state into the physical world idempotently. The projection reuses canonical persisted state, ignores non-shrine blocks and creates no PTU legality, progression, reward or battle outcome. Additional authored mutation types remain follow-up work. |": "| SVC-018 | LIVE/PARTIAL | Persistent world-object mutation/idempotency — PR #417 / implementation head `44b3b3c62a5a699e572f6309ce9ad803f6250a78` projects ACTIVATED shrine state. PR #452 / production head `a03f605705f619cc9942b33a8e16010e9b797c5d` adds server-owned durable lever, door, trapdoor and fence-gate activation, restart reconciliation, idempotent replay and correct lever redstone-neighbor propagation without PTU inference. Additional authored mutation types remain follow-up work. |",
            "| WORLD-024 | LIVE/PARTIAL | Persistent world-event objects — PR #368 / merge `5d1910dfe25458da26fadfb2230e2b4ac5a5f165` persists world-scoped DORMANT -> ACTIVATED state exactly once. PR #417 / implementation head `44b3b3c62a5a699e572f6309ce9ad803f6250a78` now projects the durable activated shrine state back into the physical Respawn Anchor as a fully charged visible state on authorized interaction, idempotently and without PTU inference. Additional authored world-event object types remain follow-up work. |": "| WORLD-024 | LIVE/PARTIAL | Persistent world-event objects — PR #368 / merge `5d1910dfe25458da26fadfb2230e2b4ac5a5f165` persists world-scoped DORMANT -> ACTIVATED state exactly once. PR #417 / implementation head `44b3b3c62a5a699e572f6309ce9ad803f6250a78` projects durable shrine activation. PR #452 / production head `a03f605705f619cc9942b33a8e16010e9b797c5d` extends the same canonical world-event projection to authored levers, doors, trapdoors and fence gates, including restart replay and lever redstone propagation. Additional authored world-event object types remain follow-up work. |",
            "| RPG-003 | LIVE/PARTIAL | Quest objective event processing — PR #380 / merge `69d752d06941cf49250e34f6385df90110515789` persists owner-scoped objective progress from server-observed Cedar Meadow events and exposes it in the quest journal. Additional authored objective event types remain follow-up work. |": "| RPG-003 | LIVE/PARTIAL | Quest objective event processing — PR #380 / merge `69d752d06941cf49250e34f6385df90110515789` persists owner-scoped objective progress from server-observed Cedar Meadow events. PRs #448-#451 extend that same authority boundary to physical NPC contact, field-note review, Trainer-record review and ordered location/return objectives. Additional authored objective event types remain follow-up work. |",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact plan row, got {count}: {old[:90]}')
              text = text.replace(old, new)
          p.write_text(text)
      - name: Commit canonical plan reconciliation
        run: |
          if git diff --quiet -- MINECRAFT_RPG_TOOLING_PLAN.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git diff --cached --check
          git commit -m "Docs: reconcile shipped RPG slices [plan-bookkeeping]"
          git push origin HEAD:feat/svc-018-persistent-switch

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare test evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-evidence/runtime test-evidence/visual
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
          } > test-evidence/run-metadata.txt
      - name: Run authority tests
        shell: bash
        run: |
          set -euo pipefail
          gradle test --no-daemon 2>&1 | tee test-evidence/gradle-test.log
      - name: Prepare production Fabric + Cobblemon smoke mods
        shell: bash
        run: |
          set -euo pipefail
          gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon 2>&1 | tee test-evidence/prepare-production-smoke.log
      - name: Boot production Fabric + Cobblemon dedicated server twice
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/fabric-production-smoke"
          mkdir -p "$server_dir/mods"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"

          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.17.2/1.0.3/server/jar'

          server_pid=""
          stop_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
          }
          cleanup() {
            stop_server
          }
          trap cleanup EXIT

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.liveRelocationSmoke=true \
              -Dautoptu.liveHealthSmoke=true \
              -Dautoptu.liveBattleInterceptionSmoke=true \
              -Dautoptu.liveAuthenticatedPlayerContextSmoke=true \
              -Dautoptu.liveHealingStationSmoke=true \
              -Dautoptu.liveFastTravelSmoke=true \
              -Dautoptu.liveInnRestSmoke=true \
              -Dautoptu.liveMoveTutorSmoke=true \
              -Dautoptu.liveRpgProtectionSmoke=true \
              -Dautoptu.liveCraftingWorkstationSmoke=true \
              -Dautoptu.liveCanonicalStoreRestartSmoke=seed \
              -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../fabric-server-smoke-first.log 2>&1
          ) &
          server_pid=$!

          first_ready=0
          for _ in $(seq 1 180); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU Fabric server adapter initialized' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Cobblemon runtime detected:' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon relocation smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon HP projection smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon battle interception smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live authenticated player context smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Cobblemon healing machine reuse smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live Minecraft lodestone fast travel surface smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live namespaced PTU recovery bed smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live canonical move tutor shell smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live RPG actor damage protection smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live canonical crafting workstation smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live canonical player store seed smoke passed' "$latest" 2>/dev/null \
              && grep -q 'Done (' "$latest" 2>/dev/null; then
              first_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$first_ready" -ne 1 ]; then
            cat fabric-server-smoke-first.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          cp "$server_dir/logs/latest.log" "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical move tutor shell smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical crafting workstation smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical player store seed smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          stop_server

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.liveCanonicalStoreRestartSmoke=verify \
              -Xms512M -Xmx2G -jar fabric-server-launch.jar nogui > ../fabric-server-smoke-restart.log 2>&1
          ) &
          server_pid=$!

          second_ready=0
          for _ in $(seq 1 180); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU Fabric server adapter initialized' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Cobblemon runtime detected:' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU live canonical player store restart smoke passed' "$latest" 2>/dev/null \
              && grep -q 'Done (' "$latest" 2>/dev/null; then
              second_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$second_ready" -ne 1 ]; then
            cat fabric-server-smoke-restart.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          cp "$server_dir/logs/latest.log" "$server_dir/autoptu-second-boot-latest.log"
          grep 'AutoPTU live Cobblemon relocation smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Cobblemon HP projection smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Cobblemon battle interception smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live authenticated player context smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Cobblemon healing machine reuse smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live Minecraft lodestone fast travel surface smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live namespaced PTU recovery bed smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical move tutor shell smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live RPG actor damage protection smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical crafting workstation smoke passed' "$server_dir/autoptu-first-boot-latest.log"
          grep 'AutoPTU live canonical player store restart smoke passed' "$server_dir/autoptu-second-boot-latest.log"
      - name: Collect runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p test-evidence/runtime
          cp fabric-server-smoke-first.log test-evidence/runtime/fabric-server-smoke-first.log 2>/dev/null || true
          cp fabric-server-smoke-restart.log test-evidence/runtime/fabric-server-smoke-restart.log 2>/dev/null || true
          cp fabric-production-smoke/autoptu-first-boot-latest.log test-evidence/runtime/minecraft-first-boot-latest.log 2>/dev/null || true
          cp fabric-production-smoke/autoptu-second-boot-latest.log test-evidence/runtime/minecraft-second-boot-latest.log 2>/dev/null || true
          cp fabric-production-smoke/logs/debug.log test-evidence/runtime/minecraft-second-boot-debug.log 2>/dev/null || true

          first="fabric-production-smoke/autoptu-first-boot-latest.log"
          second="fabric-production-smoke/autoptu-second-boot-latest.log"
          manifest="test-evidence/runtime/smoke-markers.txt"
          : > "$manifest"
          record_marker() {
            file="$1"
            marker="$2"
            if [ -f "$file" ] && grep -F "$marker" "$file" >> "$manifest"; then
              true
            else
              echo "MISSING: $marker" >> "$manifest"
            fi
          }
          record_marker "$first" 'AutoPTU Fabric server adapter initialized'
          record_marker "$first" 'AutoPTU Cobblemon runtime detected:'
          record_marker "$first" 'AutoPTU live Cobblemon relocation smoke passed'
          record_marker "$first" 'AutoPTU live Cobblemon HP projection smoke passed'
          record_marker "$first" 'AutoPTU live Cobblemon battle interception smoke passed'
          record_marker "$first" 'AutoPTU live authenticated player context smoke passed'
          record_marker "$first" 'AutoPTU live Cobblemon healing machine reuse smoke passed'
          record_marker "$first" 'AutoPTU live Minecraft lodestone fast travel surface smoke passed'
          record_marker "$first" 'AutoPTU live namespaced PTU recovery bed smoke passed'
          record_marker "$first" 'AutoPTU live canonical move tutor shell smoke passed'
          record_marker "$first" 'AutoPTU live RPG actor damage protection smoke passed'
          record_marker "$first" 'AutoPTU live canonical crafting workstation smoke passed'
          record_marker "$first" 'AutoPTU live canonical player store seed smoke passed'
          record_marker "$first" 'Done ('
          record_marker "$second" 'AutoPTU Fabric server adapter initialized'
          record_marker "$second" 'AutoPTU Cobblemon runtime detected:'
          record_marker "$second" 'AutoPTU live canonical player store restart smoke passed'
          record_marker "$second" 'Done ('

          cat > test-evidence/visual/README.txt <<'EOF'
          Visual evidence belongs here when a test runs with a graphical Minecraft client.
          Store MP4 recordings and PNG screenshots in this directory. The CI artifact upload
          step collects them automatically. Dedicated-server smokes are headless, so they
          produce runtime logs and marker evidence rather than video.
          EOF
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-evidence/**
            build/test-results/test/**
            build/reports/tests/test/**
            fabric-adapter/build/test-results/test/**
            fabric-adapter/build/reports/tests/test/**
