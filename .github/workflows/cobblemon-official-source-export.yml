name: Cobblemon Official Source Export

on:
  push:
    branches:
      - feat/cobblemon-skin-studio-clean-v2
    paths:
      - '.github/workflows/cobblemon-official-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COBBLEMON_VERSION_ID: kF7CvxTo

jobs:
  export-pikachu-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified official Cobblemon 1.7.3 Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .official-source
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -A 'Ouros-AutoPTU-Cobblemon-RPG/source-export' \
            "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" \
            -o .official-source/version.json
          python - <<'PY' > .official-source/download.env
          import json, shlex
          data = json.load(open('.official-source/version.json', encoding='utf-8'))
          assert data['id'] == 'kF7CvxTo'
          assert data['version_number'] == '1.7.3'
          primary = next(f for f in data['files'] if f.get('primary'))
          assert primary['filename'] == 'Cobblemon-fabric-1.7.3+1.21.1.jar'
          print('URL=' + shlex.quote(primary['url']))
          print('SHA512=' + shlex.quote(primary['hashes']['sha512']))
          PY
          source .official-source/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .official-source/cobblemon.jar
          printf '%s  %s\n' "$SHA512" '.official-source/cobblemon.jar' | sha512sum --check --strict

      - name: Extract exact Pikachu source bundle
        shell: bash
        run: |
          set -euo pipefail
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_male.geo.json' > .official-source/pikachu_male.geo.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0025_pikachu/pikachu_female.geo.json' > .official-source/pikachu_female.geo.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0025_pikachu/pikachu.animation.json' > .official-source/pikachu.animation.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/posers/0025_pikachu/pikachu.json' > .official-source/pikachu.poser.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/resolvers/0025_pikachu/0_pikachu_base.json' > .official-source/pikachu.resolver.json
          unzip -p .official-source/cobblemon.jar 'assets/cobblemon/textures/pokemon/0025_pikachu/pikachu.png' > .official-source/pikachu.png
          sha256sum \
            .official-source/pikachu_male.geo.json \
            .official-source/pikachu_female.geo.json \
            .official-source/pikachu.animation.json \
            .official-source/pikachu.poser.json \
            .official-source/pikachu.resolver.json \
            .official-source/pikachu.png \
            > .official-source/SHA256SUMS
          grep '^f8ea21f6821d49e8a358f05d43562312a0e018e883f1354aa1445d2a0b432c83  .official-source/pikachu_male.geo.json$' .official-source/SHA256SUMS
          test -s .official-source/pikachu_female.geo.json

      - name: Upload exact official source bundle
        uses: actions/upload-artifact@v4
        with:
          name: cobblemon-1.7.3-pikachu-official-source
          path: |
            .official-source/pikachu_male.geo.json
            .official-source/pikachu_female.geo.json
            .official-source/pikachu.animation.json
            .official-source/pikachu.poser.json
            .official-source/pikachu.resolver.json
            .official-source/pikachu.png
            .official-source/SHA256SUMS
            .official-source/version.json
          if-no-files-found: error
          retention-days: 3
