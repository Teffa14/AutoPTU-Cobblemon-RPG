name: Temporary CMD-041 plan patch

on:
  push:
    branches:
      - feat/cmd-041-care-status

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cmd-041-care-status
          fetch-depth: 0
      - name: Patch canonical tooling plan and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          text = path.read_text()
          old = '| CMD-041 | TODO | `/autoptu care status` |'
          new = '| CMD-041 | LIVE | `/autoptu care status` — PR #335; authenticated server-side projection of persisted canonical party HP, statuses, injuries and revisions. Recovery eligibility/effects remain outside Minecraft until an authoritative PTU recovery contract exists. |'
          if old not in text:
              raise SystemExit('CMD-041 TODO line not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('CMD-041 TODO line is not unique')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/tmp-cmd-041-plan-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/tmp-cmd-041-plan-patch.yml
          git commit -m 'Plan: mark CMD-041 care status live'
          git push origin HEAD:feat/cmd-041-care-status
