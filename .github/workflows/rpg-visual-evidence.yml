name: RPG Visual Evidence

on:
  pull_request:
    paths:
      - 'fabric-adapter/**'
      - '.github/workflows/rpg-visual-evidence.yml'
  workflow_dispatch:

jobs:
  graphical-client-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install virtual display tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick
      - name: Prepare production Fabric + Cobblemon mods
        run: gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon
      - name: Prepare graphical evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-evidence/visual graphical-client/mods
          cp fabric-adapter/build/production-smoke/mods/*.jar graphical-client/mods/
          printf 'eula=true\n' > graphical-client/eula.txt
          cat > graphical-client/options.txt <<'EOF'
          fullscreen:false
          autoJump:false
          guiScale:3
          renderDistance:8
          entityDistanceScaling:1.0
          pauseOnLostFocus:false
          EOF
      - name: Launch Minecraft client under virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 > xvfb.log 2>&1 &
          export DISPLAY=:99
          # Loom's runClient uses the exact pinned Minecraft/Fabric/Cobblemon development runtime.
          # A deterministic operator scene is created by the mod after a local world is available;
          # this first graphical slice proves that the real client can boot and yields client PNG evidence.
          timeout 180s gradle :fabric-adapter:runClient --no-daemon > graphical-client.log 2>&1 &
          client_pid=$!
          ready=0
          for _ in $(seq 1 120); do
            if grep -q 'Setting user:' graphical-client.log 2>/dev/null || grep -q 'Backend library:' graphical-client.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat graphical-client.log || true
            exit 1
          fi
          sleep 15
          import -window root test-evidence/visual/minecraft-client-boot.png
          kill "$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true
          test -s test-evidence/visual/minecraft-client-boot.png
      - name: Upload graphical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-visual-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            test-evidence/visual/**
            graphical-client.log
            xvfb.log
