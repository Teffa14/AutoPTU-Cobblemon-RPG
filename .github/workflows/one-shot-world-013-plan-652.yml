name: One-shot WORLD-013 plan bookkeeping

on:
  push:
    branches:
      - world-013-plan-652

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-plan-652
      - name: Record shipped dormant WILD physics slices
        shell: python
        run: |
          from pathlib import Path

          path = Path("MINECRAFT_RPG_TOOLING_PLAN.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          marker = "| WORLD-013 | NEXT/PARTIAL |"
          record = (
              "PR #649 / merge `fd84b7d9bfbc1a0cab7edd546ebd5ec2193c47dc` suspends dormant WILD presentation navigation, velocity and AI while preserving canonical binding. "
              "PR #650 / merge `7ae7a587160e477e5f223ebb325880768afe1373` mutes dormant or hidden WILD presentation and restores ambient audio when active. "
              "PR #651 / merge `e98467f71d7bc340668dd591c49a268aaba8d6fa` removes Minecraft collision from inactive or hidden WILD presentation and restores it when visible and interaction-active. "
              "PR #652 / merge `45b1c56043860b598b67a3c60d0df1bf0fe2aaac` pins loaded dormant WILD presentation at its suspension position every server tick so no-clip or gravity physics cannot drift the actor before reactivation, without changing flight/no-gravity state or PTU movement authority. "
          )
          matches = [i for i, line in enumerate(lines) if line.startswith(marker)]
          if len(matches) != 1:
              raise SystemExit(f"expected one WORLD-013 row, found {len(matches)}")
          index = matches[0]
          if "PR #652 / merge `45b1c56043860b598b67a3c60d0df1bf0fe2aaac`" in lines[index]:
              raise SystemExit("WORLD-013 already records PR #652; refusing duplicate edit")
          if not lines[index].endswith(" |"):
              raise SystemExit("WORLD-013 row has unexpected ending; refusing broad edit")
          lines[index] = lines[index][:-2] + " " + record + "|"
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Remove one-shot workflow and commit exact plan edit
        run: |
          rm .github/workflows/one-shot-world-013-plan-652.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MINECRAFT_RPG_TOOLING_PLAN.md .github/workflows/one-shot-world-013-plan-652.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Record WORLD-013 PR #652"
          git push origin HEAD:world-013-plan-652