name: Review Storm Courier In Blockbench (legacy v3)

on:
  pull_request:
    paths:
      - '.github/workflows/cobblemon-storm-courier-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-review-retired:
    runs-on: ubuntu-latest
    steps:
      - name: Point reviewers to the v4 full-transformation gate
        run: |
          echo 'Storm Courier v3 review is retired.'
          echo 'Use .github/workflows/cobblemon-storm-courier-v4-review.yml.'
          echo 'The v4 gate validates exact official anatomy, full-surface derived textures, matched-camera Blockbench evidence, official animations, and gameplay-scale readability.'
