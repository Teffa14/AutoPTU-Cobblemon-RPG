name: Solar Legion Real Blockbench Evidence

on:
  push:
    branches: ['skin/charizard-solar-legion']
    paths:
      - '.github/workflows/cobblemon-solar-legion-poses.yml'
      - 'tools/cobblemon-model-review/**'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0006_charizard/ouros_solar_legion_charizard.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0006_charizard/ouros_solar_legion_accessories.png'
  workflow_dispatch:

permissions: {contents: write}
concurrency:
  group: solar-legion-real-evidence-${{ github.ref }}
  cancel-in-progress: true
env:
  COBBLEMON_VERSION_ID: kF7CvxTo
  BLOCKBENCH_VERSION: 5.1.6
  BLOCKBENCH_SHA256: c6dd92036f3c10495df53911a74e5b00a1d557ea13e506084177ef55a5cd7c0e

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Blockbench review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64
      - name: Extract exact official Charizard source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pose/official
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors -A 'Ouros-Charizard-Blockbench' "https://api.modrinth.com/v2/version/${COBBLEMON_VERSION_ID}" -o .pose/version.json
          python - <<'PY' > .pose/download.env
          import json,shlex
          d=json.load(open('.pose/version.json')); assert d['id']=='kF7CvxTo' and d['version_number']=='1.7.3' and d['game_versions']==['1.21.1'] and 'fabric' in d['loaders']
          p=next(f for f in d['files'] if f.get('primary')); assert p['filename']=='Cobblemon-fabric-1.7.3+1.21.1.jar'; print('URL='+shlex.quote(p['url'])); print('SHA512='+shlex.quote(p['hashes']['sha512']))
          PY
          source .pose/download.env
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$URL" -o .pose/cobblemon.jar
          printf '%s  %s\n' "$SHA512" .pose/cobblemon.jar | sha512sum --check --strict
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/models/0006_charizard/charizard.geo.json' > .pose/official/charizard.geo.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/bedrock/pokemon/animations/0006_charizard/charizard.animation.json' > .pose/official/charizard.animation.json
          unzip -p .pose/cobblemon.jar 'assets/cobblemon/textures/pokemon/0006_charizard/charizard.png' > .pose/official/charizard.png
          test "$(sha256sum .pose/official/charizard.geo.json|awk '{print $1}')" = b0e4a255876ef0cda88d0f61c9773bdcb7aee852cde929da49cda0da817bcadb
          test "$(sha256sum .pose/official/charizard.animation.json|awk '{print $1}')" = f16a510fec4fb00d8669ba07bee40e4ee80fb41e7cf4d798597a97da33d3880b
          test "$(sha256sum .pose/official/charizard.png|awk '{print $1}')" = b2990c16bdf37002ee9a5ad3a68a562d03e8cd7105510a84c396e9e757ba3215
      - name: Prove official anatomy and build exact composite texture
        shell: bash
        run: |
          set -euo pipefail
          python tools/cobblemon-model-review/validate_original_model.py --official .pose/official/charizard.geo.json --candidate fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0006_charizard/ouros_solar_legion_charizard.geo.json
          python - <<'PY'
          from PIL import Image
          b=Image.open('.pose/official/charizard.png').convert('RGBA'); o=Image.open('fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0006_charizard/ouros_solar_legion_accessories.png').convert('RGBA'); assert b.size==o.size==(256,128)
          Image.alpha_composite(b,o).save('.pose/solar-legion.png',optimize=True)
          PY
      - name: Download pinned Blockbench
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "https://github.com/JannisX11/blockbench/releases/download/v${BLOCKBENCH_VERSION}/Blockbench_${BLOCKBENCH_VERSION}.AppImage" -o .pose/blockbench.AppImage
          printf '%s  %s\n' "$BLOCKBENCH_SHA256" .pose/blockbench.AppImage | sha256sum --check --strict
          chmod +x .pose/blockbench.AppImage
          (cd .pose && ./blockbench.AppImage --appimage-extract >/dev/null)
      - name: Render matched-camera official, hero, battle, walk and flight states
        shell: bash
        run: |
          set -euo pipefail
          root=test-evidence/visual/cobblemon-skins/0006_charizard/solar-legion-real-poses
          rm -rf "$root" .pose/renders; mkdir -p "$root" .pose/renders
          cleanup(){ pid="${1:-}"; [ -z "$pid" ] || kill "$pid" 2>/dev/null || true; [ -z "$pid" ] || wait "$pid" 2>/dev/null || true; pkill -f "$PWD/.pose/squashfs-root/blockbench" 2>/dev/null || true; sleep 2; }
          one(){ model="$1"; texture="$2"; anim="$3"; frame="$4"; out="$5"; port="$6"; name="$7"; attempt="$8"; user="$PWD/.pose/user-${name}-${attempt}"; log="$PWD/.pose/${name}-${attempt}.log"; rm -rf "$user" "$out"; mkdir -p "$user" "$out"; xvfb-run -a -s '-screen 0 1800x1400x24' env APPDIR="$PWD/.pose/squashfs-root" .pose/squashfs-root/AppRun --no-sandbox --disable-gpu-sandbox --disable-vulkan --use-angle=swiftshader --use-gl=angle --remote-debugging-port="$port" --userData "$user" "$model" >"$log" 2>&1 & pid=$!; ready=0; for _ in $(seq 1 90); do if curl --fail --silent "http://127.0.0.1:${port}/json/version" >/dev/null 2>&1; then ready=1; break; fi; kill -0 "$pid" 2>/dev/null || { cat "$log"; cleanup "$pid"; return 1; }; sleep 1; done; [ "$ready" = 1 ] || { cat "$log"; cleanup "$pid"; return 1; }; node tools/cobblemon-model-review/blockbench_capture.mjs --endpoint "http://127.0.0.1:${port}" --texture "$texture" --animation "$PWD/.pose/official/charizard.animation.json" --animation-name "$anim" --animation-time "$frame" --output-dir "$out" || { cat "$log"; cleanup "$pid"; return 1; }; cleanup "$pid"; }
          render(){ for a in 1 2 3; do one "$1" "$2" "$3" "$4" "$5" "$6" "$7" "$a" && return 0; done; return 1; }
          official="$PWD/.pose/official/charizard.geo.json"; hero="$PWD/fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0006_charizard/ouros_solar_legion_charizard.geo.json"
          render "$official" "$PWD/.pose/official/charizard.png" animation.charizard.ground_idle 0.35 "$PWD/.pose/renders/official" 9271 official
          render "$hero" "$PWD/.pose/solar-legion.png" animation.charizard.ground_idle 0.35 "$PWD/.pose/renders/hero" 9272 hero
          render "$hero" "$PWD/.pose/solar-legion.png" animation.charizard.battle_idle 0.35 "$PWD/.pose/renders/battle" 9273 battle
          render "$hero" "$PWD/.pose/solar-legion.png" animation.charizard.ground_walk 0.25 "$PWD/.pose/renders/walk" 9274 walk
          render "$hero" "$PWD/.pose/solar-legion.png" animation.charizard.air_fly 0.25 "$PWD/.pose/renders/fly" 9275 fly
          cp .pose/renders/official/three_quarter.png "$root/official_reference_three_quarter.png"
          cp .pose/renders/hero/three_quarter.png "$root/hero_three_quarter.png"
          cp .pose/renders/battle/three_quarter.png "$root/battle_ready_three_quarter.png"
          cp .pose/renders/walk/three_quarter.png "$root/walking_three_quarter.png"
          cp .pose/renders/fly/three_quarter.png "$root/air_fly_three_quarter.png"
          cp .pose/renders/hero/front.png "$root/hero_front.png"; cp .pose/renders/hero/left.png "$root/hero_left.png"; cp .pose/renders/hero/right.png "$root/hero_right.png"; cp .pose/renders/hero/back.png "$root/hero_back.png"
      - name: Validate evidence provenance and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          expected={'official':('animation.charizard.ground_idle',130),'hero':('animation.charizard.ground_idle',138),'battle':('animation.charizard.battle_idle',138),'walk':('animation.charizard.ground_walk',138),'fly':('animation.charizard.air_fly',138)}
          for n,(a,b) in expected.items():
              m=json.loads((Path('.pose/renders')/n/'blockbench-metadata.json').read_text()); assert m['viewer']=='Blockbench' and m['sourceOfTransforms']=='Blockbench Bedrock animation codec' and m['modelInfo']['boneCount']==b and m['modelInfo']['appliedAnimation']['name']==a
          root=Path('test-evidence/visual/cobblemon-skins/0006_charizard/solar-legion-real-poses'); names=['official_reference_three_quarter.png','hero_three_quarter.png','battle_ready_three_quarter.png','walking_three_quarter.png','air_fly_three_quarter.png','hero_front.png','hero_left.png','hero_right.png','hero_back.png']; hashes={}
          for n in names:
              p=root/n; im=Image.open(p).convert('RGBA'); assert im.size==(1024,1024) and im.getbbox() is not None; hashes[n]=hashlib.sha256(p.read_bytes()).hexdigest()
          animations=set(json.loads(Path('.pose/official/charizard.animation.json').read_text())['animations'])
          for a in ['animation.charizard.ground_idle','animation.charizard.battle_idle','animation.charizard.ground_walk','animation.charizard.air_fly']: assert a in animations
          meta={'format':'ouros.cobblemon-blockbench-pose-evidence.v1','viewer':'Blockbench 5.1.6','modelSource':'official Cobblemon 1.7.3 Fabric JAR, Modrinth kF7CvxTo','modelSha256':'b0e4a255876ef0cda88d0f61c9773bdcb7aee852cde929da49cda0da817bcadb','animationSha256':'f16a510fec4fb00d8669ba07bee40e4ee80fb41e7cf4d798597a97da33d3880b','textureSha256':'b2990c16bdf37002ee9a5ad3a68a562d03e8cd7105510a84c396e9e757ba3215','originalBoneCount':130,'derivedBoneCount':138,'poses':{'hero':{'animation':'animation.charizard.ground_idle','time':0.35},'battle_ready':{'animation':'animation.charizard.battle_idle','time':0.35},'walking':{'animation':'animation.charizard.ground_walk','time':0.25},'air_fly':{'animation':'animation.charizard.air_fly','time':0.25}},'files':hashes}
          (root/'pose-metadata.json').write_text(json.dumps(meta,indent=2)+'\n'); print(json.dumps(meta,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solar-legion-real-poses
          path: test-evidence/visual/cobblemon-skins/0006_charizard/solar-legion-real-poses
          if-no-files-found: error
          retention-days: 14
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          root=test-evidence/visual/cobblemon-skins/0006_charizard/solar-legion-real-poses
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root"; if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Evidence: add Solar Legion Blockbench review'
          git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin HEAD:"${GITHUB_REF_NAME}"
