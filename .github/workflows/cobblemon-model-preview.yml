name: Cobblemon Model Preview

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'tools/cobblemon-model-review/**'
      - '.github/workflows/cobblemon-model-preview.yml'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu.geo.json'
      - 'fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic renderer dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pillow==11.0.0

      - name: Fetch exact Cobblemon Pikachu base texture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview-input
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/codemonkey85/Cobblemon-Mirror/main/common/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/pikachu.png' \
            -o .preview-input/pikachu.png
          python - <<'PY'
          from PIL import Image
          img = Image.open('.preview-input/pikachu.png')
          assert img.size == (64, 64), img.size
          assert img.mode in ('RGBA', 'RGB')
          print('Cobblemon Pikachu texture:', img.size, img.mode)
          PY

      - name: Render exact model orthographic and decision poses
        shell: bash
        run: |
          set -euo pipefail
          out='test-evidence/visual/cobblemon-skins/0025_pikachu/ouros_storm_courier'
          rm -rf "$out"
          python tools/cobblemon-model-review/render_bedrock_model.py \
            --model fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu.geo.json \
            --base-texture .preview-input/pikachu.png \
            --accessory-texture fabric-adapter/src/main/resources/assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png \
            --output-dir "$out" \
            --pose-set all \
            --size 1024

      - name: Validate PNG evidence is non-empty, distinct and model-derived
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image

          root = Path('test-evidence/visual/cobblemon-skins/0025_pikachu/ouros_storm_courier')
          model_path = Path('fabric-adapter/src/main/resources/assets/cobblemon/bedrock/pokemon/models/0025_pikachu/ouros_storm_courier_pikachu.geo.json')
          model = json.loads(model_path.read_text(encoding='utf-8'))
          bones = model['minecraft:geometry'][0]['bones']
          names = {b['name'] for b in bones}
          original = {
              'pikachu', 'body', 'torso', 'head', 'mouth_closed', 'mouth_open', 'eyes',
              'eye_right', 'eyelid_right', 'eye_left', 'eyelid_left', 'ear_left', 'ear_right',
              'arm_right', 'arm_left', 'tail', 'leg_right', 'foot_right', 'toes_right',
              'leg_left', 'foot_left', 'toes_left'
          }
          accessories = {
              'ouros_courier_goggles', 'ouros_courier_harness',
              'ouros_courier_pack', 'ouros_courier_tail_clamp'
          }
          assert original <= names
          assert accessories <= names
          assert len(bones) == 26, len(bones)

          files = {
              'front': root / 'front.png',
              'left': root / 'left.png',
              'right': root / 'right.png',
              'back': root / 'back.png',
              'hero_three_quarter': root / 'poses/hero_three_quarter.png',
              'battle_ready': root / 'poses/battle_ready.png',
              'walking': root / 'poses/walking.png',
          }
          hashes = {}
          bboxes = {}
          for name, path in files.items():
              img = Image.open(path).convert('RGBA')
              assert img.size == (1024, 1024), (name, img.size)
              bbox = img.getchannel('A').getbbox()
              assert bbox is not None, name
              assert (bbox[2] - bbox[0]) > 180, (name, bbox)
              assert (bbox[3] - bbox[1]) > 300, (name, bbox)
              hashes[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              bboxes[name] = bbox
          assert len(set(hashes.values())) == len(hashes), hashes
          for posed in ('hero_three_quarter', 'battle_ready', 'walking'):
              assert hashes[posed] not in {hashes[v] for v in ('front', 'left', 'right', 'back')}

          metadata = {
              'format': 'ouros.cobblemon-model-review.v2',
              'sourceModel': str(model_path),
              'sourceModelSha256': hashlib.sha256(model_path.read_bytes()).hexdigest(),
              'baseTexture': 'Cobblemon-Mirror:0025_pikachu/pikachu.png',
              'accessoryTexture': 'assets/cobblemon/textures/pokemon/0025_pikachu/ouros_storm_courier_accessories.png',
              'renderer': 'tools/cobblemon-model-review/render_bedrock_model.py',
              'orthographicViews': {k: hashes[k] for k in ('front', 'left', 'right', 'back')},
              'decisionPoses': {k: hashes[k] for k in ('hero_three_quarter', 'battle_ready', 'walking')},
              'boundingBoxes': {k: list(v) for k, v in bboxes.items()},
              'note': 'Software-rasterized from the exact Bedrock geometry and textures. Decision poses articulate the model existing bone hierarchy only; they are not generative imagery and do not modify production animation data.'
          }
          (root / 'render-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(metadata, indent=2))
          PY

      - name: Commit real model previews to branch
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-evidence/visual/cobblemon-skins/0025_pikachu/ouros_storm_courier
          if git diff --cached --quiet; then
            echo 'No preview changes to commit.'
            exit 0
          fi
          git commit -m 'RPG: add Storm Courier decision pose previews'
          git push origin HEAD:"${GITHUB_REF_NAME}"
