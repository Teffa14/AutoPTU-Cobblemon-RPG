name: WORLD-013 Plan Self Patch

on:
  push:
    branches:
      - world-013-plan-507
    paths:
      - '.github/workflows/world-013-plan-507-self-patch.yml'

permissions:
  contents: write

jobs:
  patch-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-013-plan-507
      - name: Record shipped WORLD-013 slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MINECRAFT_RPG_TOOLING_PLAN.md')
          s = p.read_text(encoding='utf-8')
          marker = "PR #506 / implementation head `1c62d55559d756a1399949ea65b9c97f035302df` routes collision-blocked CALM roaming toward the same deterministic authored target through Minecraft native navigation when a leash-safe path can start, retaining the deterministic angular detour as fallback."
          addition = marker + " PR #507 / merge `1ff554ab1c6a00711225a7fa57a216fec91d27e9` adds server-side stalled-route recovery for canonical Marea CALM navigation: after three consecutive low-progress samples, the stale Minecraft path is revoked and horizontal impulse cleared so the existing leash-safe navigator/detour authority can recalculate without changing encounter identity or PTU rules."
          if addition in s:
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('WORLD-013 #506 marker not found')
          p.write_text(s.replace(marker, addition, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MINECRAFT_RPG_TOOLING_PLAN.md
          git commit -m 'WORLD-013: record stalled navigation recovery (#507)'
          git push origin HEAD:world-013-plan-507
