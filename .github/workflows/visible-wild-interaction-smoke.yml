name: Visible Wild Interaction Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare production Fabric + Cobblemon mods
        run: gradle :fabric-adapter:prepareProductionSmokeMods --no-daemon
      - name: Boot real server and prove visible wild binding
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$PWD/visible-wild-smoke"
          mkdir -p "$server_dir/mods"
          cp fabric-adapter/build/production-smoke/mods/*.jar "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"
          curl -fsSL \
            -o "$server_dir/fabric-server-launch.jar" \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.17.2/1.0.3/server/jar'

          (
            cd "$server_dir"
            exec java \
              -Dautoptu.liveVisibleWildEncounterSmoke=true \
              -Xms512M -Xmx2G \
              -jar fabric-server-launch.jar nogui > ../visible-wild-server.log 2>&1
          ) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 180); do
            latest="$server_dir/logs/latest.log"
            if grep -q 'AutoPTU live visible wild encounter smoke passed' "$latest" 2>/dev/null \
              && grep -q 'AutoPTU Fabric server adapter initialized' "$latest" 2>/dev/null \
              && grep -q 'Done (' "$latest" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat visible-wild-server.log || true
            cat "$server_dir/logs/latest.log" 2>/dev/null || true
            exit 1
          fi

          grep 'AutoPTU live visible wild encounter smoke passed' "$server_dir/logs/latest.log"
